<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e8f0ff">
<title>Living Word — Offline ESV Discipleship</title>

<style>
/* LIVING WORD — Liquid Glass design tokens & core surfaces
   Doctrine of light: one source, above; light descends onto the Word.
   Palette: "Daybreak at the Gates" — a luminous, light-filled sanctuary.  */

:root {
  /* ------------------------------------------------ palette: daybreak */
  --sky-high:    #cfe2ff;   /* upper heaven, coolest light              */
  --sky-mid:     #e8f0ff;
  --sky-low:     #fff6e4;   /* warm horizon glow                        */
  --vellum:      #fffdf7;   /* glowing digital paper                    */
  --gold-deep:   #9a6d12;   /* gold that stays legible AS TEXT on light */
  --gate-gold:   #efb63c;   /* structural gold: borders, rules          */
  --gate-gold-bright: #ffd977;
  --ray-white:   #fffdf4;
  --dawn-rose:   #f0a98d;
  --olive:       #7ea36a;
  --water:       #5f9fc4;
  --ink:         #1b2340;   /* deep indigo — 12:1 on vellum             */
  --ink-dim:     rgba(27,35,64,.66);
  --ink-faint:   rgba(27,35,64,.42);

  /* ------------------------------------------------ liquid glass core  */
  --glass-blur: 22px;
  --glass-sat: 165%;
  --glass-bg: rgba(255,255,255,0.52);
  --glass-bg-raised: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.9);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.95);
  --glass-radius: 22px;
  --glass-radius-sm: 14px;

  /* neumorphic depth — soft indigo shadow, never muddy grey */
  --depth-far:  0 16px 40px rgba(46,72,140,.16);
  --depth-near: 0 2px 8px rgba(46,72,140,.10);
  --depth-pressed: inset 0 3px 10px rgba(46,72,140,.18), inset 0 1px 2px rgba(46,72,140,.14);

  /* heavenly light properties */
  --halo: radial-gradient(closest-side, rgba(255,217,119,.55), transparent 72%);
  --beam-gradient: linear-gradient(180deg,
      rgba(255,253,244,.95) 0%, rgba(255,217,119,.45) 44%, rgba(255,217,119,0) 100%);
  --dawn-sky: linear-gradient(180deg,
      var(--sky-high) 0%, var(--sky-mid) 42%, var(--sky-low) 100%);

  /* type scale */
  --font-scripture: 'New York', Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --font-ui: 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  --scripture-size: 18px;
  --scripture-leading: 1.68;
  --scripture-measure: 34em;

  /* springs (documented; JS reads these via getComputedStyle if needed) */
  --spring-ui-zeta: 0.92;     /* interaction spring damping ratio  */
  --spring-ui-omega: 14;      /* rad/s                             */
  --dur-liturgical: 640ms;    /* slow, weighted default            */
  --ease-settle: cubic-bezier(.22,.9,.28,1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
body {
  background: var(--dawn-sky);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ------------------------------------------------------------ surfaces */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border: 1px solid var(--glass-border);
  border-radius: var(--glass-radius);
  box-shadow: var(--depth-far), var(--depth-near), var(--glass-highlight);
}
.glass--raised { background: var(--glass-bg-raised); }
.glass--pressed { box-shadow: var(--depth-pressed); }

/* chromatic aberration — display headings ONLY, never Scripture text */
.ca-heading {
  text-shadow: 1px 0 0 rgba(255,120,90,.10), -1px 0 0 rgba(90,140,255,.10);
}

.halo { position: relative; }
.halo::before {
  content: ''; position: absolute; inset: -34%;
  background: var(--halo); pointer-events: none; z-index: -1;
}

/* ----------------------------------------------------------- scripture */
.scripture {
  font-family: var(--font-scripture);
  font-size: var(--scripture-size);
  line-height: var(--scripture-leading);
  max-width: var(--scripture-measure);
  margin-inline: auto;
  color: var(--ink);
  text-rendering: optimizeLegibility;
}
.scripture .vnum {
  font-family: var(--font-ui); font-size: .62em; vertical-align: super;
  color: var(--gold-deep); opacity: .85; margin-right: .28em; user-select: none;
}
.scripture .hl-gold  { background: rgba(255,200,60,.30); border-radius: 3px; }
.scripture .hl-dawn  { background: rgba(240,169,141,.30); border-radius: 3px; }
.scripture .hl-olive { background: rgba(126,163,106,.26); border-radius: 3px; }
.scripture .hl-water { background: rgba(95,159,196,.26); border-radius: 3px; }
.copyright-notice {
  font-size: 11px; color: var(--ink-faint); text-align: center;
  padding: 10px 18px 22px; max-width: 34em; margin-inline: auto;
}

/* ------------------------------------------------------------- buttons */
.btn {
  font-family: var(--font-ui); font-size: 15px; font-weight: 600;
  color: var(--ink); letter-spacing: .02em;
  padding: 13px 22px; border-radius: var(--glass-radius-sm);
  background: var(--glass-bg-raised);
  border: 1px solid var(--glass-border);
  box-shadow: var(--depth-near), var(--glass-highlight);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  cursor: pointer;
  transition: transform 180ms var(--ease-settle), box-shadow 180ms var(--ease-settle);
}
.btn:active { transform: scale(.97); box-shadow: var(--depth-pressed); }
.btn:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 2px; }
.btn--gold {
  background: linear-gradient(180deg, #ffe6a8, #ffcf6b);
  border-color: rgba(255,255,255,.95);
  color: #4a3505;
}

/* ---------------------------------------------------------- app frames */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.active { display: flex; }
.screen-body { flex: 1; overflow-y: auto; padding: 18px 18px 110px; } /* clear the tabbar */

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
}
.topbar h1 {
  font-size: 19px; font-weight: 700; margin: 0; color: var(--gold-deep);
  font-family: var(--font-scripture); letter-spacing: .03em;
}

.tabbar {
  display: flex; justify-content: space-around;
  margin: auto 14px calc(env(safe-area-inset-bottom, 0px) + 14px); /* auto top: pin to bottom */
  padding: 8px;
  position: relative; z-index: 5;                /* floats above the screen layers */
}
.tabbar button {
  flex: 1; background: none; border: 0; color: var(--ink-dim);
  font: 600 12px var(--font-ui); padding: 9px 4px; border-radius: 12px;
  cursor: pointer; transition: color 240ms, background 240ms;
}
.tabbar button .glyph { display: block; font-size: 20px; margin-bottom: 3px; }
.tabbar button.on {
  color: var(--gold-deep);
  background: linear-gradient(180deg, rgba(255,217,119,.55), rgba(255,217,119,.28));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
}

.card { padding: 18px; margin-bottom: 14px; }
.card h3 { margin: 0 0 6px; font-family: var(--font-scripture); color: var(--gold-deep); }
.card p { margin: 0; color: var(--ink-dim); font-size: 14px; line-height: 1.55; }

/* volumetric ambient beam behind content (CSS fallback layer) */
.ambient-beam {
  position: fixed; top: -10vh; left: 50%; width: 72vw; height: 78vh;
  transform: translateX(-50%) perspective(600px) rotateX(18deg);
  background: var(--beam-gradient);
  clip-path: polygon(36% 0, 64% 0, 100% 100%, 0 100%);
  filter: blur(20px); opacity: .8; pointer-events: none; z-index: 0;
}

/* ------------------------------------------------ page-flip book stage */
.book-stage {
  perspective: 2200px; perspective-origin: 50% 42%;
  position: relative; flex: 1; overflow: hidden;
  margin-bottom: 88px;                           /* clear the tabbar */
  /* the turn gesture must never double as text selection */
  user-select: none; -webkit-user-select: none;
  touch-action: pan-y;
}
.leaf {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transform-origin: left center;
  will-change: transform;
}
/* Light through paper is painted as the page's OWN background layers, not
   as overlay elements. An overlay inside preserve-3d gets promoted to its
   own composited layer, which then composites against the page backdrop
   instead of the leaf — visibly stranding glyph runs on the sky. Baking
   the light into the background also reads truer: the paper glows while
   the ink stays ink.
   Layer 1: the light bloom that follows the fold (--crease/--translucency)
   Layer 2: the specular band riding the crease itself
   Layer 3: the raking sheen across the sheet
   Layer 4: the vellum stock                                             */
.leaf .face {
  position: absolute; inset: 0; padding: 26px 22px 40px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background:
    radial-gradient(130% 95% at calc(var(--crease, 100%)) 32%,
      rgba(255,251,236, calc(var(--translucency, 0) * .92)),
      rgba(255,244,214, calc(var(--translucency, 0) * .38)) 42%,
      rgba(255,244,214, 0) 68%),
    linear-gradient(90deg,
      rgba(255,255,255,0) calc(var(--crease, 100%) - 9%),
      rgba(255,255,255, calc(var(--translucency, 0) * .9)) var(--crease, 100%),
      rgba(255,255,255,0) calc(var(--crease, 100%) + 9%)),
    linear-gradient(105deg, rgba(255,255,255,.9), rgba(255,255,255,0) 34%),
    linear-gradient(180deg, var(--vellum), #fdf4e2);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 6px 18px 18px 6px;
  box-shadow: var(--depth-far), var(--glass-highlight);
  overflow-y: auto;
}
/* While the leaf is in motion the face must not be a scroll container:
   Chromium composites the scrolling contents separately from the face's
   background inside a preserve-3d layer, which strands glyph runs on the
   page backdrop. A turning page isn't scrollable anyway. */
.book-stage.flipping .leaf .face { overflow: hidden; }
/* Approaching edge-on the leaf hands off to its reverse: a blank vellum
   back, never mirrored text. Driven from the flip loop rather than
   backface-visibility, which a scrollable face defeats in some engines. */
.leaf .face.front { opacity: var(--front-vis, 1); }
.leaf .face.back {
  transform: rotateY(180deg); border-radius: 18px 6px 6px 18px;
  opacity: var(--back-vis, 0);
}

/* The page underneath, revealed as the leaf lifts away. Its shadow lives
   inside it, so the flat overlay can never sort in front of the 3D leaf. */
.under-leaf {
  position: absolute; inset: 0; border-radius: 6px 18px 18px 6px;
  background: linear-gradient(180deg, #fdf8ec, #f7ecd6);
  border: 1px solid rgba(255,255,255,.85);
  box-shadow: inset 0 0 60px rgba(46,72,140,.06);
  overflow: hidden;
}
.page-shadow {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(46,72,140,.28), transparent 42%);
  opacity: var(--under-shadow, 0);
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
<style>
/* LIVING WORD — screen & game styling (builds on liquid-glass.css tokens) */

/* ------------------------------------------------------------- splash */
#splash { position: fixed; inset: 0; z-index: 50; display: none; background: var(--sky-mid); }
#splash-gl { position: absolute; inset: 0; width: 100%; height: 100%; }
#splash-book {
  position: absolute; left: 50%; top: 44%;
  width: min(46vw, 240px); height: min(60vw, 320px);
  transform-style: preserve-3d; opacity: 0; pointer-events: none;
}
#splash-book .board {
  position: absolute; inset: 0; border-radius: 6px 14px 14px 6px;
  background: linear-gradient(120deg, #2c3e78, #16224a 72%);
  border: 1px solid rgba(255,217,119,.85);
  box-shadow: 0 0 64px rgba(255,232,170, calc(.5 + var(--book-bloom, 0) * .5)),
              inset 0 0 30px rgba(255,217,119,.30);
}
#splash-book .board::after {           /* gilded page edges */
  content: ''; position: absolute; right: -5px; top: 3%; bottom: 3%; width: 7px;
  background: linear-gradient(180deg, #fffdf4, var(--gate-gold-bright));
  border-radius: 3px; box-shadow: 0 0 14px rgba(255,232,170,.95);
}
#splash-book .leaf3d {
  position: absolute; inset: 0; transform-origin: left center;
  transform-style: preserve-3d; border-radius: 6px 14px 14px 6px;
  background: linear-gradient(105deg, #fffdf7, #ffeec4);
  box-shadow: 0 0 calc(18px + var(--translucency, 0) * 48px)
              rgba(255,248,220, calc(.5 + var(--translucency, 0) * .5));
  will-change: transform;
}
#splash-book .cover {
  background: linear-gradient(105deg, #35498a, #1b2a58 62%);
  border: 1px solid rgba(255,217,119,.9);
}
#splash-book .cover::before {
  content: '✝'; position: absolute; inset: 0; display: grid; place-items: center;
  color: #fffdf4; font-size: 44px;
  text-shadow: 0 0 26px rgba(255,232,170,1);
}
#splash-title {
  position: absolute; left: 50%; top: 66%; transform: translateX(-50%);
  text-align: center; opacity: 0; width: min(88vw, 480px);
}
#splash-title h1 {
  font: 700 34px/1.1 var(--font-scripture); letter-spacing: .22em;
  color: #4a3505; margin: 0;
  text-shadow: 0 2px 26px rgba(255,255,255,.95);
}
#splash-title p { color: #5c4a2a; font: italic 13px/1.6 var(--font-scripture); }

/* ------------------------------------------------------------- reader */
.reader-nav { display: flex; gap: 8px; padding: 0 18px 10px; z-index: 2; }
.reader-nav select {
  flex: 1; padding: 10px 12px; border-radius: var(--glass-radius-sm);
  background: var(--glass-bg-raised); color: var(--ink);
  border: 1px solid var(--glass-border); font: 600 14px var(--font-ui);
  backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--depth-near), var(--glass-highlight);
}
.reader-nav select option { background: #fffdf7; color: var(--ink); }
.chapter-title {
  text-align: center; font: 700 15px var(--font-scripture);
  color: var(--gold-deep); letter-spacing: .14em; margin: 8px 0 14px;
}
.no-text-notice { text-align: center; padding: 40px 24px; color: var(--ink-dim);
  font-size: 14px; line-height: 1.7; }

/* -------------------------------------------------------------- games */
.game-title { font-family: var(--font-scripture); color: var(--gold-deep); margin: 4px 0 2px; }
.game-sub { color: var(--ink-dim); font-size: 13px; margin: 0 0 14px; }

.vb-line { min-height: 64px; padding: 14px; border-radius: var(--glass-radius-sm);
  border: 1px dashed rgba(154,109,18,.5); background: rgba(255,255,255,.55);
  margin-bottom: 16px; }
.vb-word { opacity: 0; transition: opacity 480ms var(--ease-settle), text-shadow 480ms; }
.vb-word.lit { opacity: 1; text-shadow: 0 0 14px rgba(255,200,60,.8); }
.vb-complete { border-style: solid; border-color: var(--gate-gold);
  box-shadow: 0 0 34px rgba(255,207,107,.55); }
.vb-pool { display: flex; flex-wrap: wrap; gap: 9px; }
.vb-tile { font: 600 15px var(--font-scripture); color: var(--ink);
  padding: 10px 14px; border-radius: 12px; cursor: pointer; }
.vb-tile.vb-set { opacity: .22; }
.vb-nudge { animation: nudge 560ms var(--ease-settle); }
@keyframes nudge {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); } 60% { transform: translateX(4px); }
}

.tl-river { display: flex; gap: 4px; height: 10px; margin: 6px 0 14px; }
.tl-segment { flex: 1; border-radius: 5px; background: rgba(46,72,140,.12);
  transition: background 640ms, box-shadow 640ms; }
.tl-segment.lit { background: linear-gradient(90deg, var(--gate-gold), #fffdf4);
  box-shadow: 0 0 18px rgba(255,207,107,.85); }
.tl-slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; margin-bottom: 14px; }
.tl-pool { display: flex; flex-wrap: wrap; gap: 9px; }
.tl-card { display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
  padding: 10px 14px; border-radius: 12px; color: var(--ink); cursor: pointer;
  font-family: var(--font-ui); }
.tl-card small { color: var(--ink-dim); }
.tl-card.tl-placed { border-color: var(--gate-gold); opacity: .95; cursor: default;
  box-shadow: 0 0 18px rgba(255,207,107,.4); }

.sp-stage { padding: 20px; text-align: center; }
.sp-art { font-size: 44px; margin-bottom: 8px; }
.sp-verse { font-size: 15px; margin: 0 0 12px; }
.sp-q { font: 600 15px var(--font-ui); color: var(--gold-deep); }
.sp-choice { display: block; width: 100%; margin-top: 9px; }
.sp-path { display: flex; justify-content: center; gap: 18px; margin-top: 14px;
  font-size: 26px; color: rgba(46,72,140,.20); }
.sp-step.lit { color: var(--gate-gold); text-shadow: 0 0 16px rgba(255,207,107,.95); }

.game-celebrate { margin-top: 18px; padding: 16px; text-align: center;
  opacity: 0; transform: translateY(8px);
  transition: opacity var(--dur-liturgical) var(--ease-settle),
              transform var(--dur-liturgical) var(--ease-settle); }
.game-celebrate.shown { opacity: 1; transform: none; }
.lamp-glyph { font-size: 30px; }

/* ------------------------------------------------------------ track B */
#constellation-canvas { width: 100%; height: 300px; border-radius: var(--glass-radius);
  border: 1px solid var(--glass-border); box-shadow: var(--depth-far); }
.dbs-q { display: block; padding: 14px; margin-bottom: 12px; }
.dbs-q span { display: block; font: 600 14px var(--font-ui); color: var(--gold-deep);
  margin-bottom: 8px; }
.dbs-q textarea { width: 100%; background: rgba(255,255,255,.8); color: var(--ink);
  border: 1px solid rgba(46,72,140,.18); border-radius: 10px; padding: 10px;
  font: 14px/1.5 var(--font-ui); resize: vertical; }
.vocab-card { padding: 16px; margin-bottom: 12px; }
.vocab-card .lemma { font-size: 22px; color: var(--gold-deep); font-family: var(--font-scripture); }
.vocab-card .translit { font-style: italic; color: var(--ink-dim); margin-left: 8px; }
.ledger-gen { margin: 10px 0 4px; font: 700 12px var(--font-ui); letter-spacing: .12em;
  color: var(--gold-deep); text-transform: uppercase; }
.ledger-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 8px; }
.ledger-add { display: flex; gap: 8px; margin-top: 12px; }
.ledger-add input { flex: 1; background: rgba(255,255,255,.8); color: var(--ink);
  border: 1px solid rgba(46,72,140,.18); border-radius: 10px; padding: 10px;
  font: 14px var(--font-ui); }

.lesson-step { padding: 14px 16px; margin-bottom: 10px; }
.lesson-step .kind { font: 700 11px var(--font-ui); letter-spacing: .16em;
  text-transform: uppercase; color: var(--gold-deep); display: block; margin-bottom: 5px; }
.christ-box { border-color: var(--gate-gold);
  background: linear-gradient(180deg, rgba(255,217,119,.42), rgba(255,217,119,.16));
  box-shadow: 0 0 30px rgba(255,207,107,.35), var(--glass-highlight); }
.game-host { margin-top: 10px; }
.back-link { background: none; border: 0; color: var(--gold-deep); font: 600 14px var(--font-ui);
  cursor: pointer; padding: 6px 0; }

</style>
</head>

<!-- ambient volumetric beam (CSS layer under all screens) -->
<div class="ambient-beam" aria-hidden="true"></div>

<div id="app">

  <!-- ============================ SPLASH ============================ -->
  <div id="splash" aria-label="Opening: light descends upon the Word">
    <canvas id="splash-gl"></canvas>
    <div id="splash-book">
      <div class="board"></div>
      <div class="leaf3d fan"></div>

      <div class="leaf3d fan"></div>

         will stand forever.” — Isaiah 40:8</p>

  </div>

  <!-- ============================= HOME ============================= -->
  <section class="screen" id="screen-home">
    <header class="topbar"><h1>Living Word</h1></header>
    <div class="screen-body"></div>

      <select id="sel-chapter" aria-label="Chapter"></select>

        <div class="face back"></div>

    </div>

    <header class="topbar"><h1>Learn</h1></header>

  <!-- ============================ TABBAR ============================ -->
  <nav class="tabbar glass">

    <button data-screen="study"><span class="glyph">🌌</span>Study</button>

</div>

r them.","multiply_step":"Act out the lost-sheep story with a stuffed animal for someone younger than you.","memory_verse":{"ref":"Psalm 23:1","b":19,"c":23,"vs":1,"ve":1},"steps":[{"kind":"hear","body":"A shepherd counted his sheep: ...97, 98, 99 — one was missing! Did he say 'ninety-nine is plenty'? Never. He walked into the dark hills, calling and searching, until the lost one was found and safe on his shoulders."},{"kind":"play","body":"Lead the lamb along the Shepherd's Path.","game_id":"shepherd-path"},{"kind":"say","body":"Memory verse: 'The LORD is my shepherd; I shall not want.'"},{"kind":"live","body":"When you feel lost or afraid, remember: the Shepherd knows your name and He is already looking for you."}]},{"id":"A1-03","title":"One Big Story","passage_ref":"Luke 24:27","ref":{"b":42,"c":24,"vs":27,"ve":27},"big_truth":"The whole Bible — from the very first page — is one story that leads to Jesus.","christ_connection":"Creation, the promise, the kings, the prophets — every part of the story points ahead to Jesus, the Rescuer God promised.","obedience_step":"Ask a grown-up to show you their favorite Bible story and find where it sits on the timeline.","multiply_step":"Teach the order of the big story (Creation → Promise → Jesus → Church) to a friend using your fingers.","memory_verse":{"ref":"Psalm 119:105","b":19,"c":119,"vs":105,"ve":105},"steps":[{"kind":"hear","body":"The Bible is not a box of little stories. It is one river, flowing from the garden all the way to Jesus and then out to the whole world."},{"kind":"play","body":"Place the great events on the river of light, in order.","game_id":"great-timeline"},{"kind":"say","body":"Memory verse: 'Thy word is a lamp unto my feet, and a light unto my path.'"},{"kind":"live","body":"Every time you read the Bible, ask the treasure question: where is Jesus in this story?"}]},{"id":"A1-04","title":"The Greatest Gift","passage_ref":"John 3:16-17","ref":{"b":43,"c":3,"vs":16,"ve":17},"big_truth":"God loved the world so much that He gave His only Son, so that everyone who believes in Him has life forever.","christ_connection":"This IS the gospel: Jesus died for our sins and rose again. Believing in Him is not earning a prize — it is receiving a gift.","obedience_step":"Talk to God in your own words: thank Him for giving Jesus, and tell Him you want to follow Him.","multiply_step":"John 3:16 is good news for every person on earth. Who will you share it with this week? Say their name out loud.","memory_verse":{"ref":"John 3:16","b":43,"c":3,"vs":16,"ve":16},"steps":[{"kind":"hear","body":"A gift is not a gift if you have to pay for it. God gave the most precious gift there ever was — His own Son — so that we could come home to Him."},{"kind":"play","body":"Build John 3:16 — the verse missionaries have carried to every nation.","game_id":"verse-builder"},{"kind":"say","body":"Say John 3:16 and put your own name in it: 'For God so loved ______...'"},{"kind":"live","body":"You never have to make God love you. He already did the loving first (Romans 5:8)."}]}]}]},"trackB":{"name":"Disciples — 13 to Adult","courses":[{"course":1,"title":"The Gospel of the Kingdom","studies":[{"id":"B1-01","title":"The Word Became Flesh","passage_ref":"John 1:1-14","ref":{"b":43,"c":1,"vs":1,"ve":14},"big_truth":"Jesus is not merely a messenger from God; He is God the Son, the eternal Word, who entered His own creation.","christ_connection":"John deliberately opens with Genesis 1 language ('In the beginning') to declare that the Creator has become the Redeemer. The Word who spoke light now shines as the Light.","context":"John writes so that 'you may believe that Jesus is the Christ, the Son of God' (John 20:31). 'Logos' (Word) spoke both to Jewish readers (God's creative word, Gen 1; Ps 33:6) and to Greek readers (the rational principle behind the cosmos). John claims both streams find their fulfillment in a person.","dbs":["What does this passage say about God?","What does it say about people ],"obedience_step":"Write out the four Romans Road verses on a card (or in your notes here) and practice sharing them in under five minutes.","multiply_step":"Share the Romans Road with one person this week. Record their name in your multiplication ledger and keep praying for them."},{"id":"B1-03","title":"Sent Ones: The Commission and the Church","passage_ref":"Matthew 28:18-20; 2 Timothy 2:2","ref":{"b":40,"c":28,"vs":18,"ve":20},"big_truth":"The risen King commands His people to make disciples of all nations — and discipleship is designed to multiply through four generations.","christ_connection":"The Commission rests entirely on Christ's authority ('All authority... has been given to me') and His presence ('I am with you always'). Mission is not our project for God; it is Christ's own work through us.","context":"Matthew ends where the church begins. 2 Timothy 2:2 shows the mechanism: Paul → Timothy → faithful ones → others also. Four generations in one verse. A church is planted when disciples gather around the Word, baptize, break bread, and raise their own leaders (Acts 2:42-47; Titus 1:5).","dbs":["What has Jesus been given, and what does that mean for the nations — and for my neighborhood?","What exactly are we commanded to do: make converts, or make disciples who obey? What is the difference?","What would a simple church look like in my home or village — Word, prayer, bread, baptism, leaders?","Name your 'Timothy' — the person you are training who will train others. If you have none, who could be the first?"],"apologetic":"Objection: 'Mission is cultural imperialism.' The gospel is the one message that dignifies every culture equally: every nation, tribe, and tongue is invited as-is to the same table (Rev 7:9). Church-planting done biblically raises LOCAL leaders and puts the Word in LOCAL hands — this app exists to make itself unnecessary.","vocab":["gk-ekklesia","heb-hesed"],"obedience_step":"Begin the 3/3rds pattern with your group this week: Look Back (accountability), Look Up (new passage), Look Forward (goal and prayer).","multiply_step":"Open your multiplication ledger and write the names of your first generation. Pray over each name daily."}]}]},"vocab":[{"id":"gk-logos","lemma":"λόγος","language":"greek","translit":"logos","gloss":"word, message, reason","teaching":"In John 1, the eternal self-expression of God — not merely speech about God, but God the Son Himself. Used ~330x in the NT.","key_refs":["John 1:1","John 1:14","1 John 1:1","Revelation 19:13"]},{"id":"gk-dikaiosyne","lemma":"δικαιοσύνη","language":"greek","translit":"dikaiosynē","gloss":"righteousness, justice","teaching":"The status of being in the right before God. Romans' central theme: a righteousness from God, given to sinners through faith in Christ (Rom 3:21-26).","key_refs":["Romans 1:17","Romans 3:22","2 Corinthians 5:21"]},{"id":"gk-charis","lemma":"χάρις","language":"greek","translit":"charis","gloss":"grace, unmerited favor","teaching":"God's free, undeserved kindness — the opposite of wages. Grace is not God ignoring sin, but God paying for it Himself.","key_refs":["Ephesians 2:8-9","Romans 6:23","Titus 2:11"]},{"id":"gk-ekklesia","lemma":"ἐκκλησία","language":"greek","translit":"ekklēsia","gloss":"assembly, church","teaching":"The called-out gathering of Christ's people — never a building in the NT, always a people. The goal of missions is planting these worshiping communities everywhere.","key_refs":["Matthew 16:18","Acts 2:42-47","Ephesians 1:22-23"]},{"id":"heb-hesed","lemma":"חֶסֶד","language":"hebrew","translit":"hesed","gloss":"steadfast love, covenant loyalty","teaching":"God's loyal, promise-keeping love — the 'goodness and mercy' that pursues David in Psalm 23:6. Fulfilled in Christ, who keeps covenant for us.","key_refs":["Psalm 23:6","Exodus 34:6-7","Lamentations 3:22-23"]}],"timeline_events":[{"id":"creation","order":1,"label":"Creation","ref":"Genesis 1"},{"id":"fall","order":2,"label":"The Fall","ref":"Genesis 3"},{"id /* ======== pageflip.js ======== */
/* LIVING WORD — 3D interactive page-flip engine
   Physics (DESIGN.md §3.2):
     spring  a = -k(p - target) - c·v   with  k = 170, c = 24
     (slightly under-damped: ζ = c / (2√k) ≈ 0.921 → one soft settle)
     integrated semi-implicit Euler at a fixed 60 Hz step.
   FLIP_LUT_39 is the canonical 39-frame interpolation map sampled from that
   exact spring (0 → 1), used for reduced-motion devices and to keep the
   splash-screen book opening on the identical curve.
   Light-through-paper: translucency = sin(p·π) — brightest mid-turn as the
   page crosses the beam; crease specular band follows the fold.            */


const SPRING_K = 170;
const SPRING_C = 24;
const DT = 1 / 60;

/* Deterministically sample the release spring from p=0 → target=1 for 39
   fixed steps. This IS the 39-frame interpolation map — generated from the
   physics so curve and LUT can never drift apart.                          */
function buildLut(frames) {
  const lut = new Float64Array(frames);
  let p = 0, v = 0;
  for (let i = 0; i < frames; i++) {
    const a = -SPRING_K * (p - 1) - SPRING_C * v;
    v += a * DT;
    p += v * DT;
    lut[i] = p;
  }
  lut[frames - 1] = 1; // pin the settle
  return lut;
}
const FLIP_LUT_39 = buildLut(39);

/* Sample the LUT with linear interpolation; t in [0,1]. */
function sampleLut(lut, t) {
  if (t <= 0) return 0;
  if (t >= 1) return lut[lut.length - 1];
  const x = t * (lut.length - 1);
  const i = Math.floor(x);
  const f = x - i;
  return lut[i] * (1 - f) + lut[i + 1] * f;
}

/**

 *

class PageFlip {

    if (!fromRight && !fromLeft && !this.animating) return;

    const dir = this.animating ? this.dir : (fromRight ? +1 : -1);
    if (!this.animating && !this.canGo(dir)) return;

    // Interruption-safe: capture the live spring state and hand it to the finger.
    this.dragging = true;
    this.animating = false;
    this.dir = dir;
    this._lastX = e.clientX;
    this._velX = 0;
    this._lastT = performance.now();
    this.stage.setPointerCapture(e.pointerId);
    if (this.dir === -1 && this.p === 0) this.p = 0; // back-turn starts folded from left
    this._render();
  }

  _move(e) {
    if (!this.dragging) return;
    const now = performance.now();
    const w = this.stage.clientWidth;
    const dx = e.clientX - this._lastX;
    const dt = Math.max((now - this._lastT) / 1000, 1e-4);
    this._velX = 0.8 * this._velX + 0.2 * (dx / w / dt);   // screen-widths/s, smoothed
    this._lastT = now;
    this._lastX = e.clientX;
    // forward turn: dragging left increases p; back turn: dragging right does
    this.p = clamp(this.p + (this.dir === 1 ? -dx : dx) / w, 0, 1);
    this._render();
  }

  _up(e) {
    if (!this.dragging) return;
    this.dragging = false;
    // Commit if past halfway OR flung ≥ 0.9 screen-widths/s in the turn direction.
    const fling = this.dir === 1 ? -this._velX : this._velX;
    this.target = (this.p > 0.5 || fling >= 0.9) ? 1 : 0;
    this.v = fling * (this.target === 1 ? 1 : -0.4); // carry finger momentum into the spring
    this._startSpring();
  }

  /* Edge-tap / button turn: full spring animation from rest. */
  turn(dir) {
    if (this.animating || this.dragging || !this.canGo(dir)) return;
    this.dir = dir;
    this.p = 0;
    this.v = 0;
    this.target = 1;
    if (this.reduced) return this._lutPlayback();
    this._startSpring();
  }

  /* ------------------------------------------------------------- physics */
  _startSpring() {
    this.animating = true;
    this._acc = 0;
    this._lastT = performance.now();
    requestAnimationFrame((t) => this._springFrame(t));
  }

  _springFrame(now) {
    if (this.dragging || !this.animating) return;
    this._acc += Math.min((now - this._lastT) / 1000, 0.05);
    this._lastT = now;
    // fixed-step integration keeps the curve identical across refresh rates
    while (this._acc >= DT) {
      const a = -SPRING_K * (this.p - this.target) - SPRING_C * this.v;
      this.v += a * DT;
      this.p += this.v * DT;
      this._acc -= DT;
    }
    const settled = Math.abs(this.p - this.target) < 0.0012 && Math.abs(this.v) < 0.02;
    if (settled) { this.p = this.target; this.v = 0; }
    this._render();
    if (settled) return this._finish();
    requestAnimationFrame((t) => this._springFrame(t));
  }

  /* Reduced-motion / low-GPU path: step through the canonical 39 frames. */
  _lutPlayback() {
    this.animating = true;
    let i = 0;
    const step = () => {
      if (this.dragging) return;
      this.p = FLIP_LUT_39[i++];
      this._render();
      if (i < FLIP_LUT_39.length) requestAnimationFrame(step);
      else this._finish();
    };
    requestAnimationFrame(step);
  }

  _finish() {
    this.animating = false;
    if (this.target === 1) this.onCommit(this.dir);
    this.p = 0;
    this.v = 0;
    this.dir = 0;
    this._render();
  }

  /* ------------------------------------------------------------ painting */
  _render() {
    const p = clamp(this.p, 0, 1);
    this.stage.classList.toggle('flipping', p > 0.0005);
    // cylinder-bend approximation: rotation eases slightly ahead of p at the
    // start (paper lifts before the whole leaf pivots)
    const angle = -180 * p;
    const lift = Math.sin(p * Math.PI) * 6;                 // px z-lift mid-turn
    const glow = Math.sin(p * Math.PI);                     // light through paper
    const leaf = this.leaf;

    if (this.dir >= 0) {
      leaf.style.transformOrigin = 'left center';
      leaf.style.transform = `translateZ(${lift}px) rotateY(${angle}deg)`;
    } else {
      leaf.style.transformOrigin = 'left center';
      leaf.style.transform = `translateZ(${lift}px) rotateY(${-180 + 180 * p}deg)`;
    }
    // backface luminance mix(0, .85, sin(pπ)) and crease specular position
    leaf.style.setProperty('--translucency', String(0.85 * glow));
    leaf.style.setProperty('--crease', `${(1 - p) * 100}%`);
    // Hand off front → back across the edge-on moment (p = 0.5, 90°), where
    // the leaf is nearly invisible and the swap can't be perceived. Fading
    // over a short band also kills any grazing-angle text artifact.
    const band = 0.08;
    leaf.style.setProperty('--front-vis',
      String(clamp((0.5 - p) / band, 0, 1)));
    leaf.style.setProperty('--back-vis',
      String(clamp((p - 0.5) / band, 0, 1)));
    if (this.shadow) this.shadow.style.setProperty('--under-shadow', String(glow * 0.8));
  }
}

/* ======== db.js ======== */
/* LIVING WORD — offline storage engine (PWA mirror of data/schema.sql).
   IndexedDB on the web; the identical logical schema ships as SQLite for
   the Capacitor/Room/Core Data builds. All reads and writes are local;
   nothing ever leaves the device.

   Sandboxed contexts (private modes, embedded frames) can refuse IndexedDB
   entirely. Rather than fail, the engine falls back to an in-memory store
   with the same surface: the app stays fully usable, and only the user's
   notes and progress are session-scoped.                                  */


const DB_NAME = 'living-word';
const DB_VERSION = 1;
const STORES = ['verses','translations','crossrefs','highlights','notes',
                'bookmarks','gameProgress','journal','disciples','meta'];

let _db = null;
let _mem = null;   // set when IndexedDB is unavailable

/* ------------------------------------------- in-memory fallback engine */
function makeMemDb() {
  const data = new Map(STORES.map((s) => [s, new Map()]));
  let autoId = 1;
  const store = (name) => ({
    get: (k) => data.get(name).get(k),
    getAll: (key) => {
      const rows = [...data.get(name).values()];
      return key === undefined ? rows : rows;
    },
    put: (row) => { data.get(name).set(row.key ?? row.id ?? row.k, row); return row; },
    add: (row) => { const id = autoId++; data.get(name).set(id, { ...row, id }); return id; },
    delete: (k) => data.get(name).delete(k),
    index: (idxName) => ({
      getAll: (key) => [...data.get(name).values()].filter((r) =>
        idxName === 'byChapter' ? r.chapterKey === key : r.fromKey === key),
    }),
  });
  return { __mem: true, store };
}

function open() {
  if (_db) return Promise.resolve(_db);
  if (_mem) return Promise.resolve(_mem);
  return new Promise((resolve) => {
    let req;
    try {
      req = indexedDB.open(DB_NAME, DB_VERSION);
    } catch (_) {
      _mem = makeMemDb();
      return resolve(_mem);
    }
    req.onupgradeneeded = () => {
      const db = req.result;
      // Scripture: key 'T|b|c|v' zero-padded so ranges sort correctly.
      db.createObjectStore('verses', { keyPath: 'key' })
        .createIndex('byChapter', 'chapterKey');
      db.createObjectStore('translations', { keyPath: 'id' });
      db.createObjectStore('crossrefs', { keyPath: 'key' })
        .createIndex('byFrom', 'fromKey');
      db.createObjectStore('highlights', { keyPath: 'key' });
      db.createObjectStore('notes', { keyPath: 'id', autoIncrement: true });
      db.createObjectStore('bookmarks', { keyPath: 'key' });
      db.createObjectStore('gameProgress', { keyPath: 'key' });
      db.createObjectStore('journal', { keyPath: 'id', autoIncrement: true });
      db.createObjectStore('disciples', { keyPath: 'id', autoIncrement: true });
      db.createObjectStore('meta', { keyPath: 'k' });
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => { _mem = makeMemDb(); resolve(_mem); };
    req.onblocked = () => { _mem = makeMemDb(); resolve(_mem); };
  });
}

const pad = (n, w) => String(n).padStart(w, '0');
const vKey = (t, b, c, v) => `${t}|${pad(b,2)}|${pad(c,3)}|${pad(v,3)}`;
const cKey = (t, b, c) => `${t}|${pad(b,2)}|${pad(c,3)}`;

function tx(db, store, mode = 'readonly') {
  if (db.__mem) return db.store(store);
  return db.transaction(store, mode).objectStore(store);
}
/* Resolves either an IDBRequest or a plain value from the memory engine. */
const reqP = (r) => (r && typeof r === 'object' && 'onsuccess' in r)
  ? new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })
  : Promise.resolve(r);

/* ------------------------------------------------------------- seeding */
async function ensureSeeded() {
  const db = await open();
  const seeded = await reqP(tx(db, 'meta').get('seeded'));
  if (seeded) return getActiveTranslation();

  // Prefer a licensed ESV bundle if the deployment includes one; otherwise
  // fall back to the public-domain dev seed. Both files are precached by sw.js.
  let data = null;
  try {
    const r = await fetch('data/bible.json');           // produced by tools/import-esv.mjs
    if (r.ok) data = await r.json();
  } catch (_) { /* no licensed bundle in this build */ }
  if (!data) data = await (await fetch('data/seed-verses.json')).json();

  const t = data.translation.id;
  const rows = {
    verses: data.verses.map((r) => ({
      key: vKey(t, r.b, r.c, r.v), chapterKey: cKey(t, r.b, r.c),
      t, b: r.b, c: r.c, v: r.v, text: r.t,
    })),
    crossrefs: (data.crossReferences || []).map((x) => ({
      key: x.from.join('.') + '>' + x.to.join('.'),
      fromKey: x.from.join('.'), from: x.from, to: x.to, theme: x.theme,
    })),
  };

  if (db.__mem) {
    db.store('translations').put(data.translation);
    rows.verses.forEach((r) => db.store('verses').put(r));
    rows.crossrefs.forEach((r) => db.store('crossrefs').put(r));
    db.store('meta').put({ k: 'seeded', v: 1 });
    db.store('meta').put({ k: 'activeTranslation', v: t });
    return data.translation;
  }

  await new Promise((resolve, reject) => {
    const trx = db.transaction(['verses','translations','crossrefs','meta'], 'readwrite');
    trx.objectStore('translations').put(data.translation);
    const vs = trx.objectStore('verses');
    rows.verses.forEach((r) => vs.put(r));
    const xs = trx.objectStore('crossrefs');
    rows.crossrefs.forEach((r) => xs.put(r));
    trx.objectStore('meta').put({ k: 'seeded', v: 1 });
    trx.objectStore('meta').put({ k: 'activeTranslation', v: t });
    trx.oncomplete = resolve;
    trx.onerror = () => reject(trx.error);
  });
  return data.translation;
}

async function getActiveTranslation() {
  const db = await open();
  const m = await reqP(tx(db, 'meta').get('activeTranslation'));
  return reqP(tx(db, 'translations').get(m ? m.v : 'KJV'));
}

/* ------------------------------------------------------------ scripture */
async function getChapter(translationId, bookId, chapter) {
  const db = await open();
  const idx = tx(db, 'verses').index('byChapter');
  const rows = await reqP(idx.getAll(cKey(translationId, bookId, chapter)));
  return rows.sort((a, b) => a.v - b.v);
}

async function getVerse(translationId, bookId, chapter, verse) {
  const db = await open();
  return reqP(tx(db, 'verses').get(vKey(translationId, bookId, chapter, verse)));
}

async function getCrossRefs(bookId, chapter, verse) {
  const db = await open();
  const here = [bookId, chapter, verse].join('.');
  const all = await reqP(tx(db, 'crossrefs').getAll());
  // constellation edges are bidirectional
  return all.filter((x) => x.from.join('.') === here || x.to.join('.') === here);
}

async function getAllCrossRefs() {
  const db = await open();
  return reqP(tx(db, 'crossrefs').getAll());
}

/* ------------------------------------------------------------ user data */
async function toggleHighlight(t, b, c, v, color = 'gold') {
  const db = await open();
  const key = vKey(t, b, c, v);
  const store = tx(db, 'highlights', 'readwrite');
  const existing = await reqP(store.get(key));
  if (existing && existing.color === color) { store.delete(key); return null; }
  const row = { key, t, b, c, v, color, created: Date.now() };
  store.put(row);
  return row;
}

async function getHighlights(t, b, c) {
  const db = await open();
  const all = await reqP(tx(db, 'highlights').getAll());
  return all.filter((h) => h.t === t && h.b === b && h.c === c);
}

async function saveJournal(entry) {
  const db = await open();
  return reqP(tx(db, 'journal', 'readwrite').add({ ...entry, created: Date.now() }));
}

async function getJournal() {
  const db = await open();
  return reqP(tx(db, 'journal').getAll());
}

async function setGameProgress(lessonId, gameId, lampsLit) {
  const db = await open();
  tx(db, 'gameProgress', 'readwrite').put({
    key: `${lessonId}|${gameId}`, lessonId, gameId,
    completed: 1, lampsLit, updated: Date.now(),
  });
}

async function getGameProgress() {
  const db = await open();
  return reqP(tx(db, 'gameProgress').getAll());
}

async function addDisciple(name, generation, parentId = null) {
  const db = await open();
  return reqP(tx(db, 'disciples', 'readwrite')
    .add({ name, generation, parentId, started: Date.now() }));
}

async function getDisciples() {
  const db = await open();
  return reqP(tx(db, 'disciples').getAll());
}

const db = { ensureSeeded, getActiveTranslation, getChapter, getVerse, getCrossRefs, getAllCrossRefs, toggleHighlight, getHighlights, saveJournal, getJournal, setGameProgress, getGameProgress, addDisciple, getDisciples };
/* ======== games.js ======== */
/* LIVING WORD — interactive learning mechanics (Module 4)
   Track A: Verse Builder, The Great Timeline, Shepherd's Path.
   Track B: cross-reference constellation + DBS reflection journal.
   Design rules: no timers, no failure buzzers, no loot, no leaderboards.
   Wrong answers re-read the Word; completion lights a lamp (Ps 119:105).  */


/* Deterministic-feeling gentle shuffle (Fisher–Yates). */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function celebration(container, message) {
  const c = el('div', 'game-celebrate glass halo');
  c.append(el('div', 'lamp-glyph', '🕯️'), el('p', null, message));
  container.append(c);
  requestAnimationFrame(() => c.classList.add('shown'));
}

/* =============================================================== Track A */

/**
 * 1. VERSE BUILDER — the memory verse appears as luminous glass word-tiles
 * scattered in the beam; the child taps them in order. A correct tile
 * "sets" into the verse line with a soft glow; a wrong tile pulses gently
 * and the assembled-so-far text is re-read aloud via speechSynthesis.
 */
function verseBuilder(container, { lessonId, refLabel, verseText, onComplete }) {
  container.innerHTML = '';
  const words = verseText.split(/\s+/);
  let next = 0;

  container.append(el('h3', 'game-title ca-heading', 'Verse Builder'));
  container.append(el('p', 'game-sub', refLabel));
  const line = el('div', 'vb-line scripture');
  const pool = el('div', 'vb-pool');
  container.append(line, pool);

  function accept(tile, w) {
    tile.disabled = true;
    tile.classList.add('vb-set');
    const set = el('span', 'vb-word', (next ? ' ' : '') + w);
    line.append(set);
    requestAnimationFrame(() => set.classList.add('lit'));
    next++;
    if (next === words.length) {
      line.classList.add('vb-complete');
      db.setGameProgress(lessonId, 'verse-builder', 1);
      celebration(container, 'The whole verse shines as one. Say it out loud!');
      if (onComplete) onComplete();
    }
  }

  shuffle(words.map((w, i) => ({ w, i }))).forEach(({ w, i }) => {
    const tile = el('button', 'vb-tile glass', w);
    tile.addEventListener('click', () => {
      // Accept an exact-position match OR an identical duplicate word —
      // children shouldn't be penalized for indistinguishable tiles.
      if (i === next || w === words[next]) {
        accept(tile, w);
      } else {
        tile.classList.remove('vb-nudge');
        void tile.offsetWidth;              // restart the gentle pulse
        tile.classList.add('vb-nudge');
        readAloud(words.slice(0, next).join(' '));
      }
    });
    pool.append(tile);
  });
}

/**
 * 2. THE GREAT TIMELINE — redemptive-history events are placed onto an
 * illuminated river flowing left→right. The child taps the event that
 * comes next; each correct placement lights that segment of the river,
 * visually building the one story that leads to Christ.
 */
function greatTimeline(container, { lessonId, events, onComplete }) {
  container.innerHTML = '';
  const ordered = events.slice().sort((a, b) => a.order - b.order);
  let next = 0;

  container.append(el('h3', 'game-title ca-heading', 'The Great Timeline'));
  container.append(el('p', 'game-sub', 'One story, from the garden to the nations. What happened first?'));

  const river = el('div', 'tl-river');
  ordered.forEach(() => river.append(el('div', 'tl-segment')));
  const slots = el('div', 'tl-slots');
  const pool = el('div', 'tl-pool');
  container.append(river, slots, pool);

  shuffle(ordered).forEach((ev) => {
    const card = el('button', 'tl-card glass', '');
    card.append(el('strong', null, ev.label), el('small', null, ev.ref));
    card.addEventListener('click', () => {
      if (ev.order === ordered[next].order) {
        card.disabled = true;
        card.classList.add('tl-placed');
        slots.append(card);
        river.children[next].classList.add('lit');
        next++;
        if (next === ordered.length) {
          db.setGameProgress(lessonId, 'great-timeline', 1);
          celebration(container,
            'The river of light runs from Creation all the way to Christ and His church — one story!');
          if (onComplete) onComplete();
        }
      } else {
        card.classList.remove('vb-nudge');
        void card.offsetWidth;
        card.classList.add('vb-nudge');
      }
    });
    pool.append(card);
  });
}

/**
 * 3. SHEPHERD'S PATH — a guided quest through Psalm 23 / Luke 15.
 * The child leads a lamb scene by scene by answering comprehension
 * choices drawn from the text. A wrong answer gently re-reads the verse —
 * never a penalty. Ends at the Shepherd who leaves the ninety-nine.
 */
const SHEPHERD_SCENES = [
  {
    art: '🌿', verse: 'He maketh me to lie down in green pastures: he leadeth me beside the still waters. (Psalm 23:2)',
    q: 'Where does the Shepherd lead his sheep to rest?',
    choices: ['Green pastures and still waters', 'A busy city', 'A dry desert'], answer: 0,
  },
  {
    art: '🌑', verse: 'Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me. (Psalm 23:4)',
    q: 'Why does the sheep not need to be afraid in the dark valley?',
    choices: ['Because the valley is short', 'Because the Shepherd is WITH him', 'Because sheep can see in the dark'], answer: 1,
  },
  {
    art: '🐑', verse: 'What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine... and go after that which is lost, until he find it? (Luke 15:4)',
    q: 'What does the shepherd do when ONE sheep is lost?',
    choices: ['Waits for it to come back', 'Says ninety-nine is enough', 'Goes after it until he finds it'], answer: 2,
  },
  {
    art: '🎉', verse: 'And when he hath found it, he layeth it on his shoulders, rejoicing. (Luke 15:5)',
    q: 'How does the shepherd carry the found sheep home?',
    choices: ['On his shoulders, rejoicing', 'He makes it walk behind him', 'He sends another sheep to get it'], answer: 0,
  },
];

function shepherdPath(container, { lessonId, onComplete }) {
  container.innerHTML = '';
  let scene = 0;

  container.append(el('h3', 'game-title ca-heading', "Shepherd's Path"));
  const stage = el('div', 'sp-stage glass');
  const path = el('div', 'sp-path');
  SHEPHERD_SCENES.forEach(() => path.append(el('span', 'sp-step', '·')));
  container.append(stage, path);

  function render() {
    const s = SHEPHERD_SCENES[scene];
    stage.innerHTML = '';
    stage.append(el('div', 'sp-art', s.art));
    stage.append(el('p', 'scripture sp-verse', s.verse));
    stage.append(el('p', 'sp-q', s.q));
    s.choices.forEach((c, i) => {
      const b = el('button', 'btn sp-choice', c);
      b.addEventListener('click', () => {
        if (i === s.answer) {
          path.children[scene].classList.add('lit');
          scene++;
          if (scene === SHEPHERD_SCENES.length) {
            stage.innerHTML = '';
            stage.append(el('div', 'sp-art', '✨🐑✨'));
            stage.append(el('p', 'scripture sp-verse',
              'Likewise joy shall be in heaven over one sinner that repenteth. (Luke 15:7)'));
            db.setGameProgress(lessonId, 'shepherd-path', 1);
            celebration(container, 'The Shepherd carried the lamb all the way home. He is Jesus — and He came looking for you.');
            if (onComplete) onComplete();
          } else {
            render();
          }
        } else {
          // wrong answers re-read the verse rather than penalize
          stage.querySelector('.sp-verse').classList.remove('vb-nudge');
          void stage.offsetWidth;
          stage.querySelector('.sp-verse').classList.add('vb-nudge');
          readAloud(s.verse);
        }
      });
      stage.append(b);
    });
  }
  render();
}

/* =============================================================== Track B */

/**
 * CROSS-REFERENCE CONSTELLATION — the current verse is a star; its
 * cross-references are connected stars across both testaments. Themes
 * (lamb, light, word, shepherd, salvation, mission) render as constellations.
 */
async function constellation(canvas, focusRef /* [b,c,v] or null */) {
  const refs = await db.getAllCrossRefs();
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // Collect unique nodes; x = canonical position (book), y = theme band.
  const themes = [...new Set(refs.map((r) => r.theme))];
  const nodes = new Map();
  const nodeKey = (a) => a.join('.');
  for (const r of refs) {
    for (const p of [r.from, r.to]) {
      const k = nodeKey(p);
      if (!nodes.has(k)) {
        const themeIdx = themes.indexOf(r.theme);
        nodes.set(k, {
          p,
          x: 30 + (p[0] / 66) * (W - 60),
          y: 40 + (themeIdx / Math.max(themes.length - 1, 1)) * (H - 90)
             + Math.sin(p[0] * 3.7 + p[1]) * 14,
        });
      }
    }
  }

  ctx.clearRect(0, 0, W, H);
  // luminous vellum ground — an illuminated manuscript, not a night sky
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#fff4dd');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // OT|NT meridian
  const mx = 30 + (39.5 / 66) * (W - 60);
  ctx.strokeStyle = 'rgba(154,109,18,.30)';
  ctx.setLineDash([3, 7]); ctx.beginPath();
  ctx.moveTo(mx, 16); ctx.lineTo(mx, H - 16); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(27,35,64,.55)'; ctx.font = '10px sans-serif';
  ctx.fillText('OLD TESTAMENT', 30, 14);
  ctx.fillText('NEW TESTAMENT', mx + 10, 14);

  const focusKey = focusRef ? focusRef.join('.') : null;
  // threads of gold
  for (const r of refs) {
    const a = nodes.get(nodeKey(r.from)), b = nodes.get(nodeKey(r.to));
    const hot = focusKey && (nodeKey(r.from) === focusKey || nodeKey(r.to) === focusKey);
    ctx.strokeStyle = hot ? 'rgba(154,109,18,.95)' : 'rgba(199,146,38,.5)';
    ctx.lineWidth = hot ? 1.8 : 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // glowing nodes
  for (const [k, n] of nodes) {
    const hot = k === focusKey;
    const r = hot ? 5 : 3;
    const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 4);
    glow.addColorStop(0, hot ? 'rgba(255,190,60,.75)' : 'rgba(255,207,107,.55)');
    glow.addColorStop(1, 'rgba(255,207,107,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hot ? '#8a5e08' : '#c79226';
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
  }
  return nodes; // caller may hit-test taps against these positions
}

/* ======== splash.js ======== */
/* LIVING WORD — Splash & Opening Experience
   WebGL volumetric god-rays + dust motes under a CSS-3D holographic Bible.
   Timeline (see docs/DESIGN.md §1.3): void → descending shaft → Bible rises →
   cover opens (39-frame curve) → upward bloom + title → light-gate dissolve.
   Entirely offline: shaders inline, zero network. Skippable after 1.5s.      */


const SPLASH_VERT = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

/* God-rays: a top-anchored volumetric shaft with animated dust, plus a
   late-phase upward bloom from the book (uBloom) and radial gate arcs
   for the exit transition (uGate). Warm white→gold only, per §1.2.     */
const SPLASH_FRAG = `
precision mediump float;
uniform vec2  uRes;
uniform float uTime;    // seconds since splash start
uniform float uShaft;   // 0..1 shaft intensity
uniform float uBloom;   // 0..1 upward bloom from opened book
uniform float uGate;    // 0..1 exit gate transition

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), f.x),
             mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;          // 0..1, y up
  // Daybreak sky: warm horizon below, cool luminous heaven above. Kept
  // saturated enough that the brilliant shaft still reads AS a shaft.
  vec3 skyLow  = vec3(1.000, 0.933, 0.769);
  vec3 skyMid  = vec3(0.835, 0.902, 1.000);
  vec3 skyHigh = vec3(0.604, 0.769, 0.973);
  vec3 col = mix(mix(skyLow, skyMid, smoothstep(0.0, 0.55, uv.y)),
                 skyHigh, smoothstep(0.5, 1.0, uv.y));

  vec3 gold  = vec3(1.000, 0.878, 0.560);
  vec3 white = vec3(1.000, 0.992, 0.957);

  // ------- descending volumetric shaft (widens toward the floor)
  float cx = uv.x - 0.5;
  float halfW = mix(0.10, 0.34, 1.0 - uv.y);           // cone
  float core = 1.0 - smoothstep(0.0, halfW, abs(cx));
  // animated volumetric density: two drifting noise octaves
  float dens = 0.70
    + 0.30 * noise(vec2(uv.x * 6.0, uv.y * 3.0 - uTime * 0.12))
    * (0.6 + 0.4 * noise(vec2(uv.x * 14.0 + 7.0, uv.y * 7.0 - uTime * 0.3)));
  float fallY = smoothstep(0.0, 0.35, uv.y);           // fades near floor
  float shaft = core * core * dens * mix(0.55, 1.0, uv.y) * uShaft;
  col += shaft * mix(gold, white, uv.y) * 1.35;
  col += core * fallY * 0.24 * uShaft * gold;          // soft haze
  // broad glow spilling out of the beam, warming the whole sky
  col += (1.0 - smoothstep(0.0, 0.85, abs(cx))) * uShaft * gold * 0.14 * mix(0.4, 1.0, uv.y);

  // ------- dust motes drifting through the beam
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    vec2 gp = uv * (34.0 + fi * 21.0);
    gp.y += uTime * (0.9 + fi * 0.55);
    gp.x += sin(uTime * 0.4 + fi * 2.1) * 0.35;
    vec2 cell = floor(gp);
    vec2 p = fract(gp) - 0.5;
    float sparkle = smoothstep(0.09, 0.0, length(p + (vec2(hash(cell), hash(cell + 9.0)) - 0.5) * 0.6));
    col += sparkle * core * uShaft * white * (0.22 - fi * 0.05);
  }

  // ------- upward bloom from the opened book (light returns to source)
  vec2 bookP = vec2(0.5, 0.34);
  float d = distance(uv * vec2(uRes.x / uRes.y, 1.0), bookP * vec2(uRes.x / uRes.y, 1.0));
  float bloom = exp(-d * d * 7.0) * uBloom;
  float upBeam = (1.0 - smoothstep(0.0, 0.20, abs(cx))) * smoothstep(0.30, 0.95, uv.y) * uBloom;
  col += (bloom * 1.7 + upBeam * 0.85) * mix(gold, white, 0.6);

  // ------- exit: concentric luminous gate arcs (Rev 21:25)
  if (uGate > 0.001) {
    float rings = sin((d * 26.0 - uGate * 22.0)) * 0.5 + 0.5;
    float gate = smoothstep(0.0, 1.0, uGate) * rings * exp(-d * 2.2);
    col = mix(col, white, gate * 0.9 * uGate);
    col = mix(col, white, smoothstep(0.65, 1.0, uGate)); // final white-out
  }

  // barely-there vignette: keeps focus without dimming the sky
  float vig = smoothstep(1.35, 0.5, length(uv - vec2(0.5, 0.45)));
  col *= mix(0.95, 1.0, vig);

  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error('Shader compile failed: ' + gl.getShaderInfoLog(s));
  }
  return s;
}

/* Easing along the 39-frame opening curve shared with the reader engine.  */

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const smooth = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
/* phase(t, start, end) → 0..1 progress of a timeline beat */
const phase = (t, a, b) => clamp01((t - a) / (b - a));

function runSplash(onDone) {
  const root = document.getElementById('splash');
  const canvas = document.getElementById('splash-gl');
  const bookEl = document.getElementById('splash-book');
  const coverEl = bookEl.querySelector('.cover');
  const fanEls = [...bookEl.querySelectorAll('.fan')];
  const titleEl = document.getElementById('splash-title');
  root.style.display = 'block';

  let gl = null, uni = {};
  try {
    gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (gl) {
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, SPLASH_VERT));
      gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, SPLASH_FRAG));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      for (const n of ['uRes','uTime','uShaft','uBloom','uGate']) {
        uni[n] = gl.getUniformLocation(prog, n);
      }
    }
  } catch (e) {
    gl = null; // CSS ambient-beam fallback still shows; splash degrades gracefully
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize();
  addEventListener('resize', resize);

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_END = reduced ? 1.2 : 4.2;
  const t0 = performance.now();
  let skipped = false, finished = false;

  const skip = () => { if ((performance.now() - t0) / 1000 > 1.5) skipped = true; };
  root.addEventListener('pointerdown', skip);

  function finish() {
    if (finished) return;
    finished = true;
    removeEventListener('resize', resize);
    root.style.display = 'none';
    onDone();
  }

  function frame(now) {
    if (finished) return;
    let t = (now - t0) / 1000;
    if (skipped) t = Math.max(t, T_END - 0.45); // jump to the gate dissolve

    // Beat intensities per the visual script
    const shaft = smooth(phase(t, 0.0, 0.8));
    const rise  = smooth(phase(t, 0.8, 1.6));
    const open  = phase(t, 1.6, 2.8);              // fed through the 39-frame LUT
    const bloom = smooth(phase(t, 2.8, 3.4));
    const gate  = smooth(phase(t, 3.6, 4.2));

    if (gl) {
      gl.uniform2f(uni.uRes, canvas.width, canvas.height);
      gl.uniform1f(uni.uTime, t);
      gl.uniform1f(uni.uShaft, shaft * (1 - gate * 0.7));
      gl.uniform1f(uni.uBloom, bloom * (1 - gate));
      gl.uniform1f(uni.uGate, gate);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // ---- 3D holographic Bible rig (CSS 3D over the shader)
    const y = (1 - rise) * 46;                      // rises from beneath
    bookEl.style.opacity = String(rise);
    bookEl.style.transform =
      `translate(-50%, calc(-50% + ${y}vh)) rotateX(14deg) rotateY(${8 * rise}deg)`;

    // Cover opens along the shared page-turn curve; pages fan behind it.
    const eased = sampleLut(FLIP_LUT_39, clamp01(open));
    coverEl.style.transform = `rotateY(${-172 * eased}deg)`;
    coverEl.style.setProperty('--translucency', String(Math.sin(eased * Math.PI)));
    fanEls.forEach((el, i) => {
      const lag = clamp01(open * 1.35 - (i + 1) * 0.12);
      const e = sampleLut(FLIP_LUT_39, lag);
      el.style.transform = `rotateY(${-160 * e}deg)`;
      el.style.setProperty('--translucency', String(Math.sin(e * Math.PI) * 0.9));
    });
    bookEl.style.setProperty('--book-bloom', String(bloom));

    titleEl.style.opacity = String(smooth(phase(t, 2.9, 3.5)) * (1 - gate));
    titleEl.style.transform = `translateX(-50%) translateY(${(1 - smooth(phase(t, 2.9, 3.5))) * 14}px)`;

    if (t >= T_END) { finish(); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ======== app.js ======== */
/* LIVING WORD — application shell: routing, reader, curriculum, study tools.
   100% offline: after the service worker's first cache, no network is used. */


const $ = (sel) => document.querySelector(sel);

let TRANSLATION = null;   // active translation row
let CURRICULUM = null;    // data/curriculum.json (precached)
let reader = { book: 43, chapter: 1 };   // open to John 1 — "In the beginning was the Word"
let flip = null;

/* ================================================================ boot */
async function boot() {
  // Offline packaging. Absent (single-file build) or blocked (sandboxed
  // frame) service workers are fine — the app never needs the network.
  try {
    if ('serviceWorker' in navigator && !window.__LIVING_WORD_SINGLE_FILE) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (_) { /* no service worker available in this context */ }
  const [translation, curriculum] = await Promise.all([
    db.ensureSeeded(),
    fetch('data/curriculum.json').then((r) => r.json()),
  ]);
  TRANSLATION = translation;
  CURRICULUM = curriculum;

  runSplash(() => {
    show('home');
    renderHome();
  });
  initReader();
  initTabs();
}

function show(name) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
  $('#screen-' + name).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach((b) =>
    b.classList.toggle('on', b.dataset.screen === name));
  if (name === 'read') renderChapter();
  if (name === 'learn') renderLearnIndex();
  if (name === 'study') renderStudy();
}

function initTabs() {
  document.querySelectorAll('.tabbar button').forEach((b) =>
    b.addEventListener('click', () => show(b.dataset.screen)));
}

/* ============================================================== reader */
function initReader() {
  const bookSel = $('#sel-book');
  const chapSel = $('#sel-chapter');
  for (const [id, name] of BOOKS) {
    const o = document.createElement('option');
    o.value = id; o.textContent = name;
    bookSel.append(o);
  }
  bookSel.addEventListener('change', () => {
    reader.book = +bookSel.value; reader.chapter = 1; renderChapter();
  });
  chapSel.addEventListener('change', () => {
    reader.chapter = +chapSel.value; renderChapter();
  });

  flip = new PageFlip({
    stage: $('#book-stage'),
    canGo: (dir) => nextRef(dir) !== null,
    onCommit: (dir) => {
      const n = nextRef(dir);
      if (n) { reader = n; renderChapter(); }
    },
  });
}

function nextRef(dir) {
  let { book, chapter } = reader;
  chapter += dir;
  if (chapter < 1) {
    if (book === 1) return null;
    book -= 1; chapter = chapterCount(book);
  } else if (chapter > chapterCount(book)) {
    if (book === 66) return null;
    book += 1; chapter = 1;
  }
  return { book, chapter };
}

async function renderChapter() {
  $('#sel-book').value = reader.book;
  const chapSel = $('#sel-chapter');
  chapSel.innerHTML = '';
  for (let i = 1; i <= chapterCount(reader.book); i++) {
    const o = document.createElement('option');
    o.value = i; o.textContent = 'Ch ' + i;
    chapSel.append(o);
  }
  chapSel.value = reader.chapter;

  const face = $('#book-stage .leaf .face.front');
  const [verses, highlights] = await Promise.all([
    db.getChapter(TRANSLATION.id, reader.book, reader.chapter),
    db.getHighlights(TRANSLATION.id, reader.book, reader.chapter),
  ]);
  const hlMap = new Map(highlights.map((h) => [h.v, h.color]));

  let html = `<div class="chapter-title">${bookName(reader.book).toUpperCase()} ${reader.chapter}</div>`;
  if (!verses.length) {
    html += `<div class="no-text-notice">This chapter's text is not in the development seed.<br><br>
      Install the licensed ESV bundle (see <em>tools/import-esv.mjs</em>) to load the complete
      Bible — all 66 books, 31,102 verses — for offline use.<br><br>
      <em>"${'The grass withereth, the flower fadeth: but the word of our God shall stand for ever.'}" — Isaiah 40:8</em></div>`;
  } else {
    html += '<div class="scripture">' + verses.map((v) => {
      const hl = hlMap.has(v.v) ? ` class="hl-${hlMap.get(v.v)}"` : '';
      return `<span${hl} data-v="${v.v}"><span class="vnum">${v.v}</span>${escapeHtml(v.text)} </span>`;
    }).join('') + '</div>';
    html += `<p class="copyright-notice">${escapeHtml(TRANSLATION.copyright.split('.')[0])}.</p>`;
  }
  face.innerHTML = html;

  // tap a verse to toggle a gold highlight (long-form annotation lives in Study)
  face.querySelectorAll('[data-v]').forEach((span) => {
    span.addEventListener('click', async () => {
      const row = await db.toggleHighlight(TRANSLATION.id, reader.book, reader.chapter, +span.dataset.v);
      span.className = row ? 'hl-' + row.color : '';
    });
  });
}

const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =========================================================== learn tab */
function renderLearnIndex() {
  const body = $('#screen-learn .screen-body');

  const a = CURRICULUM.trackA;

function lessonCard(l, onOpen) {
  const c = document.createElement('div');
  c.className = 'card glass';
  c.innerHTML = `<h3>${l.title}</h3><p>${l.passage_ref} — ${l.big_truth}</p>`;

}

async function renderLessonA(lesson) {
  const body = $('#screen-learn .screen-body');
  body.innerHTML = `<button class="back-link">‹ All lessons</button>
    <h2 class="ca-heading">${lesson.title}</h2>
    <p class="game-sub">${lesson.passage_ref}</p>`;
  body.querySelector('.back-link').addEventListener('click', renderLearnIndex);

  // The passage itself is always visually primary (Sola Scriptura rule).
  const verses = await db.getChapter(TRANSLATION.id, lesson.ref.b, lesson.ref.c);
  const inRange = verses.filter((v) => v.v >= lesson.ref.vs && v.v <= lesson.ref.ve);
  if (inRange.length) {
    body.insertAdjacentHTML('beforeend',
      `<div class="card glass halo"><div class="scripture">` +
      inRange.map((v) => `<span><span class="vnum">${v.v}</span>${escapeHtml(v.text)} </span>`).join('') +
      `</div></div>`);
  }

  for (const step of lesson.steps) {
    const c = document.createElement('div');
    c.className = 'lesson-step glass';
    c.innerHTML = `<span class="kind">${step.kind}</span><p>${step.body}</p>`;
    body.append(c);
    if (step.kind === 'play' && step.game_id) {
      const host = document.createElement('div');
      host.className = 'game-host glass card';
      c.append(host);
      launchGame(step.game_id, host, lesson);
    }
  }

  body.insertAdjacentHTML('beforeend', `
    <div class="lesson-step glass christ-box"><span class="kind">Where is Jesus here?</span>
      <p>${lesson.christ_connection}</p></div>
    <div class="lesson-step glass"><span class="kind">What will I do?</span><p>${lesson.obedience_step}</p></div>
    <div class="lesson-step glass"><span class="kind">Who will I tell?</span><p>${lesson.multiply_step}</p></div>`);
}

async function launchGame(gameId, host, lesson) {
  if (gameId === 'verse-builder') {
    const mv = lesson.memory_verse;
    const rows = await db.getChapter(TRANSLATION.id, mv.b, mv.c);
    const text = rows.filter((v) => v.v >= mv.vs && v.v <= mv.ve).map((v) => v.text).join(' ');
    games.verseBuilder(host, { lessonId: lesson.id, refLabel: mv.ref, verseText: text });
  } else if (gameId === 'great-timeline') {
    games.greatTimeline(host, { lessonId: lesson.id, events: CURRICULUM.timeline_events });
  } else if (gameId === 'shepherd-path') {
    games.shepherdPath(host, { lessonId: lesson.id });
  }
}

function renderStudyB(study) {
  const body = $('#screen-learn .screen-body');
  body.innerHTML = `<button class="back-link">‹ All lessons</button>
    <h2 class="ca-heading">${study.title}</h2>
    <p class="game-sub">${study.passage_ref}</p>
    <div class="lesson-step glass"><span class="kind">Context</span><p>${study.context}</p></div>
    <div class="lesson-step glass christ-box"><span class="kind">Christ at the Center</span><p>${study.christ_connection}</p></div>
    <div class="lesson-step glass"><span class="kind">Defending the Hope</span><p>${study.apologetic}</p></div>`;
  body.querySelector('.back-link').addEventListener('click', renderLearnIndex);

  for (const vid of study.vocab || []) {
    const v = CURRICULUM.vocab.find((x) => x.id === vid);
    if (v) body.insertAdjacentHTML('beforeend', vocabCardHtml(v));
  }

  const refl = document.createElement('div');
  body.append(refl);
  games.reflection(refl, { studyId: study.id, passageRef: study.passage_ref, prompts: study.dbs });

  body.insertAdjacentHTML('beforeend', `
    <div class="lesson-step glass"><span class="kind">Obey</span><p>${study.obedience_step}</p></div>
    <div class="lesson-step glass"><span class="kind">Multiply</span><p>${study.multiply_step}</p></div>`);
}

const vocabCardHtml = (v) => `
  <div class="vocab-card glass">
    <span class="lemma">${v.lemma}</span><span class="translit">${v.translit}</span>
    <p><strong>${v.gloss}</strong></p><p>${v.teaching}</p>
    <p class="game-sub">Key texts: ${v.key_refs.join(' · ')}</p>
  </div>`;

/* =========================================================== study tab */
async function renderStudy() {
  const body = $('#screen-study .screen-body');
  body.innerHTML = `<h2 class="ca-heading">Study Deep</h2>
    <p class="game-sub">Cross-reference constellation — the threads of one story, drawn in light.</p>
    <canvas id="constellation-canvas"></canvas>
    <p class="game-sub" style="margin-top:16px">WORD STUDIES</p>
    <div id="vocab-list"></div>
    <p class="game-sub" style="margin-top:16px">MULTIPLICATION LEDGER · 2 Timothy 2:2</p>
    <div id="ledger"></div>`;

  requestAnimationFrame(() => games.constellation($('#constellation-canvas'), null));
  $('#vocab-list').innerHTML = CURRICULUM.vocab.map(vocabCardHtml).join('');
  renderLedger();
}

async function renderLedger() {
  const box = $('#ledger');
  const rows = await db.getDisciples();
  const byGen = new Map();
  rows.forEach((d) => byGen.set(d.generation, [...(byGen.get(d.generation) || []), d]));
  let html = '';
  if (!rows.length) {
    html += `<p class="game-sub">“And the things that thou hast heard of me… commit thou to
      faithful men, who shall be able to teach others also.” Who is your first name?</p>`;
  }
  for (const gen of [...byGen.keys()].sort()) {
    html += `<div class="ledger-gen">Generation ${gen}</div>`;
    html += byGen.get(gen).map((d) => `<div class="ledger-row glass">🕊️ ${escapeHtml(d.name)}</div>`).join('');
  }
  html += `<div class="ledger-add">
      <input id="ledger-name" placeholder="Name of a disciple you are teaching" maxlength="60">
      <button class="btn btn--gold" id="ledger-btn">Add</button>
    </div>`;
  box.innerHTML = html;
  $('#ledger-btn').addEventListener('click', async () => {
    const name = $('#ledger-name').value.trim();
    if (!name) return;
    await db.addDisciple(name, 1);
    renderLedger();
  });
}
