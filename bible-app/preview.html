<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e8f0ff">
<title>Living Word — Offline ESV Discipleship</title>

<style>
/* LIVING WORD — Liquid Glass design tokens & core surfaces
   Doctrine of light: one source, above; light descends onto the Word.
   Palette: "Daybreak at the Gates" — a luminous, light-filled sanctuary.  */

:root {
  /* ------------------------------------------------ palette: daybreak */
  --sky-high:    #cfe2ff;   /* upper heaven, coolest light              */
  --sky-mid:     #e8f0ff;
  --sky-low:     #fff6e4;   /* warm horizon glow                        */
  --vellum:      #fffdf7;   /* glowing digital paper                    */
  --gold-deep:   #9a6d12;   /* gold that stays legible AS TEXT on light */
  --gate-gold:   #efb63c;   /* structural gold: borders, rules          */
  --gate-gold-bright: #ffd977;
  --ray-white:   #fffdf4;
  --dawn-rose:   #f0a98d;
  --olive:       #7ea36a;
  --water:       #5f9fc4;
  --ink:         #1b2340;   /* deep indigo — 12:1 on vellum             */
  --ink-dim:     rgba(27,35,64,.66);
  --ink-faint:   rgba(27,35,64,.42);

  /* ------------------------------------------------ liquid glass core  */
  --glass-blur: 22px;
  --glass-sat: 165%;
  --glass-bg: rgba(255,255,255,0.52);
  --glass-bg-raised: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.9);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.95);
  --glass-radius: 22px;
  --glass-radius-sm: 14px;

  /* neumorphic depth — soft indigo shadow, never muddy grey */
  --depth-far:  0 16px 40px rgba(46,72,140,.16);
  --depth-near: 0 2px 8px rgba(46,72,140,.10);
  --depth-pressed: inset 0 3px 10px rgba(46,72,140,.18), inset 0 1px 2px rgba(46,72,140,.14);

  /* heavenly light properties */
  --halo: radial-gradient(closest-side, rgba(255,217,119,.55), transparent 72%);
  --beam-gradient: linear-gradient(180deg,
      rgba(255,253,244,.95) 0%, rgba(255,217,119,.45) 44%, rgba(255,217,119,0) 100%);
  --dawn-sky: linear-gradient(180deg,
      var(--sky-high) 0%, var(--sky-mid) 42%, var(--sky-low) 100%);

  /* type scale */
  --font-scripture: 'New York', Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --font-ui: 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  --scripture-size: 18px;
  --scripture-leading: 1.68;
  --scripture-measure: 34em;

  /* springs (documented; JS reads these via getComputedStyle if needed) */
  --spring-ui-zeta: 0.92;     /* interaction spring damping ratio  */
  --spring-ui-omega: 14;      /* rad/s                             */
  --dur-liturgical: 640ms;    /* slow, weighted default            */
  --ease-settle: cubic-bezier(.22,.9,.28,1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
body {
  background: var(--dawn-sky);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ------------------------------------------------------------ surfaces */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border: 1px solid var(--glass-border);
  border-radius: var(--glass-radius);
  box-shadow: var(--depth-far), var(--depth-near), var(--glass-highlight);
}
.glass--raised { background: var(--glass-bg-raised); }
.glass--pressed { box-shadow: var(--depth-pressed); }

/* chromatic aberration — display headings ONLY, never Scripture text */
.ca-heading {
  text-shadow: 1px 0 0 rgba(255,120,90,.10), -1px 0 0 rgba(90,140,255,.10);
}

.halo { position: relative; }
.halo::before {
  content: ''; position: absolute; inset: -34%;
  background: var(--halo); pointer-events: none; z-index: -1;
}

/* ----------------------------------------------------------- scripture */
.scripture {
  font-family: var(--font-scripture);
  font-size: var(--scripture-size);
  line-height: var(--scripture-leading);
  max-width: var(--scripture-measure);
  margin-inline: auto;
  color: var(--ink);
  text-rendering: optimizeLegibility;
}
.scripture .vnum {
  font-family: var(--font-ui); font-size: .62em; vertical-align: super;
  color: var(--gold-deep); opacity: .85; margin-right: .28em; user-select: none;
}
.scripture .hl-gold  { background: rgba(255,200,60,.30); border-radius: 3px; }
.scripture .hl-dawn  { background: rgba(240,169,141,.30); border-radius: 3px; }
.scripture .hl-olive { background: rgba(126,163,106,.26); border-radius: 3px; }
.scripture .hl-water { background: rgba(95,159,196,.26); border-radius: 3px; }
.copyright-notice {
  font-size: 11px; color: var(--ink-faint); text-align: center;
  padding: 10px 18px 22px; max-width: 34em; margin-inline: auto;
}

/* ------------------------------------------------------------- buttons */
.btn {
  font-family: var(--font-ui); font-size: 15px; font-weight: 600;
  color: var(--ink); letter-spacing: .02em;
  padding: 13px 22px; border-radius: var(--glass-radius-sm);
  background: var(--glass-bg-raised);
  border: 1px solid var(--glass-border);
  box-shadow: var(--depth-near), var(--glass-highlight);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  cursor: pointer;
  transition: transform 180ms var(--ease-settle), box-shadow 180ms var(--ease-settle);
}
.btn:active { transform: scale(.97); box-shadow: var(--depth-pressed); }
.btn:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 2px; }
.btn--gold {
  background: linear-gradient(180deg, #ffe6a8, #ffcf6b);
  border-color: rgba(255,255,255,.95);
  color: #4a3505;
}

/* ---------------------------------------------------------- app frames */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.active { display: flex; }
.screen-body { flex: 1; overflow-y: auto; padding: 18px 18px 110px; } /* clear the tabbar */

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
}
.topbar h1 {
  font-size: 19px; font-weight: 700; margin: 0; color: var(--gold-deep);
  font-family: var(--font-scripture); letter-spacing: .03em;
}

.tabbar {
  display: flex; justify-content: space-around;
  margin: auto 14px calc(env(safe-area-inset-bottom, 0px) + 14px); /* auto top: pin to bottom */
  padding: 8px;
  position: relative; z-index: 5;                /* floats above the screen layers */
}
.tabbar button {
  flex: 1; background: none; border: 0; color: var(--ink-dim);
  font: 600 12px var(--font-ui); padding: 9px 4px; border-radius: 12px;
  cursor: pointer; transition: color 240ms, background 240ms;
}
.tabbar button .glyph { display: block; font-size: 20px; margin-bottom: 3px; }
.tabbar button.on {
  color: var(--gold-deep);
  background: linear-gradient(180deg, rgba(255,217,119,.55), rgba(255,217,119,.28));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
}

.card { padding: 18px; margin-bottom: 14px; }
.card h3 { margin: 0 0 6px; font-family: var(--font-scripture); color: var(--gold-deep); }
.card p { margin: 0; color: var(--ink-dim); font-size: 14px; line-height: 1.55; }

/* volumetric ambient beam behind content (CSS fallback layer) */
.ambient-beam {
  position: fixed; top: -10vh; left: 50%; width: 72vw; height: 78vh;
  transform: translateX(-50%) perspective(600px) rotateX(18deg);
  background: var(--beam-gradient);
  clip-path: polygon(36% 0, 64% 0, 100% 100%, 0 100%);
  filter: blur(20px); opacity: .8; pointer-events: none; z-index: 0;
}

/* ------------------------------------------------ page-flip book stage */
.book-stage {
  perspective: 2200px; perspective-origin: 50% 42%;
  position: relative; flex: 1; overflow: hidden;
  margin-bottom: 88px;                           /* clear the tabbar */
  /* the turn gesture must never double as text selection */
  user-select: none; -webkit-user-select: none;
  touch-action: pan-y;
}
.leaf {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transform-origin: left center;
  will-change: transform;
}
/* Light through paper is painted as the page's OWN background layers, not
   as overlay elements. An overlay inside preserve-3d gets promoted to its
   own composited layer, which then composites against the page backdrop
   instead of the leaf — visibly stranding glyph runs on the sky. Baking
   the light into the background also reads truer: the paper glows while
   the ink stays ink.
   Layer 1: the light bloom that follows the fold (--crease/--translucency)
   Layer 2: the specular band riding the crease itself
   Layer 3: the raking sheen across the sheet
   Layer 4: the vellum stock                                             */
.leaf .face {
  position: absolute; inset: 0; padding: 26px 22px 40px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background:
    radial-gradient(130% 95% at calc(var(--crease, 100%)) 32%,
      rgba(255,251,236, calc(var(--translucency, 0) * .92)),
      rgba(255,244,214, calc(var(--translucency, 0) * .38)) 42%,
      rgba(255,244,214, 0) 68%),
    linear-gradient(90deg,
      rgba(255,255,255,0) calc(var(--crease, 100%) - 9%),
      rgba(255,255,255, calc(var(--translucency, 0) * .9)) var(--crease, 100%),
      rgba(255,255,255,0) calc(var(--crease, 100%) + 9%)),
    linear-gradient(105deg, rgba(255,255,255,.9), rgba(255,255,255,0) 34%),
    linear-gradient(180deg, var(--vellum), #fdf4e2);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 6px 18px 18px 6px;
  box-shadow: var(--depth-far), var(--glass-highlight);
  overflow-y: auto;
}
/* While the leaf is in motion the face must not be a scroll container:
   Chromium composites the scrolling contents separately from the face's
   background inside a preserve-3d layer, which strands glyph runs on the
   page backdrop. A turning page isn't scrollable anyway. */
.book-stage.flipping .leaf .face { overflow: hidden; }
/* Approaching edge-on the leaf hands off to its reverse: a blank vellum
   back, never mirrored text. Driven from the flip loop rather than
   backface-visibility, which a scrollable face defeats in some engines. */
.leaf .face.front { opacity: var(--front-vis, 1); }
.leaf .face.back {
  transform: rotateY(180deg); border-radius: 18px 6px 6px 18px;
  opacity: var(--back-vis, 0);
}

/* The page underneath, revealed as the leaf lifts away. Its shadow lives
   inside it, so the flat overlay can never sort in front of the 3D leaf. */
.under-leaf {
  position: absolute; inset: 0; border-radius: 6px 18px 18px 6px;
  background: linear-gradient(180deg, #fdf8ec, #f7ecd6);
  border: 1px solid rgba(255,255,255,.85);
  box-shadow: inset 0 0 60px rgba(46,72,140,.06);
  overflow: hidden;
}
.page-shadow {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(46,72,140,.28), transparent 42%);
  opacity: var(--under-shadow, 0);
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
<style>
/* LIVING WORD — screen & game styling (builds on liquid-glass.css tokens) */

/* ------------------------------------------------------------- splash */
#splash { position: fixed; inset: 0; z-index: 50; display: none; background: var(--sky-mid); }
#splash-gl { position: absolute; inset: 0; width: 100%; height: 100%; }
#splash-book {
  position: absolute; left: 50%; top: 44%;
  width: min(46vw, 240px); height: min(60vw, 320px);
  transform-style: preserve-3d; opacity: 0; pointer-events: none;
}
#splash-book .board {
  position: absolute; inset: 0; border-radius: 6px 14px 14px 6px;
  background: linear-gradient(120deg, #2c3e78, #16224a 72%);
  border: 1px solid rgba(255,217,119,.85);
  box-shadow: 0 0 64px rgba(255,232,170, calc(.5 + var(--book-bloom, 0) * .5)),
              inset 0 0 30px rgba(255,217,119,.30);
}
#splash-book .board::after {           /* gilded page edges */
  content: ''; position: absolute; right: -5px; top: 3%; bottom: 3%; width: 7px;
  background: linear-gradient(180deg, #fffdf4, var(--gate-gold-bright));
  border-radius: 3px; box-shadow: 0 0 14px rgba(255,232,170,.95);
}
#splash-book .leaf3d {
  position: absolute; inset: 0; transform-origin: left center;
  transform-style: preserve-3d; border-radius: 6px 14px 14px 6px;
  background: linear-gradient(105deg, #fffdf7, #ffeec4);
  box-shadow: 0 0 calc(18px + var(--translucency, 0) * 48px)
              rgba(255,248,220, calc(.5 + var(--translucency, 0) * .5));
  will-change: transform;
}
#splash-book .cover {
  background: linear-gradient(105deg, #35498a, #1b2a58 62%);
  border: 1px solid rgba(255,217,119,.9);
}
#splash-book .cover::before {
  content: '✝'; position: absolute; inset: 0; display: grid; place-items: center;
  color: #fffdf4; font-size: 44px;
  text-shadow: 0 0 26px rgba(255,232,170,1);
}
#splash-title {
  position: absolute; left: 50%; top: 66%; transform: translateX(-50%);
  text-align: center; opacity: 0; width: min(88vw, 480px);
}
#splash-title h1 {
  font: 700 34px/1.1 var(--font-scripture); letter-spacing: .22em;
  color: #4a3505; margin: 0;
  text-shadow: 0 2px 26px rgba(255,255,255,.95);
}
#splash-title p { color: #5c4a2a; font: italic 13px/1.6 var(--font-scripture); }

/* ------------------------------------------------------------- reader */
.reader-nav { display: flex; gap: 8px; padding: 0 18px 10px; z-index: 2; }
.reader-nav select {
  flex: 1; padding: 10px 12px; border-radius: var(--glass-radius-sm);
  background: var(--glass-bg-raised); color: var(--ink);
  border: 1px solid var(--glass-border); font: 600 14px var(--font-ui);
  backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--depth-near), var(--glass-highlight);
}
.reader-nav select option { background: #fffdf7; color: var(--ink); }
.chapter-title {
  text-align: center; font: 700 15px var(--font-scripture);
  color: var(--gold-deep); letter-spacing: .14em; margin: 8px 0 14px;
}
.no-text-notice { text-align: center; padding: 40px 24px; color: var(--ink-dim);
  font-size: 14px; line-height: 1.7; }

/* -------------------------------------------------------------- games */
.game-title { font-family: var(--font-scripture); color: var(--gold-deep); margin: 4px 0 2px; }
.game-sub { color: var(--ink-dim); font-size: 13px; margin: 0 0 14px; }

.vb-line { min-height: 64px; padding: 14px; border-radius: var(--glass-radius-sm);
  border: 1px dashed rgba(154,109,18,.5); background: rgba(255,255,255,.55);
  margin-bottom: 16px; }
.vb-word { opacity: 0; transition: opacity 480ms var(--ease-settle), text-shadow 480ms; }
.vb-word.lit { opacity: 1; text-shadow: 0 0 14px rgba(255,200,60,.8); }
.vb-complete { border-style: solid; border-color: var(--gate-gold);
  box-shadow: 0 0 34px rgba(255,207,107,.55); }
.vb-pool { display: flex; flex-wrap: wrap; gap: 9px; }
.vb-tile { font: 600 15px var(--font-scripture); color: var(--ink);
  padding: 10px 14px; border-radius: 12px; cursor: pointer; }
.vb-tile.vb-set { opacity: .22; }
.vb-nudge { animation: nudge 560ms var(--ease-settle); }
@keyframes nudge {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); } 60% { transform: translateX(4px); }
}

.tl-river { display: flex; gap: 4px; height: 10px; margin: 6px 0 14px; }
.tl-segment { flex: 1; border-radius: 5px; background: rgba(46,72,140,.12);
  transition: background 640ms, box-shadow 640ms; }
.tl-segment.lit { background: linear-gradient(90deg, var(--gate-gold), #fffdf4);
  box-shadow: 0 0 18px rgba(255,207,107,.85); }
.tl-slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; margin-bottom: 14px; }
.tl-pool { display: flex; flex-wrap: wrap; gap: 9px; }
.tl-card { display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
  padding: 10px 14px; border-radius: 12px; color: var(--ink); cursor: pointer;
  font-family: var(--font-ui); }
.tl-card small { color: var(--ink-dim); }
.tl-card.tl-placed { border-color: var(--gate-gold); opacity: .95; cursor: default;
  box-shadow: 0 0 18px rgba(255,207,107,.4); }

.sp-stage { padding: 20px; text-align: center; }
.sp-art { font-size: 44px; margin-bottom: 8px; }
.sp-verse { font-size: 15px; margin: 0 0 12px; }
.sp-q { font: 600 15px var(--font-ui); color: var(--gold-deep); }
.sp-choice { display: block; width: 100%; margin-top: 9px; }
.sp-path { display: flex; justify-content: center; gap: 18px; margin-top: 14px;
  font-size: 26px; color: rgba(46,72,140,.20); }
.sp-step.lit { color: var(--gate-gold); text-shadow: 0 0 16px rgba(255,207,107,.95); }

.game-celebrate { margin-top: 18px; padding: 16px; text-align: center;
  opacity: 0; transform: translateY(8px);
  transition: opacity var(--dur-liturgical) var(--ease-settle),
              transform var(--dur-liturgical) var(--ease-settle); }
.game-celebrate.shown { opacity: 1; transform: none; }
.lamp-glyph { font-size: 30px; }

/* ------------------------------------------------------------ track B */
#constellation-canvas { width: 100%; height: 300px; border-radius: var(--glass-radius);
  border: 1px solid var(--glass-border); box-shadow: var(--depth-far); }
.dbs-q { display: block; padding: 14px; margin-bottom: 12px; }
.dbs-q span { display: block; font: 600 14px var(--font-ui); color: var(--gold-deep);
  margin-bottom: 8px; }
.dbs-q textarea { width: 100%; background: rgba(255,255,255,.8); color: var(--ink);
  border: 1px solid rgba(46,72,140,.18); border-radius: 10px; padding: 10px;
  font: 14px/1.5 var(--font-ui); resize: vertical; }
.vocab-card { padding: 16px; margin-bottom: 12px; }
.vocab-card .lemma { font-size: 22px; color: var(--gold-deep); font-family: var(--font-scripture); }
.vocab-card .translit { font-style: italic; color: var(--ink-dim); margin-left: 8px; }
.ledger-gen { margin: 10px 0 4px; font: 700 12px var(--font-ui); letter-spacing: .12em;
  color: var(--gold-deep); text-transform: uppercase; }
.ledger-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 8px; }
.ledger-add { display: flex; gap: 8px; margin-top: 12px; }
.ledger-add input { flex: 1; background: rgba(255,255,255,.8); color: var(--ink);
  border: 1px solid rgba(46,72,140,.18); border-radius: 10px; padding: 10px;
  font: 14px var(--font-ui); }

.lesson-step { padding: 14px 16px; margin-bottom: 10px; }
.lesson-step .kind { font: 700 11px var(--font-ui); letter-spacing: .16em;
  text-transform: uppercase; color: var(--gold-deep); display: block; margin-bottom: 5px; }
.christ-box { border-color: var(--gate-gold);
  background: linear-gradient(180deg, rgba(255,217,119,.42), rgba(255,217,119,.16));
  box-shadow: 0 0 30px rgba(255,207,107,.35), var(--glass-highlight); }
.game-host { margin-top: 10px; }
.back-link { background: none; border: 0; color: var(--gold-deep); font: 600 14px var(--font-ui);
  cursor: pointer; padding: 6px 0; }

</style>
</head>

<!-- ambient volumetric beam (CSS layer under all screens) -->
<div class="ambient-beam" aria-hidden="true"></div>

<div id="app">

  <!-- ============================ SPLASH ============================ -->
  <div id="splash" aria-label="Opening: light descends upon the Word">
    <canvas id="splash-gl"></canvas>
    <div id="splash-book">
      <div class="board"></div>
      <div class="leaf3d fan"></div>

      <div class="leaf3d fan"></div>

         will stand forever.” — Isaiah 40:8</p>

  </div>

  <!-- ============================= HOME ============================= -->
  <section class="screen" id="screen-home">
    <header class="topbar"><h1>Living Word</h1></header>
    <div class="screen-body"></div>

      <select id="sel-chapter" aria-label="Chapter"></select>

        <div class="face back"></div>

    </div>

    <header class="topbar"><h1>Learn</h1></header>

  <!-- ============================ TABBAR ============================ -->
  <nav class="tabbar glass">

    <button data-screen="study"><span class="glyph">🌌</span>Study</button>

</div>

window.__LIVING_WORD_SINGLE_FILE = true;
const __DATA = {"data/seed-verses.json":{"translation":{"id":"KJV","name":"King James Version (development seed)","language":"en","copyright":"Public domain in the United States. DEVELOPMENT SEED ONLY — install the licensed ESV bundle via tools/import-esv.mjs for deployment. The ESV® Bible is copyright © 2001 by Crossway and requires a license for app distribution.","licensed":0},"verses":[{"b":1,"c":1,"v":1,"t":"In the beginning God created the heaven and the earth."},{"b":1,"c":1,"v":2,"t":"And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters."},{"b":1,"c":1,"v":3,"t":"And God said, Let there be light: and there was light."},{"b":1,"c":1,"v":4,"t":"And God saw the light, that it was good: and God divided the light from the darkness."},{"b":1,"c":1,"v":5,"t":"And God called the light Day, and the darkness he called Night. And the evening and the morning were the first day."},{"b":19,"c":23,"v":1,"t":"The LORD is my shepherd; I shall not want."},{"b":19,"c":23,"v":2,"t":"He maketh me to lie down in green pastures: he leadeth me beside the still waters."},{"b":19,"c":23,"v":3,"t":"He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake."},{"b":19,"c":23,"v":4,"t":"Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me."},{"b":19,"c":23,"v":5,"t":"Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over."},{"b":19,"c":23,"v":6,"t":"Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the LORD for ever."},{"b":19,"c":119,"v":105,"t":"Thy word is a lamp unto my feet, and a light unto my path."},{"b":23,"c":40,"v":8,"t":"The grass withereth, the flower fadeth: but the word of our God shall stand for ever."},{"b":23,"c":53,"v":5,"t":"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."},{"b":23,"c":53,"v":6,"t":"All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all."},{"b":40,"c":28,"v":18,"t":"And Jesus came and spake unto them, saying, All power is given unto me in heaven and in earth."},{"b":40,"c":28,"v":19,"t":"Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:"},{"b":40,"c":28,"v":20,"t":"Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen."},{"b":42,"c":15,"v":4,"t":"What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it?"},{"b":42,"c":15,"v":5,"t":"And when he hath found it, he layeth it on his shoulders, rejoicing."},{"b":42,"c":15,"v":6,"t":"And when he cometh home, he calleth together his friends and neighbours, saying unto them, Rejoice with me; for I have found my sheep which was lost."},{"b":42,"c":15,"v":7,"t":"I say unto you, that likewise joy shall be in heaven over one sinner that repenteth, more than over ninety and nine just persons, which need no repentance."},{"b":42,"c":24,"v":27,"t":"And beginning at Moses and all the prophets, he expounded unto them in all the scriptures the things concerning himself."},{"b":43,"c":1,"v":1,"t":"In the beginning was the Word, and the Word was with God, and the Word was God."},{"b":43,"c":1,"v":2,"t":"The same was in the beginning with God."},{"b":43,"c":1,"v":3,"t":"All things were made by him; and without him was not any thing made that was made."},{"b":43,"c":1,"v":4,"t":"In him was life; and the life was the light of men."},{"b":43,"c":1,"v":5,"t":"And the light shineth in darkness; and the darkness comprehended it not."},{"b":43,"c":1,"v":14,"t":"And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth."},{"b":43,"c":3,"v":16,"t":"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."},{"b":43,"c":3,"v":17,"t":"For God sent not his Son into the world to condemn the world; but that the world through him might be saved."},{"b":43,"c":14,"v":6,"t":"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."},{"b":45,"c":3,"v":23,"t":"For all have sinned, and come short of the glory of God;"},{"b":45,"c":5,"v":8,"t":"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us."},{"b":45,"c":6,"v":23,"t":"For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord."},{"b":45,"c":10,"v":9,"t":"That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved."},{"b":55,"c":2,"v":2,"t":"And the things that thou hast heard of me among many witnesses, the same commit thou to faithful men, who shall be able to teach others also."},{"b":62,"c":1,"v":5,"t":"This then is the message which we have heard of him, and declare unto you, that God is light, and in him is no darkness at all."}],"crossReferences":[{"from":[43,1,1],"to":[1,1,1],"theme":"word"},{"from":[43,1,4],"to":[62,1,5],"theme":"light"},{"from":[1,1,3],"to":[43,1,5],"theme":"light"},{"from":[23,53,6],"to":[42,15,4],"theme":"lamb"},{"from":[23,53,5],"to":[45,5,8],"theme":"lamb"},{"from":[19,23,1],"to":[42,15,4],"theme":"shepherd"},{"from":[43,14,6],"to":[45,10,9],"theme":"salvation"},{"from":[45,3,23],"to":[45,6,23],"theme":"salvation"},{"from":[45,6,23],"to":[43,3,16],"theme":"salvation"},{"from":[19,119,105],"to":[23,40,8],"theme":"word"},{"from":[40,28,19],"to":[55,2,2],"theme":"mission"},{"from":[42,24,27],"to":[23,53,5],"theme":"christ-in-ot"}]},"data/curriculum.json":{"trackA":{"name":"Lambs — Early Readers to 12","units":[{"unit":1,"title":"God Makes","lessons":[{"id":"A1-01","title":"God Said: Let There Be Light","passage_ref":"Genesis 1:1-5","ref":{"b":1,"c":1,"vs":1,"ve":5},"big_truth":"God made everything by His word, and everything He made was good.","christ_connection":"The same Word that said 'Let there be light' became a person — Jesus (John 1:1-5). Jesus is the light that darkness can never put out.","obedience_step":"Tonight when you see a light turn on, say thank You to God who made light.","multiply_step":"Tell one person in your family the story of the first day, in your own words.","memory_verse":{"ref":"Genesis 1:1","b":1,"c":1,"vs":1,"ve":1},"steps":[{"kind":"hear","body":"Before anything existed — before the sun, before the sea, before you — God was there. And God spoke. He didn't need tools or helpers. He just said, 'Let there be light,' and light came running."},{"kind":"see","body":"Look at the beam of light on your screen. Real light is faster and brighter than anything — and God made it with only His voice."},{"kind":"play","body":"Build the memory verse, one glowing word at a time.","game_id":"verse-builder"},{"kind":"say","body":"Say the memory verse out loud three times, a little quieter each time, until it is a whisper you can keep."},{"kind":"live","body":"God's word is powerful. When God says something, it happens. You can trust everything He says."}]},{"id":"A1-02","title":"The Shepherd Who Looks for the Lost","passage_ref":"Luke 15:4-7","ref":{"b":42,"c":15,"vs":4,"ve":7},"big_truth":"God is like a shepherd who never gives up looking for His lost sheep.","christ_connection":"Jesus told this story about Himself. He is the Good Shepherd who left heaven to find us and carry us home (John 10:11).","obedience_step":"Pray for one friend who doesn't know Jesus yet — the Shepherd is looking for them.","multiply_step":"Act out the lost-sheep story with a stuffed animal for someone younger than you.","memory_verse":{"ref":"Psalm 23:1","b":19,"c":23,"vs":1,"ve":1},"steps":[{"kind":"hear","body":"A shepherd counted his sheep: ...97, 98, 99 — one was missing! Did he say 'ninety-nine is plenty'? Never. He walked into the dark hills, calling and searching, until the lost one was found and safe on his shoulders."},{"kind":"play","body":"Lead the lamb along the Shepherd's Path.","game_id":"shepherd-path"},{"kind":"say","body":"Memory verse: 'The LORD is my shepherd; I shall not want.'"},{"kind":"live","body":"When you feel lost or afraid, remember: the Shepherd knows your name and He is already looking for you."}]},{"id":"A1-03","title":"One Big Story","passage_ref":"Luke 24:27","ref":{"b":42,"c":24,"vs":27,"ve":27},"big_truth":"The whole Bible — from the very first page — is one story that leads to Jesus.","christ_connection":"Creation, the promise, the kings, the prophets — every part of the story points ahead to Jesus, the Rescuer God promised.","obedience_step":"Ask a grown-up to show you their favorite Bible story and find where it sits on the timeline.","multiply_step":"Teach the order of the big story (Creation → Promise → Jesus → Church) to a friend using your fingers.","memory_verse":{"ref":"Psalm 119:105","b":19,"c":119,"vs":105,"ve":105},"steps":[{"kind":"hear","body":"The Bible is not a box of little stories. It is one river, flowing from the garden all the way to Jesus and then out to the whole world."},{"kind":"play","body":"Place the great events on the river of light, in order.","game_id":"great-timeline"},{"kind":"say","body":"Memory verse: 'Thy word is a lamp unto my feet, and a light unto my path.'"},{"kind":"live","body":"Every time you read the Bible, ask the treasure question: where is Jesus in this story?"}]},{"id":"A1-04","title":"The Greatest Gift","passage_ref":"John 3:16-17","ref":{"b":43,"c":3,"vs":16,"ve":17},"big_truth":"God loved the world so much that He gave His only Son, so that everyone who believes in Him has life forever.","christ_connection":"This IS the gospel: Jesus died for our sins and rose again. Believing in Him is not earning a prize — it is receiving a gift.","obedience_step":"Talk to God in your own words: thank Him for giving Jesus, and tell Him you want to follow Him.","multiply_step":"John 3:16 is good news for every person on earth. Who will you share it with this week? Say their name out loud.","memory_verse":{"ref":"John 3:16","b":43,"c":3,"vs":16,"ve":16},"steps":[{"kind":"hear","body":"A gift is not a gift if you have to pay for it. God gave the most precious gift there ever was — His own Son — so that we could come home to Him."},{"kind":"play","body":"Build John 3:16 — the verse missionaries have carried to every nation.","game_id":"verse-builder"},{"kind":"say","body":"Say John 3:16 and put your own name in it: 'For God so loved ______...'"},{"kind":"live","body":"You never have to make God love you. He already did the loving first (Romans 5:8)."}]}]}]},"trackB":{"name":"Disciples — 13 to Adult","courses":[{"course":1,"title":"The Gospel of the Kingdom","studies":[{"id":"B1-01","title":"The Word Became Flesh","passage_ref":"John 1:1-14","ref":{"b":43,"c":1,"vs":1,"ve":14},"big_truth":"Jesus is not merely a messenger from God; He is God the Son, the eternal Word, who entered His own creation.","christ_connection":"John deliberately opens with Genesis 1 language ('In the beginning') to declare that the Creator has become the Redeemer. The Word who spoke light now shines as the Light.","context":"John writes so that 'you may believe that Jesus is the Christ, the Son of God' (John 20:31). 'Logos' (Word) spoke both to Jewish readers (God's creative word, Gen 1; Ps 33:6) and to Greek readers (the rational principle behind the cosmos). John claims both streams find their fulfillment in a person.","dbs":["What does this passage say about God?","What does it say about people (vv. 5, 10-12)?","What must change in how I live if the Word truly 'dwelt among us'?","Who will I share this passage with before our next meeting?"],"apologetic":"Objection: 'Jesus never claimed to be God.' John 1:1-3,14 — written within living memory of eyewitnesses — asserts full deity and full humanity. See also John 8:58, 20:28. The earliest Christians worshiped Jesus as God at the cost of their lives; that conviction was not a later legend.","vocab":["gk-logos"],"obedience_step":"Memorize John 1:1-5 this week and recite it to your group.","multiply_step":"Lead one person through vv. 1-14 using the four discovery questions above. You do not need to be an expert; the questions do the work."},{"id":"B1-02","title":"The Righteousness We Could Not Earn","passage_ref":"Romans 3:23; 5:8; 6:23; 10:9","ref":{"b":45,"c":3,"vs":23,"ve":23},"big_truth":"All have sinned; God justifies sinners freely through the redemption that is in Christ Jesus, received by faith.","christ_connection":"The 'Romans Road' is the gospel in four stones: universal guilt (3:23), demonstrated love (5:8), wages vs. gift (6:23), and the confession of faith (10:9). Christ's cross is where God's justice and mercy meet.","context":"Paul writes to a mixed Jewish-Gentile church he has not yet visited, laying out the gospel systematically. Chapters 1-3 establish that no one — religious or pagan — is righteous before God by works.","dbs":["What do these verses say about God's character — both His justice and His love?","What do they say about every human being, including me?","What is the difference between a wage and a gift, and why does it matter for salvation?","Who in my life still thinks salvation must be earned? How will I show them these verses?"],"apologetic":"Objection: 'A loving God wouldn't judge sin.' Love without justice is indifference. Romans 5:8 shows God satisfying His own justice at His own cost — the judge stepped down and took the sentence Himself.","vocab":["gk-dikaiosyne","gk-charis"],"obedience_step":"Write out the four Romans Road verses on a card (or in your notes here) and practice sharing them in under five minutes.","multiply_step":"Share the Romans Road with one person this week. Record their name in your multiplication ledger and keep praying for them."},{"id":"B1-03","title":"Sent Ones: The Commission and the Church","passage_ref":"Matthew 28:18-20; 2 Timothy 2:2","ref":{"b":40,"c":28,"vs":18,"ve":20},"big_truth":"The risen King commands His people to make disciples of all nations — and discipleship is designed to multiply through four generations.","christ_connection":"The Commission rests entirely on Christ's authority ('All authority... has been given to me') and His presence ('I am with you always'). Mission is not our project for God; it is Christ's own work through us.","context":"Matthew ends where the church begins. 2 Timothy 2:2 shows the mechanism: Paul → Timothy → faithful ones → others also. Four generations in one verse. A church is planted when disciples gather around the Word, baptize, break bread, and raise their own leaders (Acts 2:42-47; Titus 1:5).","dbs":["What has Jesus been given, and what does that mean for the nations — and for my neighborhood?","What exactly are we commanded to do: make converts, or make disciples who obey? What is the difference?","What would a simple church look like in my home or village — Word, prayer, bread, baptism, leaders?","Name your 'Timothy' — the person you are training who will train others. If you have none, who could be the first?"],"apologetic":"Objection: 'Mission is cultural imperialism.' The gospel is the one message that dignifies every culture equally: every nation, tribe, and tongue is invited as-is to the same table (Rev 7:9). Church-planting done biblically raises LOCAL leaders and puts the Word in LOCAL hands — this app exists to make itself unnecessary.","vocab":["gk-ekklesia","heb-hesed"],"obedience_step":"Begin the 3/3rds pattern with your group this week: Look Back (accountability), Look Up (new passage), Look Forward (goal and prayer).","multiply_step":"Open your multiplication ledger and write the names of your first generation. Pray over each name daily."}]}]},"vocab":[{"id":"gk-logos","lemma":"λόγος","language":"greek","translit":"logos","gloss":"word, message, reason","teaching":"In John 1, the eternal self-expression of God — not merely speech about God, but God the Son Himself. Used ~330x in the NT.","key_refs":["John 1:1","John 1:14","1 John 1:1","Revelation 19:13"]},{"id":"gk-dikaiosyne","lemma":"δικαιοσύνη","language":"greek","translit":"dikaiosynē","gloss":"righteousness, justice","teaching":"The status of being in the right before God. Romans' central theme: a righteousness from God, given to sinners through faith in Christ (Rom 3:21-26).","key_refs":["Romans 1:17","Romans 3:22","2 Corinthians 5:21"]},{"id":"gk-charis","lemma":"χάρις","language":"greek","translit":"charis","gloss":"grace, unmerited favor","teaching":"God's free, undeserved kindness — the opposite of wages. Grace is not God ignoring sin, but God paying for it Himself.","key_refs":["Ephesians 2:8-9","Romans 6:23","Titus 2:11"]},{"id":"gk-ekklesia","lemma":"ἐκκλησία","language":"greek","translit":"ekklēsia","gloss":"assembly, church","teaching":"The called-out gathering of Christ's people — never a building in the NT, always a people. The goal of missions is planting these worshiping communities everywhere.","key_refs":["Matthew 16:18","Acts 2:42-47","Ephesians 1:22-23"]},{"id":"heb-hesed","lemma":"חֶסֶד","language":"hebrew","translit":"hesed","gloss":"steadfast love, covenant loyalty","teaching":"God's loyal, promise-keeping love — the 'goodness and mercy' that pursues David in Psalm 23:6. Fulfilled in Christ, who keeps covenant for us.","key_refs":["Psalm 23:6","Exodus 34:6-7","Lamentations 3:22-23"]}],"timeline_events":[{"id":"creation","order":1,"label":"Creation","ref":"Genesis 1"},{"id":"fall","order":2,"label":"The Fall","ref":"Genesis 3"},{"id":"promise","order":3,"label":"Promise to Abraham","ref":"Genesis 12"},{"id":"exodus","order":4,"label":"The Exodus","ref":"Exodus 14"},{"id":"david","order":5,"label":"King David","ref":"2 Samuel 7"},{"id":"exile","order":6,"label":"Exile & Prophets","ref":"Isaiah 53"},{"id":"bethlehem","order":7,"label":"Jesus Is Born","ref":"Luke 2"},{"id":"cross","order":8,"label":"The Cross","ref":"John 19"},{"id":"tomb","order":9,"label":"The Empty Tomb","ref":"Luke 24"},{"id":"pentecost","order":10,"label":"The Church Is Sent","ref":"Acts 2"}]}};
const __realFetch = window.fetch ? window.fetch.bind(window) : null;

  return __realFetch ? __realFetch(input, init)
