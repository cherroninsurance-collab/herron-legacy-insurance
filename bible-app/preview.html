/* ======== pageflip.js ======== */
/* LIVING WORD — 3D interactive page-flip engine
   Physics (DESIGN.md §3.2):
     spring  a = -k(p - target) - c·v   with  k = 170, c = 24
     (slightly under-damped: ζ = c / (2√k) ≈ 0.921 → one soft settle)
     integrated semi-implicit Euler at a fixed 60 Hz step.
   FLIP_LUT_39 is the canonical 39-frame interpolation map sampled from that
   exact spring (0 → 1), used for reduced-motion devices and to keep the
   splash-screen book opening on the identical curve.
   Light-through-paper: translucency = sin(p·π) — brightest mid-turn as the
   page crosses the beam; crease specular band follows the fold.            */


const SPRING_K = 170;
const SPRING_C = 24;
const DT = 1 / 60;

/* Deterministically sample the release spring from p=0 → target=1 for 39
   fixed steps. This IS the 39-frame interpolation map — generated from the
   physics so curve and LUT can never drift apart.                          */
function buildLut(frames) {
  const lut = new Float64Array(frames);
  let p = 0, v = 0;
  for (let i = 0; i < frames; i++) {
    const a = -SPRING_K * (p - 1) - SPRING_C * v;
    v += a * DT;
    p += v * DT;
    lut[i] = p;
  }
  lut[frames - 1] = 1; // pin the settle
  return lut;
}
const FLIP_LUT_39 = buildLut(39);

/* Sample the LUT with linear interpolation; t in [0,1]. */
function sampleLut(lut, t) {
  if (t <= 0) return 0;
  if (t >= 1) return lut[lut.length - 1];
  const x = t * (lut.length - 1);
  const i = Math.floor(x);
  const f = x - i;
  return lut[i] * (1 - f) + lut[i + 1] * f;
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/**
 * PageFlip — binds fluid page-turn gestures to a .book-stage element.
 *
 * options:
 *   stage      : HTMLElement (.book-stage) containing one .leaf
 *   canGo(dir) : boolean — is there a page in that direction (+1 fwd / -1 back)
 *   onCommit(dir) : called exactly once when a turn completes; swap content here
 *   grabZone   : fraction of width on each edge that starts a drag (default .38)
 */
class PageFlip {
  constructor({ stage, canGo, onCommit, grabZone = 0.38 }) {
    this.stage = stage;
    this.leaf = stage.querySelector('.leaf');
    this.shadow = stage.querySelector('.page-shadow');
    this.canGo = canGo;
    this.onCommit = onCommit;
    this.grabZone = grabZone;

    this.p = 0;          // fold progress 0..1 (1 = fully turned)
    this.v = 0;
    this.dir = 0;        // +1 turning forward, -1 turning back
    this.target = 0;
    this.dragging = false;
    this.animating = false;
    this._acc = 0;
    this._lastT = 0;
    this._lastX = 0;
    this._velX = 0;

    this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    stage.addEventListener('pointerdown', (e) => this._down(e));
    stage.addEventListener('pointermove', (e) => this._move(e));
    stage.addEventListener('pointerup',   (e) => this._up(e));
    stage.addEventListener('pointercancel', (e) => this._up(e));
  }

  /* ------------------------------------------------------------ gestures */
  _down(e) {
    // The turn buttons live inside the stage; their presses are clicks,
    // not page grabs.
    if (e.target.closest('.turn-btn')) return;
    // Stage-relative X. (offsetX is relative to the event TARGET — a verse
    // span, a face — which made grab-zone detection reject most touches.)
    const rect = this.stage.getBoundingClientRect();
    const w = rect.width;
    const x = e.clientX - rect.left;
    const fromRight = x > w * (1 - this.grabZone);
    const fromLeft  = x < w * this.grabZone;
    if (!fromRight && !fromLeft && !this.animating) return;

    const dir = this.animating ? this.dir : (fromRight ? +1 : -1);
    if (!this.animating && !this.canGo(dir)) return;

    // Interruption-safe: capture the live spring state and hand it to the finger.
    this.dragging = true;
    this.animating = false;
    this.dir = dir;
    this._lastX = e.clientX;
    this._velX = 0;
    this._lastT = performance.now();
    this.stage.setPointerCapture(e.pointerId);
    if (this.dir === -1 && this.p === 0) this.p = 0; // back-turn starts folded from left
    this._render();
  }

  _move(e) {
    if (!this.dragging) return;
    const now = performance.now();
    const w = this.stage.clientWidth;
    const dx = e.clientX - this._lastX;
    const dt = Math.max((now - this._lastT) / 1000, 1e-4);
    this._velX = 0.8 * this._velX + 0.2 * (dx / w / dt);   // screen-widths/s, smoothed
    this._lastT = now;
    this._lastX = e.clientX;
    // forward turn: dragging left increases p; back turn: dragging right does
    this.p = clamp(this.p + (this.dir === 1 ? -dx : dx) / w, 0, 1);
    this._render();
  }

  _up(e) {
    if (!this.dragging) return;
    this.dragging = false;
    // Commit if past halfway OR flung ≥ 0.9 screen-widths/s in the turn direction.
    const fling = this.dir === 1 ? -this._velX : this._velX;
    this.target = (this.p > 0.5 || fling >= 0.9) ? 1 : 0;
    this.v = fling * (this.target === 1 ? 1 : -0.4); // carry finger momentum into the spring
    this._startSpring();
  }

  /* Edge-tap / button turn: full spring animation from rest. */
  turn(dir) {
    if (this.animating || this.dragging || !this.canGo(dir)) return;
    this.dir = dir;
    this.p = 0;
    this.v = 0;
    this.target = 1;
    if (this.reduced) return this._lutPlayback();
    this._startSpring();
  }

  /* ------------------------------------------------------------- physics */
  _startSpring() {
    this.animating = true;
    this._acc = 0;
    this._lastT = performance.now();
    requestAnimationFrame((t) => this._springFrame(t));
  }

  _springFrame(now) {
    if (this.dragging || !this.animating) return;
    this._acc += Math.min((now - this._lastT) / 1000, 0.05);
    this._lastT = now;
    // fixed-step integration keeps the curve identical across refresh rates
    while (this._acc >= DT) {
      const a = -SPRING_K * (this.p - this.target) - SPRING_C * this.v;
      this.v += a * DT;
      this.p += this.v * DT;
      this._acc -= DT;
    }
    const settled = Math.abs(this.p - this.target) < 0.0012 && Math.abs(this.v) < 0.02;
    if (settled) { this.p = this.target; this.v = 0; }
    this._render();
    if (settled) return this._finish();
    requestAnimationFrame((t) => this._springFrame(t));
  }

  /* Reduced-motion / low-GPU path: step through the canonical 39 frames. */
  _lutPlayback() {
    this.animating = true;
    let i = 0;
    const step = () => {
      if (this.dragging) return;
      this.p = FLIP_LUT_39[i++];
      this._render();
      if (i < FLIP_LUT_39.length) requestAnimationFrame(step);
      else this._finish();
    };
    requestAnimationFrame(step);
  }

  _finish() {
    this.animating = false;
    if (this.target === 1) this.onCommit(this.dir);
    this.p = 0;
    this.v = 0;
    this.dir = 0;
    this._render();
  }

  /* ------------------------------------------------------------ painting */
  _render() {
    const p = clamp(this.p, 0, 1);
    this.stage.classList.toggle('flipping', p > 0.0005);
    // cylinder-bend approximation: rotation eases slightly ahead of p at the
    // start (paper lifts before the whole leaf pivots)
    const angle = -180 * p;
    const lift = Math.sin(p * Math.PI) * 6;                 // px z-lift mid-turn
    const glow = Math.sin(p * Math.PI);                     // light through paper
    const leaf = this.leaf;

    if (this.dir >= 0) {
      leaf.style.transformOrigin = 'left center';
      leaf.style.transform = `translateZ(${lift}px) rotateY(${angle}deg)`;
    } else {
      leaf.style.transformOrigin = 'left center';
      leaf.style.transform = `translateZ(${lift}px) rotateY(${-180 + 180 * p}deg)`;
    }
    // backface luminance mix(0, .85, sin(pπ)) and crease specular position
    leaf.style.setProperty('--translucency', String(0.85 * glow));
    leaf.style.setProperty('--crease', `${(1 - p) * 100}%`);
    // Hand off front → back across the edge-on moment (p = 0.5, 90°), where
    // the leaf is nearly invisible and the swap can't be perceived. Fading
    // over a short band also kills any grazing-angle text artifact.
    const band = 0.08;
    leaf.style.setProperty('--front-vis',
      String(clamp((0.5 - p) / band, 0, 1)));
    leaf.style.setProperty('--back-vis',
      String(clamp((p - 0.5) / band, 0, 1)));
    if (this.shadow) this.shadow.style.setProperty('--under-shadow', String(glow * 0.8));
  }
}

/* ======== carousel.js ======== */
/* LIVING WORD — 3D carousel
   A ring of cards in real perspective: drag to spin with inertia, snap to
   the nearest card on release, tap the front card to open it. Used for
   browsing the 66 books of the Bible and the teachings of Jesus.
   Physics match the house style: momentum + friction, then a settle
   spring onto the snap angle — weighted and liturgical, never twitchy.  */


const FRICTION = 0.94;         // per-frame inertia decay
const SNAP_K = 130, SNAP_C = 22;   // settle spring (ζ≈0.96)
const STEP = 1 / 60;

class Carousel3D {
  /**
   * @param {Object} o
   * @param {HTMLElement} o.mount        container (gets .car3d)
   * @param {Array}    o.items           anything; renderCard maps to DOM
   * @param {Function} o.renderCard      (item, i) => HTMLElement (.car3d-card content)
   * @param {Function} o.onSelect        (item, i) called on tap of the front card
   * @param {Function} [o.onFocus]       (item, i) called whenever the front card changes
   * @param {number}   [o.cardWidth=150]
   * @param {number}   [o.spacing=1.22]  ring circumference padding factor
   */
  constructor({ mount, items, renderCard, onSelect, onFocus, cardWidth = 150, spacing = 1.22 }) {
    this.items = items;
    this.onSelect = onSelect;
    this.onFocus = onFocus;
    this.n = items.length;
    this.theta = 360 / this.n;
    // ring radius from chord length: r = (w/2) / tan(π/n)
    this.radius = Math.max(
      (cardWidth * spacing) / 2 / Math.tan(Math.PI / this.n), cardWidth);

    this.rot = 0;            // current ring rotation (deg)
    this.vel = 0;            // deg/frame
    this.focused = 0;
    this.dragging = false;
    this.settleTarget = null;

    mount.classList.add('car3d');
    this.ring = document.createElement('div');
    this.ring.className = 'car3d-ring';
    items.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'car3d-card';
      card.style.width = cardWidth + 'px';
      card.style.transform =
        `rotateY(${i * this.theta}deg) translateZ(${this.radius}px)`;
      card.append(renderCard(item, i));
      card.dataset.i = i;
      this.ring.append(card);
    });
    mount.append(this.ring);
    // pull the ring back so the front card sits at the mount's face
    mount.style.setProperty('--car3d-radius', this.radius + 'px');

    let downX = 0, downRot = 0, moved = 0, lastX = 0, lastT = 0;
    mount.addEventListener('pointerdown', (e) => {
      this.dragging = true;
      this.settleTarget = null;
      this.vel = 0;
      downX = lastX = e.clientX;
      downRot = this.rot;
      moved = 0;
      lastT = performance.now();
      mount.setPointerCapture(e.pointerId);
    });
    mount.addEventListener('pointermove', (e) => {
      if (!this.dragging) return;
      const now = performance.now();
      const dxTotal = e.clientX - downX;
      moved = Math.max(moved, Math.abs(dxTotal));
      // ~quarter turn per full-width swipe feels weighty, not slippery
      const degPerPx = 90 / Math.max(mount.clientWidth, 240);
      this.rot = downRot + dxTotal * degPerPx;
      const dt = Math.max((now - lastT) / 1000, 1e-4);
      this.vel = 0.8 * this.vel + 0.2 * ((e.clientX - lastX) * degPerPx * STEP / dt);
      lastX = e.clientX; lastT = now;
      this._paint();
    });
    const up = (e) => {
      if (!this.dragging) return;
      this.dragging = false;
      if (moved < 6) {                       // a tap, not a drag
        const card = e.target.closest('.car3d-card');
        if (card) {
          const i = +card.dataset.i;
          if (i === this.focused) this.onSelect(this.items[i], i);
          else this.goTo(i);                 // side card: bring it to front
          return;
        }
      }
      this._coast();
    };
    mount.addEventListener('pointerup', up);
    mount.addEventListener('pointercancel', up);

    this._paint();
    this._notifyFocus();
  }

  /* front index for the current rotation */
  _frontIndex() {
    const i = Math.round(-this.rot / this.theta) % this.n;
    return (i + this.n) % this.n;
  }

  /* rotate so item i faces front (shortest way around the ring) */
  goTo(i) {
    let target = -i * this.theta;
    while (target - this.rot > 180) target -= 360;
    while (target - this.rot < -180) target += 360;
    this.settleTarget = target;
    this.vel = 0;
    this._animate();
  }

  _coast() {
    this._animate();
  }

  _animate() {
    if (this._raf) return;
    const step = () => {
      this._raf = null;
      if (this.dragging) return;
      if (this.settleTarget === null) {
        this.vel *= FRICTION;
        this.rot += this.vel;
        if (Math.abs(this.vel) < 0.06) {      // slow enough: snap-settle
          let t = Math.round(this.rot / this.theta) * this.theta;
          this.settleTarget = t;
        }
      } else {
        const a = -SNAP_K * ((this.rot - this.settleTarget) * Math.PI / 180) - SNAP_C * (this.vel / STEP) * Math.PI / 180;
        this.vel += a * STEP * STEP * 180 / Math.PI;
        this.rot += this.vel;
        if (Math.abs(this.rot - this.settleTarget) < 0.05 && Math.abs(this.vel) < 0.02) {
          this.rot = this.settleTarget;
          this.settleTarget = null;
          this._paint();
          this._notifyFocus();
          return;
        }
      }
      this._paint();
      this._notifyFocus();
      this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);
  }

  _notifyFocus() {
    const f = this._frontIndex();
    if (f !== this.focused) {
      this.focused = f;
      if (this.onFocus) this.onFocus(this.items[f], f);
    }
    // depth styling: front card full, others recede
    [...this.ring.children].forEach((card, i) => {
      card.classList.toggle('front', i === f);
    });
  }

  _paint() {
    this.ring.style.transform =
      `translateZ(calc(-1 * var(--car3d-radius))) rotateY(${this.rot}deg)`;
  }
}

/* ======== db.js ======== */
/* LIVING WORD — offline storage engine (PWA mirror of data/schema.sql).
   IndexedDB on the web; the identical logical schema ships as SQLite for
   the Capacitor/Room/Core Data builds. All reads and writes are local;
   nothing ever leaves the device.

   Sandboxed contexts (private modes, embedded frames) can refuse IndexedDB
   entirely. Rather than fail, the engine falls back to an in-memory store
   with the same surface: the app stays fully usable, and only the user's
   notes and progress are session-scoped.                                  */


const DB_NAME = 'living-word';
const DB_VERSION = 1;
const STORES = ['verses','translations','crossrefs','highlights','notes',
                'bookmarks','gameProgress','journal','disciples','meta'];

let _db = null;
let _mem = null;   // set when IndexedDB is unavailable

/* ------------------------------------------- in-memory fallback engine */
function makeMemDb() {
  const data = new Map(STORES.map((s) => [s, new Map()]));
  let autoId = 1;
  const store = (name) => ({
    get: (k) => data.get(name).get(k),
    getAll: (key) => {
      const rows = [...data.get(name).values()];
      return key === undefined ? rows : rows;
    },
    put: (row) => { data.get(name).set(row.key ?? row.id ?? row.k, row); return row; },
    add: (row) => { const id = autoId++; data.get(name).set(id, { ...row, id }); return id; },
    delete: (k) => data.get(name).delete(k),
    index: (idxName) => ({
      getAll: (key) => [...data.get(name).values()].filter((r) =>
        idxName === 'byChapter' ? r.chapterKey === key : r.fromKey === key),
    }),
  });
  return { __mem: true, store };
}

function open() {
  if (_db) return Promise.resolve(_db);
  if (_mem) return Promise.resolve(_mem);
  return new Promise((resolve) => {
    let req;
    try {
      req = indexedDB.open(DB_NAME, DB_VERSION);
    } catch (_) {
      _mem = makeMemDb();
      return resolve(_mem);
    }
    req.onupgradeneeded = () => {
      const db = req.result;
      // Scripture: key 'T|b|c|v' zero-padded so ranges sort correctly.
      db.createObjectStore('verses', { keyPath: 'key' })
        .createIndex('byChapter', 'chapterKey');
      db.createObjectStore('translations', { keyPath: 'id' });
      db.createObjectStore('crossrefs', { keyPath: 'key' })
        .createIndex('byFrom', 'fromKey');
      db.createObjectStore('highlights', { keyPath: 'key' });
      db.createObjectStore('notes', { keyPath: 'id', autoIncrement: true });
      db.createObjectStore('bookmarks', { keyPath: 'key' });
      db.createObjectStore('gameProgress', { keyPath: 'key' });
      db.createObjectStore('journal', { keyPath: 'id', autoIncrement: true });
      db.createObjectStore('disciples', { keyPath: 'id', autoIncrement: true });
      db.createObjectStore('meta', { keyPath: 'k' });
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => { _mem = makeMemDb(); resolve(_mem); };
    req.onblocked = () => { _mem = makeMemDb(); resolve(_mem); };
  });
}

const pad = (n, w) => String(n).padStart(w, '0');
const vKey = (t, b, c, v) => `${t}|${pad(b,2)}|${pad(c,3)}|${pad(v,3)}`;
const cKey = (t, b, c) => `${t}|${pad(b,2)}|${pad(c,3)}`;

function tx(db, store, mode = 'readonly') {
  if (db.__mem) return db.store(store);
  return db.transaction(store, mode).objectStore(store);
}
/* Resolves either an IDBRequest or a plain value from the memory engine. */
const reqP = (r) => (r && typeof r === 'object' && 'onsuccess' in r)
  ? new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })
  : Promise.resolve(r);

/* ------------------------------------------------------------- seeding */
async function ensureSeeded() {
  const db = await open();
  const seeded = await reqP(tx(db, 'meta').get('seeded'));
  if (seeded) return getActiveTranslation();

  // Prefer a licensed ESV bundle if the deployment includes one; otherwise
  // fall back to the public-domain dev seed. Both files are precached by sw.js.
  let data = null;
  try {
    const r = await fetch('data/bible.json');           // produced by tools/import-esv.mjs
    if (r.ok) data = await r.json();
  } catch (_) { /* no licensed bundle in this build */ }
  if (!data) data = await (await fetch('data/seed-verses.json')).json();

  const t = data.translation.id;
  const rows = {
    verses: data.verses.map((r) => ({
      key: vKey(t, r.b, r.c, r.v), chapterKey: cKey(t, r.b, r.c),
      t, b: r.b, c: r.c, v: r.v, text: r.t,
    })),
    crossrefs: (data.crossReferences || []).map((x) => ({
      key: x.from.join('.') + '>' + x.to.join('.'),
      fromKey: x.from.join('.'), from: x.from, to: x.to, theme: x.theme,
    })),
  };

  if (db.__mem) {
    db.store('translations').put(data.translation);
    rows.verses.forEach((r) => db.store('verses').put(r));
    rows.crossrefs.forEach((r) => db.store('crossrefs').put(r));
    db.store('meta').put({ k: 'seeded', v: 1 });
    db.store('meta').put({ k: 'activeTranslation', v: t });
    return data.translation;
  }

  await new Promise((resolve, reject) => {
    const trx = db.transaction(['verses','translations','crossrefs','meta'], 'readwrite');
    trx.objectStore('translations').put(data.translation);
    const vs = trx.objectStore('verses');
    rows.verses.forEach((r) => vs.put(r));
    const xs = trx.objectStore('crossrefs');
    rows.crossrefs.forEach((r) => xs.put(r));
    trx.objectStore('meta').put({ k: 'seeded', v: 1 });
    trx.objectStore('meta').put({ k: 'activeTranslation', v: t });
    trx.oncomplete = resolve;
    trx.onerror = () => reject(trx.error);
  });
  return data.translation;
}

async function getActiveTranslation() {
  const db = await open();
  const m = await reqP(tx(db, 'meta').get('activeTranslation'));
  return reqP(tx(db, 'translations').get(m ? m.v : 'KJV'));
}

/* ------------------------------------------------------------ scripture */
async function getChapter(translationId, bookId, chapter) {
  const db = await open();
  const idx = tx(db, 'verses').index('byChapter');
  const rows = await reqP(idx.getAll(cKey(translationId, bookId, chapter)));
  return rows.sort((a, b) => a.v - b.v);
}

async function getVerse(translationId, bookId, chapter, verse) {
  const db = await open();
  return reqP(tx(db, 'verses').get(vKey(translationId, bookId, chapter, verse)));
}

async function getCrossRefs(bookId, chapter, verse) {
  const db = await open();
  const here = [bookId, chapter, verse].join('.');
  const all = await reqP(tx(db, 'crossrefs').getAll());
  // constellation edges are bidirectional
  return all.filter((x) => x.from.join('.') === here || x.to.join('.') === here);
}

async function getAllCrossRefs() {
  const db = await open();
  return reqP(tx(db, 'crossrefs').getAll());
}

/* ------------------------------------------------------------ user data */
async function toggleHighlight(t, b, c, v, color = 'gold') {
  const db = await open();
  const key = vKey(t, b, c, v);
  const store = tx(db, 'highlights', 'readwrite');
  const existing = await reqP(store.get(key));
  if (existing && existing.color === color) { store.delete(key); return null; }
  const row = { key, t, b, c, v, color, created: Date.now() };
  store.put(row);
  return row;
}

async function getHighlights(t, b, c) {
  const db = await open();
  const all = await reqP(tx(db, 'highlights').getAll());
  return all.filter((h) => h.t === t && h.b === b && h.c === c);
}

async function saveJournal(entry) {
  const db = await open();
  return reqP(tx(db, 'journal', 'readwrite').add({ ...entry, created: Date.now() }));
}

async function getJournal() {
  const db = await open();
  return reqP(tx(db, 'journal').getAll());
}

async function setGameProgress(lessonId, gameId, lampsLit) {
  const db = await open();
  tx(db, 'gameProgress', 'readwrite').put({
    key: `${lessonId}|${gameId}`, lessonId, gameId,
    completed: 1, lampsLit, updated: Date.now(),
  });
}

async function getGameProgress() {
  const db = await open();
  return reqP(tx(db, 'gameProgress').getAll());
}

async function addDisciple(name, generation, parentId = null) {
  const db = await open();
  return reqP(tx(db, 'disciples', 'readwrite')
    .add({ name, generation, parentId, started: Date.now() }));
}

async function getDisciples() {
  const db = await open();
  return reqP(tx(db, 'disciples').getAll());
}

const db = { ensureSeeded, getActiveTranslation, getChapter, getVerse, getCrossRefs, getAllCrossRefs, toggleHighlight, getHighlights, saveJournal, getJournal, setGameProgress, getGameProgress, addDisciple, getDisciples };
/* ======== games.js ======== */
/* LIVING WORD — interactive learning mechanics (Module 4)
   Track A: Verse Builder, The Great Timeline, Shepherd's Path.
   Track B: cross-reference constellation + DBS reflection journal.
   Design rules: no timers, no failure buzzers, no loot, no leaderboards.
   Wrong answers re-read the Word; completion lights a lamp (Ps 119:105).  */


/* Deterministic-feeling gentle shuffle (Fisher–Yates). */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function celebration(container, message) {
  const c = el('div', 'game-celebrate glass halo');
  c.append(el('div', 'lamp-glyph', '🕯️'), el('p', null, message));
  container.append(c);
  requestAnimationFrame(() => c.classList.add('shown'));
}

/* =============================================================== Track A */

/**
 * 1. VERSE BUILDER — the memory verse appears as luminous glass word-tiles
 * scattered in the beam; the child taps them in order. A correct tile
 * "sets" into the verse line with a soft glow; a wrong tile pulses gently
 * and the assembled-so-far text is re-read aloud via speechSynthesis.
 */
function verseBuilder(container, { lessonId, refLabel, verseText, onComplete }) {
  container.innerHTML = '';
  const words = verseText.split(/\s+/);
  let next = 0;

  container.append(el('h3', 'game-title ca-heading', 'Verse Builder'));
  container.append(el('p', 'game-sub', refLabel));
  const line = el('div', 'vb-line scripture');
  const pool = el('div', 'vb-pool');
  container.append(line, pool);

  function accept(tile, w) {
    tile.disabled = true;
    tile.classList.add('vb-set');
    const set = el('span', 'vb-word', (next ? ' ' : '') + w);
    line.append(set);
    requestAnimationFrame(() => set.classList.add('lit'));
    next++;
    if (next === words.length) {
      line.classList.add('vb-complete');
      db.setGameProgress(lessonId, 'verse-builder', 1);
      celebration(container, 'The whole verse shines as one. Say it out loud!');
      if (onComplete) onComplete();
    }
  }

  shuffle(words.map((w, i) => ({ w, i }))).forEach(({ w, i }) => {
    const tile = el('button', 'vb-tile glass', w);
    tile.addEventListener('click', () => {
      // Accept an exact-position match OR an identical duplicate word —
      // children shouldn't be penalized for indistinguishable tiles.
      if (i === next || w === words[next]) {
        accept(tile, w);
      } else {
        tile.classList.remove('vb-nudge');
        void tile.offsetWidth;              // restart the gentle pulse
        tile.classList.add('vb-nudge');
        readAloud(words.slice(0, next).join(' '));
      }
    });
    pool.append(tile);
  });
}

/**
 * 2. THE GREAT TIMELINE — redemptive-history events are placed onto an
 * illuminated river flowing left→right. The child taps the event that
 * comes next; each correct placement lights that segment of the river,
 * visually building the one story that leads to Christ.
 */
function greatTimeline(container, { lessonId, events, onComplete }) {
  container.innerHTML = '';
  const ordered = events.slice().sort((a, b) => a.order - b.order);
  let next = 0;

  container.append(el('h3', 'game-title ca-heading', 'The Great Timeline'));
  container.append(el('p', 'game-sub', 'One story, from the garden to the nations. What happened first?'));

  const river = el('div', 'tl-river');
  ordered.forEach(() => river.append(el('div', 'tl-segment')));
  const slots = el('div', 'tl-slots');
  const pool = el('div', 'tl-pool');
  container.append(river, slots, pool);

  shuffle(ordered).forEach((ev) => {
    const card = el('button', 'tl-card glass', '');
    card.append(el('strong', null, ev.label), el('small', null, ev.ref));
    card.addEventListener('click', () => {
      if (ev.order === ordered[next].order) {
        card.disabled = true;
        card.classList.add('tl-placed');
        slots.append(card);
        river.children[next].classList.add('lit');
        next++;
        if (next === ordered.length) {
          db.setGameProgress(lessonId, 'great-timeline', 1);
          celebration(container,
            'The river of light runs from Creation all the way to Christ and His church — one story!');
          if (onComplete) onComplete();
        }
      } else {
        card.classList.remove('vb-nudge');
        void card.offsetWidth;
        card.classList.add('vb-nudge');
      }
    });
    pool.append(card);
  });
}

/**
 * 3. SHEPHERD'S PATH — a guided quest through Psalm 23 / Luke 15.
 * The child leads a lamb scene by scene by answering comprehension
 * choices drawn from the text. A wrong answer gently re-reads the verse —
 * never a penalty. Ends at the Shepherd who leaves the ninety-nine.
 */
const SHEPHERD_SCENES = [
  {
    art: '🌿', verse: 'He maketh me to lie down in green pastures: he leadeth me beside the still waters. (Psalm 23:2)',
    q: 'Where does the Shepherd lead his sheep to rest?',
    choices: ['Green pastures and still waters', 'A busy city', 'A dry desert'], answer: 0,
  },
  {
    art: '🌑', verse: 'Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me. (Psalm 23:4)',
    q: 'Why does the sheep not need to be afraid in the dark valley?',
    choices: ['Because the valley is short', 'Because the Shepherd is WITH him', 'Because sheep can see in the dark'], answer: 1,
  },
  {
    art: '🐑', verse: 'What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine... and go after that which is lost, until he find it? (Luke 15:4)',
    q: 'What does the shepherd do when ONE sheep is lost?',
    choices: ['Waits for it to come back', 'Says ninety-nine is enough', 'Goes after it until he finds it'], answer: 2,
  },
  {
    art: '🎉', verse: 'And when he hath found it, he layeth it on his shoulders, rejoicing. (Luke 15:5)',
    q: 'How does the shepherd carry the found sheep home?',
    choices: ['On his shoulders, rejoicing', 'He makes it walk behind him', 'He sends another sheep to get it'], answer: 0,
  },
];

function shepherdPath(container, { lessonId, onComplete }) {
  container.innerHTML = '';
  let scene = 0;

  container.append(el('h3', 'game-title ca-heading', "Shepherd's Path"));
  const stage = el('div', 'sp-stage glass');
  const path = el('div', 'sp-path');
  SHEPHERD_SCENES.forEach(() => path.append(el('span', 'sp-step', '·')));
  container.append(stage, path);

  function render() {
    const s = SHEPHERD_SCENES[scene];
    stage.innerHTML = '';
    stage.append(el('div', 'sp-art', s.art));
    stage.append(el('p', 'scripture sp-verse', s.verse));
    stage.append(el('p', 'sp-q', s.q));
    s.choices.forEach((c, i) => {
      const b = el('button', 'btn sp-choice', c);
      b.addEventListener('click', () => {
        if (i === s.answer) {
          path.children[scene].classList.add('lit');
          scene++;
          if (scene === SHEPHERD_SCENES.length) {
            stage.innerHTML = '';
            stage.append(el('div', 'sp-art', '✨🐑✨'));
            stage.append(el('p', 'scripture sp-verse',
              'Likewise joy shall be in heaven over one sinner that repenteth. (Luke 15:7)'));
            db.setGameProgress(lessonId, 'shepherd-path', 1);
            celebration(container, 'The Shepherd carried the lamb all the way home. He is Jesus — and He came looking for you.');
            if (onComplete) onComplete();
          } else {
            render();
          }
        } else {
          // wrong answers re-read the verse rather than penalize
          stage.querySelector('.sp-verse').classList.remove('vb-nudge');
          void stage.offsetWidth;
          stage.querySelector('.sp-verse').classList.add('vb-nudge');
          readAloud(s.verse);
        }
      });
      stage.append(b);
    });
  }
  render();
}

/* =============================================================== Track B */

/**
 * CROSS-REFERENCE CONSTELLATION — the current verse is a star; its
 * cross-references are connected stars across both testaments. Themes
 * (lamb, light, word, shepherd, salvation, mission) render as constellations.
 */
async function constellation(canvas, focusRef /* [b,c,v] or null */) {
  const refs = await db.getAllCrossRefs();
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // Collect unique nodes; x = canonical position (book), y = theme band.
  const themes = [...new Set(refs.map((r) => r.theme))];
  const nodes = new Map();
  const nodeKey = (a) => a.join('.');
  for (const r of refs) {
    for (const p of [r.from, r.to]) {
      const k = nodeKey(p);
      if (!nodes.has(k)) {
        const themeIdx = themes.indexOf(r.theme);
        nodes.set(k, {
          p,
          x: 30 + (p[0] / 66) * (W - 60),
          y: 40 + (themeIdx / Math.max(themes.length - 1, 1)) * (H - 90)
             + Math.sin(p[0] * 3.7 + p[1]) * 14,
        });
      }
    }
  }

  ctx.clearRect(0, 0, W, H);
  // luminous vellum ground — an illuminated manuscript, not a night sky
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#fff4dd');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // OT|NT meridian
  const mx = 30 + (39.5 / 66) * (W - 60);
  ctx.strokeStyle = 'rgba(154,109,18,.30)';
  ctx.setLineDash([3, 7]); ctx.beginPath();
  ctx.moveTo(mx, 16); ctx.lineTo(mx, H - 16); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(27,35,64,.55)'; ctx.font = '10px sans-serif';
  ctx.fillText('OLD TESTAMENT', 30, 14);
  ctx.fillText('NEW TESTAMENT', mx + 10, 14);

  const focusKey = focusRef ? focusRef.join('.') : null;
  // threads of gold
  for (const r of refs) {
    const a = nodes.get(nodeKey(r.from)), b = nodes.get(nodeKey(r.to));
    const hot = focusKey && (nodeKey(r.from) === focusKey || nodeKey(r.to) === focusKey);
    ctx.strokeStyle = hot ? 'rgba(154,109,18,.95)' : 'rgba(199,146,38,.5)';
    ctx.lineWidth = hot ? 1.8 : 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // glowing nodes
  for (const [k, n] of nodes) {
    const hot = k === focusKey;
    const r = hot ? 5 : 3;
    const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 4);
    glow.addColorStop(0, hot ? 'rgba(255,190,60,.75)' : 'rgba(255,207,107,.55)');
    glow.addColorStop(1, 'rgba(255,207,107,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hot ? '#8a5e08' : '#c79226';
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
  }
  return nodes; // caller may hit-test taps against these positions
}

function readAloud(text) {

    speechSynthesis.cancel();

/* ======== splash.js ======== */
/* LIVING WORD — Splash & Opening Experience
   WebGL volumetric god-rays + dust motes under a CSS-3D holographic Bible.
   Timeline (see docs/DESIGN.md §1.3): void → descending shaft → Bible rises →
   cover opens (39-frame curve) → upward bloom + title → light-gate dissolve.
   Entirely offline: shaders inline, zero network. Skippable after 1.5s.      */


const SPLASH_VERT = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

/* God-rays: a top-anchored volumetric shaft with animated dust, plus a
   late-phase upward bloom from the book (uBloom) and radial gate arcs
   for the exit transition (uGate). Warm white→gold only, per §1.2.     */
const SPLASH_FRAG = `
precision mediump float;
uniform vec2  uRes;
uniform float uTime;    // seconds since splash start
uniform float uShaft;   // 0..1 shaft intensity
uniform float uBloom;   // 0..1 upward bloom from opened book
uniform float uGate;    // 0..1 exit gate transition

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), f.x),
             mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;          // 0..1, y up
  // Daybreak sky: warm horizon below, cool luminous heaven above. Kept
  // saturated enough that the brilliant shaft still reads AS a shaft.
  vec3 skyLow  = vec3(1.000, 0.933, 0.769);
  vec3 skyMid  = vec3(0.835, 0.902, 1.000);
  vec3 skyHigh = vec3(0.604, 0.769, 0.973);
  vec3 col = mix(mix(skyLow, skyMid, smoothstep(0.0, 0.55, uv.y)),
                 skyHigh, smoothstep(0.5, 1.0, uv.y));

  vec3 gold  = vec3(1.000, 0.878, 0.560);
  vec3 white = vec3(1.000, 0.992, 0.957);

  // ------- descending volumetric shaft (widens toward the floor)
  float cx = uv.x - 0.5;
  float halfW = mix(0.10, 0.34, 1.0 - uv.y);           // cone
  float core = 1.0 - smoothstep(0.0, halfW, abs(cx));
  // animated volumetric density: two drifting noise octaves
  float dens = 0.70
    + 0.30 * noise(vec2(uv.x * 6.0, uv.y * 3.0 - uTime * 0.12))
    * (0.6 + 0.4 * noise(vec2(uv.x * 14.0 + 7.0, uv.y * 7.0 - uTime * 0.3)));
  float fallY = smoothstep(0.0, 0.35, uv.y);           // fades near floor
  float shaft = core * core * dens * mix(0.55, 1.0, uv.y) * uShaft;
  col += shaft * mix(gold, white, uv.y) * 1.35;
  col += core * fallY * 0.24 * uShaft * gold;          // soft haze
  // broad glow spilling out of the beam, warming the whole sky
  col += (1.0 - smoothstep(0.0, 0.85, abs(cx))) * uShaft * gold * 0.14 * mix(0.4, 1.0, uv.y);

  // ------- dust motes drifting through the beam
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    vec2 gp = uv * (34.0 + fi * 21.0);
    gp.y += uTime * (0.9 + fi * 0.55);
    gp.x += sin(uTime * 0.4 + fi * 2.1) * 0.35;
    vec2 cell = floor(gp);
    vec2 p = fract(gp) - 0.5;
    float sparkle = smoothstep(0.09, 0.0, length(p + (vec2(hash(cell), hash(cell + 9.0)) - 0.5) * 0.6));
    col += sparkle * core * uShaft * white * (0.22 - fi * 0.05);
  }

  // ------- upward bloom from the opened book (light returns to source)
  vec2 bookP = vec2(0.5, 0.34);
  float d = distance(uv * vec2(uRes.x / uRes.y, 1.0), bookP * vec2(uRes.x / uRes.y, 1.0));
  float bloom = exp(-d * d * 7.0) * uBloom;
  float upBeam = (1.0 - smoothstep(0.0, 0.20, abs(cx))) * smoothstep(0.30, 0.95, uv.y) * uBloom;
  col += (bloom * 1.7 + upBeam * 0.85) * mix(gold, white, 0.6);

  // ------- exit: concentric luminous gate arcs (Rev 21:25)
  if (uGate > 0.001) {
    float rings = sin((d * 26.0 - uGate * 22.0)) * 0.5 + 0.5;
    float gate = smoothstep(0.0, 1.0, uGate) * rings * exp(-d * 2.2);
    col = mix(col, white, gate * 0.9 * uGate);
    col = mix(col, white, smoothstep(0.65, 1.0, uGate)); // final white-out
  }

  // barely-there vignette: keeps focus without dimming the sky
  float vig = smoothstep(1.35, 0.5, length(uv - vec2(0.5, 0.45)));
  col *= mix(0.95, 1.0, vig);

  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error('Shader compile failed: ' + gl.getShaderInfoLog(s));
  }
  return s;
}

/* Easing along the 39-frame opening curve shared with the reader engine.  */

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const smooth = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
/* phase(t, start, end) → 0..1 progress of a timeline beat */
const phase = (t, a, b) => clamp01((t - a) / (b - a));

function runSplash(onDone) {
  const root = document.getElementById('splash');
  const canvas = document.getElementById('splash-gl');
  const bookEl = document.getElementById('splash-book');
  const coverEl = bookEl.querySelector('.cover');
  const fanEls = [...bookEl.querySelectorAll('.fan')];
  const titleEl = document.getElementById('splash-title');
  root.style.display = 'block';

  let gl = null, uni = {};
  try {
    gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (gl) {
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, SPLASH_VERT));
      gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, SPLASH_FRAG));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      for (const n of ['uRes','uTime','uShaft','uBloom','uGate']) {
        uni[n] = gl.getUniformLocation(prog, n);
      }
    }
  } catch (e) {
    gl = null; // CSS ambient-beam fallback still shows; splash degrades gracefully
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize();
  addEventListener('resize', resize);

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_END = reduced ? 1.2 : 4.2;
  const t0 = performance.now();
  let skipped = false, finished = false;

  const skip = () => { if ((performance.now() - t0) / 1000 > 1.5) skipped = true; };
  root.addEventListener('pointerdown', skip);

  function finish() {
    if (finished) return;
    finished = true;
    removeEventListener('resize', resize);
    root.style.display = 'none';
    onDone();
  }

  function frame(now) {
    if (finished) return;
    let t = (now - t0) / 1000;
    if (skipped) t = Math.max(t, T_END - 0.45); // jump to the gate dissolve

    // Beat intensities per the visual script
    const shaft = smooth(phase(t, 0.0, 0.8));
    const rise  = smooth(phase(t, 0.8, 1.6));
    const open  = phase(t, 1.6, 2.8);              // fed through the 39-frame LUT
    const bloom = smooth(phase(t, 2.8, 3.4));
    const gate  = smooth(phase(t, 3.6, 4.2));

    if (gl) {
      gl.uniform2f(uni.uRes, canvas.width, canvas.height);
      gl.uniform1f(uni.uTime, t);
      gl.uniform1f(uni.uShaft, shaft * (1 - gate * 0.7));
      gl.uniform1f(uni.uBloom, bloom * (1 - gate));
      gl.uniform1f(uni.uGate, gate);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // ---- 3D holographic Bible rig (CSS 3D over the shader)
    const y = (1 - rise) * 46;                      // rises from beneath
    bookEl.style.opacity = String(rise);
    bookEl.style.transform =
      `translate(-50%, calc(-50% + ${y}vh)) rotateX(14deg) rotateY(${8 * rise}deg)`;

    // Cover opens along the shared page-turn curve; pages fan behind it.
    const eased = sampleLut(FLIP_LUT_39, clamp01(open));
    coverEl.style.transform = `rotateY(${-172 * eased}deg)`;
    coverEl.style.setProperty('--translucency', String(Math.sin(eased * Math.PI)));
    fanEls.forEach((el, i) => {
      const lag = clamp01(open * 1.35 - (i + 1) * 0.12);
      const e = sampleLut(FLIP_LUT_39, lag);
      el.style.transform = `rotateY(${-160 * e}deg)`;
      el.style.setProperty('--translucency', String(Math.sin(e * Math.PI) * 0.9));
    });
    bookEl.style.setProperty('--book-bloom', String(bloom));

    titleEl.style.opacity = String(smooth(phase(t, 2.9, 3.5)) * (1 - gate));
    titleEl.style.transform = `translateX(-50%) translateY(${(1 - smooth(phase(t, 2.9, 3.5))) * 14}px)`;

    if (t >= T_END) { finish(); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ================================================================ boot */
async function boot() {
  // Offline packaging. Absent (single-file build) or blocked (sandboxed
  // frame) service workers are fine — the app never needs the network.
  try {
    if ('serviceWorker' in navigator && !window.__LIVING_WORD_SINGLE_FILE) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (_) { /* no service worker available in this context */ }

  const [translation, curriculum, overview, teachings] = await Promise.all([
    db.ensureSeeded(),
    fetch('data/curriculum.json').then((r) => r.json()),
    fetch('data/bible-overview.json').then((r) => r.json()),
    fetch('data/jesus-teachings.json').then((r) => r.json()),
  ]);
  TRANSLATION = translation;
  CURRICULUM = curriculum;
  OVERVIEW = overview;
  TEACHINGS = teachings;

  runSplash(() => {
    show('home');
    renderHome();
  });
  initReader();
  initTabs();
}

function show(name) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
  $('#screen-' + name).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach((b) =>
    b.classList.toggle('on', b.dataset.screen === name));
  if (name === 'read') renderChapter();
  if (name === 'learn') renderLearnIndex();
  if (name === 'study') renderStudy();
  if (name === 'books') renderBooks();
  if (name === 'jesus') renderJesus();
}

function initTabs() {
  document.querySelectorAll('.tabbar button').forEach((b) =>
    b.addEventListener('click', () => show(b.dataset.screen)));
  document.querySelectorAll('[data-back]').forEach((b) =>
    b.addEventListener('click', () => show(b.dataset.back)));
}

      <div class="teach-body" hidden>
        <div class="lesson-step glass"><span class="kind">What Jesus taught</span><p>${it.teaching}</p></div>
        <div class="lesson-step glass christ-box"><span class="kind">Live it</span><p>${it.live}</p></div>
      </div>`;
    c.addEventListener('click', () => {
      const bodyEl = c.querySelector('.teach-body');
      bodyEl.hidden = !bodyEl.hidden;
      c.classList.toggle('open', !bodyEl.hidden);
    });
    body.append(c);
  });
}

/* ============================================================== reader */
function initReader() {
  const bookSel = $('#sel-book');
  const chapSel = $('#sel-chapter');
  for (const [id, name] of BOOKS) {
    const o = document.createElement('option');
    o.value = id; o.textContent = name;
    bookSel.append(o);
  }
  bookSel.addEventListener('change', () => {
    reader.book = +bookSel.value; reader.chapter = 1; renderChapter();
  });
  chapSel.addEventListener('change', () => {
    reader.chapter = +chapSel.value; renderChapter();
  });
  $('#btn-books').addEventListener('click', () => show('books'));

  flip = new PageFlip({
    stage: $('#book-stage'),
    grabZone: 0.44,
    canGo: (dir) => nextRef(dir) !== null,
    onCommit: (dir) => {
      const n = nextRef(dir);
      if (n) { reader = n; renderChapter(); }
    },
  });
  $('#turn-prev').addEventListener('click', () => flip.turn(-1));
  $('#turn-next').addEventListener('click', () => flip.turn(+1));
}

function nextRef(dir) {
  let { book, chapter } = reader;
  chapter += dir;
  if (chapter < 1) {
    if (book === 1) return null;
    book -= 1; chapter = chapterCount(book);
  } else if (chapter > chapterCount(book)) {
    if (book === 66) return null;
    book += 1; chapter = 1;
  }
  return { book, chapter };
}

async function renderChapter() {
  $('#sel-book').value = reader.book;
  const chapSel = $('#sel-chapter');
  chapSel.innerHTML = '';
  for (let i = 1; i <= chapterCount(reader.book); i++) {
    const o = document.createElement('option');
    o.value = i; o.textContent = 'Ch ' + i;
    chapSel.append(o);
  }
  chapSel.value = reader.chapter;

  const face = $('#book-stage .leaf .face.front');
  const [verses, highlights] = await Promise.all([
    db.getChapter(TRANSLATION.id, reader.book, reader.chapter),
    db.getHighlights(TRANSLATION.id, reader.book, reader.chapter),
  ]);
  const hlMap = new Map(highlights.map((h) => [h.v, h.color]));

  let html = `<div class="chapter-title">${bookName(reader.book).toUpperCase()} ${reader.chapter}</div>`;
  if (!verses.length) {
    const ov = OVERVIEW.books.find((o) => o.b === reader.book);
    html += `<div class="no-text-notice">
      <p class="scripture" style="font-style:italic">“${ov ? ov.t : ''}”</p><br>
      This chapter's full text is not in the development seed — the licensed ESV
      bundle (all 31,102 verses) loads it offline. Meanwhile, the main lessons of
      ${bookName(reader.book)} are one tap away.<br><br></div>`;
    if (ov) {
      html += `<div style="text-align:center"><button class="btn btn--gold" id="nt-lessons">
        Main Lessons of ${bookName(reader.book)}</button></div>`;
    }
  } else {
    html += '<div class="scripture">' + verses.map((v) => {
      const hl = hlMap.has(v.v) ? ` class="hl-${hlMap.get(v.v)}"` : '';
      return `<span${hl} data-v="${v.v}"><span class="vnum">${v.v}</span>${escapeHtml(v.text)} </span>`;
    }).join('') + '</div>';
    html += `<p class="copyright-notice">${escapeHtml(TRANSLATION.copyright.split('.')[0])}.</p>`;
  }
  face.innerHTML = html;

  const lessonsBtn = face.querySelector('#nt-lessons');
  if (lessonsBtn) lessonsBtn.addEventListener('click', () => {
    const ov = OVERVIEW.books.find((o) => o.b === reader.book);
    show('books');
    booksCarousel.goTo(OVERVIEW.books.indexOf(ov));
    renderBookDetail(ov);
  });

  // tap a verse to toggle a gold highlight
  face.querySelectorAll('[data-v]').forEach((span) => {
    span.addEventListener('click', async () => {
      const row = await db.toggleHighlight(TRANSLATION.id, reader.book, reader.chapter, +span.dataset.v);
      span.className = row ? 'hl-' + row.color : '';
    });
  });
}

const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =========================================================== learn tab */
function renderLearnIndex() {
  const body = $('#screen-learn .screen-body');
  body.innerHTML = '<h2 class="ca-heading">Learn</h2>';

  // gateways to the deep libraries
  const gates = [
    ['📚', 'The 66 Books', 'Main lessons for every book, Genesis to Revelation — spin the carousel.', () => show('books')],
    ['✝️', 'The Teachings of Jesus', 'Sermon on the Mount · Parables · I AM · Miracles · Final words.', () => show('jesus')],
  ];
  for (const [glyph, title, sub, go] of gates) {
    const c = document.createElement('div');
    c.className = 'card glass halo';
    c.innerHTML = `<h3>${glyph}&nbsp; ${title}</h3><p>${sub}</p>`;
    c.addEventListener('click', go);
    body.append(c);
  }

  const a = CURRICULUM.trackA;
  body.insertAdjacentHTML('beforeend',
    `<p class="game-sub" style="margin-top:18px">TRACK A · ${a.name}</p>`);
  for (const unit of a.units) {
    for (const lesson of unit.lessons) {
      body.append(lessonCard(lesson, () => renderLessonA(lesson)));
    }
  }
  const b = CURRICULUM.trackB;
  body.insertAdjacentHTML('beforeend',
    `<p class="game-sub" style="margin-top:18px">TRACK B · ${b.name}</p>`);
  for (const course of b.courses) {
    for (const study of course.studies) {
      body.append(lessonCard(study, () => renderStudyB(study)));
    }
  }
}

function lessonCard(l, onOpen) {
  const c = document.createElement('div');
  c.className = 'card glass';
  c.innerHTML = `<h3>${l.title}</h3><p>${l.passage_ref} — ${l.big_truth}</p>`;
  c.addEventListener('click', onOpen);
  return c;
}

async function renderLessonA(lesson) {
  const body = $('#screen-learn .screen-body');
  body.innerHTML = `<button class="back-link">‹ All lessons</button>
    <h2 class="ca-heading">${lesson.title}</h2>
    <p class="game-sub">${lesson.passage_ref}</p>`;
  body.querySelector('.back-link').addEventListener('click', renderLearnIndex);

  // The passage itself is always visually primary (Sola Scriptura rule).
  const verses = await db.getChapter(TRANSLATION.id, lesson.ref.b, lesson.ref.c);
  const inRange = verses.filter((v) => v.v >= lesson.ref.vs && v.v <= lesson.ref.ve);
  if (inRange.length) {
    body.insertAdjacentHTML('beforeend',
      `<div class="card glass halo"><div class="scripture">` +
      inRange.map((v) => `<span><span class="vnum">${v.v}</span>${escapeHtml(v.text)} </span>`).join('') +
      `</div></div>`);
  }

  for (const step of lesson.steps) {
    const c = document.createElement('div');
    c.className = 'lesson-step glass';
    c.innerHTML = `<span class="kind">${step.kind}</span><p>${step.body}</p>`;
    body.append(c);
    if (step.kind === 'play' && step.game_id) {
      const host = document.createElement('div');
      host.className = 'game-host glass card';
      c.append(host);
      launchGame(step.game_id, host, lesson);
    }
  }

  body.insertAdjacentHTML('beforeend', `
    <div class="lesson-step glass christ-box"><span class="kind">Where is Jesus here?</span>
      <p>${lesson.christ_connection}</p></div>
    <div class="lesson-step glass"><span class="kind">What will I do?</span><p>${lesson.obedience_step}</p></div>
    <div class="lesson-step glass"><span class="kind">Who will I tell?</span><p>${lesson.multiply_step}</p></div>`);
}

async function launchGame(gameId, host, lesson) {
  if (gameId === 'verse-builder') {
    const mv = lesson.memory_verse;
    const rows = await db.getChapter(TRANSLATION.id, mv.b, mv.c);
    const text = rows.filter((v) => v.v >= mv.vs && v.v <= mv.ve).map((v) => v.text).join(' ');
    games.verseBuilder(host, { lessonId: lesson.id, refLabel: mv.ref, verseText: text });
  } else if (gameId === 'great-timeline') {
    games.greatTimeline(host, { lessonId: lesson.id, events: CURRICULUM.timeline_events });
  } else if (gameId === 'shepherd-path') {
    games.shepherdPath(host, { lessonId: lesson.id });
  }
}

function renderStudyB(study) {
  const body = $('#screen-learn .screen-body');
  body.innerHTML = `<button class="back-link">‹ All lessons</button>
    <h2 class="ca-heading">${study.title}</h2>
    <p class="game-sub">${study.passage_ref}</p>
    <div class="lesson-step glass"><span class="kind">Context</span><p>${study.context}</p></div>
    <div class="lesson-step glass christ-box"><span class="kind">Christ at the Center</span><p>${study.christ_connection}</p></div>
    <div class="lesson-step glass"><span class="kind">Defending the Hope</span><p>${study.apologetic}</p></div>`;
  body.querySelector('.back-link').addEventListener('click', renderLearnIndex);

  for (const vid of study.vocab || []) {
    const v = CURRICULUM.vocab.find((x) => x.id === vid);
    if (v) body.insertAdjacentHTML('beforeend', vocabCardHtml(v));
  }

  const refl = document.createElement('div');
  body.append(refl);
  games.reflection(refl, { studyId: study.id, passageRef: study.passage_ref, prompts: study.dbs });

  body.insertAdjacentHTML('beforeend', `
    <div class="lesson-step glass"><span class="kind">Obey</span><p>${study.obedience_step}</p></div>
    <div class="lesson-step glass"><span class="kind">Multiply</span><p>${study.multiply_step}</p></div>`);
}

const vocabCardHtml = (v) => `
  <div class="vocab-card glass">
    <span class="lemma">${v.lemma}</span><span class="translit">${v.translit}</span>
    <p><strong>${v.gloss}</strong></p><p>${v.teaching}</p>
    <p class="game-sub">Key texts: ${v.key_refs.join(' · ')}</p>
  </div>`;

/* =========================================================== study tab */
async function renderStudy() {
  const body = $('#screen-study .screen-body');
  body.innerHTML = `<h2 class="ca-heading">Study Deep</h2>
    <p class="game-sub">Cross-reference constellation — the threads of one story, drawn in light.</p>
    <canvas id="constellation-canvas"></canvas>
    <p class="game-sub" style="margin-top:16px">WORD STUDIES</p>
    <div id="vocab-list"></div>
    <p class="game-sub" style="margin-top:16px">MULTIPLICATION LEDGER · 2 Timothy 2:2</p>
    <div id="ledger"></div>`;

  requestAnimationFrame(() => games.constellation($('#constellation-canvas'), null));
  $('#vocab-list').innerHTML = CURRICULUM.vocab.map(vocabCardHtml).join('');
  renderLedger();
}

async function renderLedger() {
  const box = $('#ledger');
  const rows = await db.getDisciples();
  const byGen = new Map();
  rows.forEach((d) => byGen.set(d.generation, [...(byGen.get(d.generation) || []), d]));
  let html = '';
  if (!rows.length) {
    html += `<p class="game-sub">“And the things that thou hast heard of me… commit thou to
      faithful men, who shall be able to teach others also.” Who is your first name?</p>`;
  }
  for (const gen of [...byGen.keys()].sort()) {
    html += `<div class="ledger-gen">Generation ${gen}</div>`;
    html += byGen.get(gen).map((d) => `<div class="ledger-row glass">🕊️ ${escapeHtml(d.name)}</div>`).join('');
  }
  html += `<div class="ledger-add">
      <input id="ledger-name" placeholder="Name of a disciple you are teaching" maxlength="60">
      <button class="btn btn--gold" id="ledger-btn">Add</button>
    </div>`;
  box.innerHTML = html;
  $('#ledger-btn').addEventListener('click', async () => {
    const name = $('#ledger-name').value.trim();
    if (!name) return;
    await db.addDisciple(name, 1);
    renderLedger();
  });
}

boot();
