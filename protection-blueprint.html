 /* 11px — eyebrow micro */\n  --text-xs: 0.75rem;      /* 12px — captions, legal */\n  --text-sm: 0.875rem;     /* 14px — meta, labels */\n  --text-base: 1rem;       /* 16px — body */\n  --text-md: 1.125rem;     /* 18px — lead body */\n  --text-lg: 1.375rem;     /* 22px — card titles */\n  --text-xl: 1.75rem;      /* 28px — subsection */\n  --text-2xl: 2.25rem;     /* 36px — section head */\n  --text-3xl: 3rem;        /* 48px — page head */\n  --text-4xl: 3.75rem;     /* 60px — hero */\n  --text-5xl: 4.75rem;     /* 76px — display hero */\n\n  /* Weights */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium: 500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700; /* @kind font */\n  --fw-black: 800; /* @kind font */\n\n  /* Line heights */\n  --lh-tight: 1.05; /* @kind font */\n  --lh-snug: 1.18; /* @kind font */\n  --lh-normal: 1.4; /* @kind font */\n  --lh-relaxed: 1.62; /* @kind font */\n\n  /* Letter spacing */\n  --ls-tight: -0.02em; /* @kind font */\n  --ls-snug: -0.01em; /* @kind font */\n  --ls-normal: 0; /* @kind font */\n  --ls-wide: 0.02em; /* @kind font */\n  --ls-eyebrow: 0.14em; /* @kind font */\n\n  /* Semantic roles */\n  --font-heading: var(--font-display);\n  --font-body: var(--font-sans);\n  --font-eyebrow: var(--font-sans);\n}\n\n/* Herron & Co. — Spacing & sizing tokens (4px base grid) */\n:root{\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4 */\n  --space-2: 0.5rem;    /* 8 */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.5rem;    /* 24 */\n  --space-6: 2rem;      /* 32 */\n  --space-7: 2.5rem;    /* 40 */\n  --space-8: 3rem;      /* 48 */\n  --space-9: 4rem;      /* 64 */\n  --space-10: 5rem;     /* 80 */\n  --space-12: 7rem;     /* 112 */\n  --space-16: 10rem;    /* 160 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-narrow: 820px;\n  --container-wide: 1360px;\n  --gutter: 1.5rem;\n  --section-y: 6rem;        /* vertical rhythm between page sections */\n  --section-y-sm: 3.5rem;\n\n  /* Control sizing */\n  --control-h-sm: 34px;\n  --control-h-md: 44px;     /* default tap target */\n  --control-h-lg: 54px;\n}\n\n/* Herron & Co. — Radius, border & shadow tokens */\n:root{\n  /* Corner radii — restrained, editorial. Cards are softly rounded, not pill-y. */\n  --radius-none: 0;\n  --radius-sm: 6px;\n  --radius-md: 10px;     /* default card / input */\n  --radius-lg: 16px;     /* feature panels */\n  --radius-xl: 24px;     /* hero / large media */\n  --radius-pill: 999px;  /* chips, pills, eyebrow tags */\n\n  /* Border widths */\n  --border-1: 1px;\n  --border-2: 2px;       /* focus, active accent */\n  --border-hair: 1px;\n\n  /* Shadows — soft, warm, low-spread. Trustworthy, never neon. */\n  --shadow-xs: 0 1px 2px rgba(15,22,38,0.06);\n  --shadow-sm: 0 1px 3px rgba(15,22,38,0.08), 0 1px 2px rgba(15,22,38,0.04);\n  --shadow-md: 0 6px 16px rgba(15,22,38,0.08), 0 2px 4px rgba(15,22,38,0.05);\n  --shadow-lg: 0 18px 40px rgba(15,22,38,0.12), 0 4px 10px rgba(15,22,38,0.06);\n  --shadow-xl: 0 32px 70px rgba(15,22,38,0.18);\n\n  /* On-navy elevation (glow + inner hairline) */\n  --shadow-ink: 0 20px 50px rgba(3,10,30,0.55);\n  --ring-gold: 0 0 0 3px rgba(232,168,74,0.35);\n  --ring-focus: 0 0 0 3px rgba(62,127,224,0.35);\n\n  /* Gold underline accent (the \"baseline\" motif) */\n  --accent-underline: 3px;\n}\n\n/* Herron & Co. — Motion tokens\n   Calm, confident, editorial. Fades + gentle rises, never bouncy. */\n:root{\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n  --dur-slower: 560ms; /* @kind other */\n\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --ease-emphasis: cubic-bezier(0.34, 1.3, 0.64, 1); /* @kind other */\n\n  --hover-lift: -2px; /* @kind other */\n  --press-scale: 0.98; /* @kind other */\n}\n\n/* Herron & Co. — Base element defaults & shared primitives.\n   Kept minimal: resets, sensible typographic defaults, link + selection styling,\n   and a few reusable helper classes the cards/kits rely on. */\n\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%;text-size-adjust:100%}\nbody{\n  margin:0;\n  font-family:var(--font-body);\n  font-size:var(--text-base);\n  line-height:var(--lh-relaxed);\n  color:var(--text-body);\n  background:var(--surface-app);\n  font-weight:var(--fw-regular);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n}\n\n/* Headings — Playfair Display SC (brand display serif, small caps) */\nh1,h2,h3,h4,h5,h6{\n  font-family:var(--font-heading);\n  color:var(--text-strong);\n  font-weight:var(--fw-semibold);\n  line-height:var(--lh-snug);\n  letter-spacing:var(--ls-snug);\n  margin:0 0 0.4em;\n  text-wrap:balance;\n}\nh1{font-size:var(--text-3xl);line-height:var(--lh-tight);letter-spacing:var(--ls-tight)}\nh2{font-size:var(--text-2xl)}\nh3{font-size:var(--text-xl)}\nh4{font-size:var(--text-lg)}\np{margin:0 0 1em;text-wrap:pretty}\np:last-child{margin-bottom:0}\n\n/* Links */\na{color:var(--link);text-decoration:none;transition:color var(--dur-fast) var(--ease-standard)}\na:hover{color:var(--link-hover);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;text-decoration-color:var(--gold-500)}\n\n/* Selection */\n::selection{background:var(--select-bg);color:var(--select-fg)}\n\n/* Focus visibility */\n:focus-visible{outline:none;box-shadow:var(--ring-focus)}\n\nstrong,b{font-weight:var(--fw-bold);color:var(--text-strong)}\nsmall{font-size:var(--text-sm)}\nhr{border:0;border-top:1px solid var(--border-subtle);margin:var(--space-6) 0}\nimg{max-width:100%;display:block}\n\n/* ---- Shared helper primitives (used by cards & kits) ---- */\n\n/* Eyebrow / kicker label */\n.hc-eyebrow{\n  font-family:var(--font-eyebrow);\n  font-size:var(--text-xs);\n  font-weight:var(--fw-semibold);\n  letter-spacing:var(--ls-eyebrow);\n  text-transform:uppercase;\n  color:var(--brand-primary-strong);\n}\n.hc-eyebrow--on-ink{color:var(--gold-400)}\n\n/* Gold baseline underline accent — the heron's blue/gold ground line */\n.hc-underline{position:relative;display:inline-block}\n.hc-underline::after{\n  content:\"\";position:absolute;left:0;right:0;bottom:-6px;height:var(--accent-underline);\n  background:var(--gold-500);border-radius:2px;\n}\n\n/* Section container */\n.hc-container{max-width:var(--container-max);margin-inline:auto;padding-inline:var(--gutter)}\n\n<\u002Fstyle>\n  <script src=\"c71d3c3e-eca2-476f-976f-03596d9ef1cc\"><\u002Fscript>\n  <style>\n    body{margin:0;color:#F3EEE4;font-family:'Archivo',sans-serif;\n      background:radial-gradient(1000px 520px at 75% -10%,rgba(232,168,74,.07),transparent 60%),\n                 radial-gradient(800px 480px at -8% 110%,rgba(62,127,224,.06),transparent 60%),#05122E;\n      background-attachment:fixed}\n    ::selection{background:#F8D69B;color:#05122E}\n    a{color:#6BA0EE}a:hover{color:#F2BE6B}\n    input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:#142A57;outline:none;width:100%;cursor:pointer}\n    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#E8A84A;border:2.5px solid #05122E;box-shadow:0 0 0 1.5px #E8A84A,0 3px 8px rgba(0,0,0,.5);cursor:pointer}\n    input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#E8A84A;border:2.5px solid #05122E;box-shadow:0 0 0 1.5px #E8A84A;cursor:pointer}\n    :focus-visible{outline:2px solid #E8A84A;outline-offset:2px;border-radius:4px}\n    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n    ::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#142A57;border-radius:4px}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n\n<header style=\"position:sticky;top:0;z-index:40;background:rgba(5,18,46,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.14)\">\n  <div style=\"height:3px;background:linear-gradient(90deg,#22508F,#3E7FE0 30%,#E8A84A 60%,#A9701F)\"><\u002Fdiv>\n  <div style=\"max-width:1140px;margin:0 auto;padding:14px 20px 0\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:14px;min-width:0\">\n        <img src=\"e6b818a0-5a3c-4e70-adfb-34cf21b499c2\" alt=\"Herron &amp; Co. heron mark\" style=\"width:46px;height:46px;border-radius:9px;border:1px solid rgba(232,168,74,.3)\">\n        <div>\n          <h1 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;color:#fff;letter-spacing:0.01em\">The Protection Blueprint<\u002Fh1>\n          <p style=\"margin:2px 0 0;font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;color:rgba(242,190,107,.85);font-weight:600\">Care &nbsp;·&nbsp; Paycheck &nbsp;·&nbsp; Home &nbsp;·&nbsp; Legacy<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right;font-size:12px;color:#A9B4CC;line-height:1.5;margin-left:auto\">\n        <p style=\"margin:0;font-size:10px;text-transform:uppercase;letter-spacing:0.18em;color:#7A8194\">Prepared for<\u002Fp>\n        <p style=\"margin:0;color:#F8D69B;font-weight:500\">Client name<\u002Fp>\n        <p style=\"margin:0;color:#7A8194;font-family:var(--font-mono);font-size:11px\">{{ today }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"margin-top:10px;display:flex;gap:4px;overflow-x:auto\" role=\"tablist\" aria-label=\"Sections\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <button role=\"tab\" sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\"><span style=\"font-family:var(--font-mono);font-size:10px;opacity:0.6;margin-right:6px\">{{ t.num }}<\u002Fspan>{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"flex:1;max-width:1140px;margin:0 auto;padding:0 20px 56px;width:100%;box-sizing:border-box\">\n\n<!-- ================= 01 · CARE SHIELD ================= -->\n<sc-if value=\"{{ isCare }}\" hint-placeholder-val=\"{{ true }}\">\n<section data-screen-label=\"01 Care Shield\" style=\"padding:36px 0 0;animation:rise .3s ease-out\">\n  <div style=\"text-align:center;margin-bottom:28px\">\n    <x-import component-from-global-scope=\"HerronCoDesignSystem_fd38ab.Eyebrow\" on-ink=\"{{ true }}\" hint-size=\"auto,16px\">Hybrid IUL · long-term care<\u002Fx-import>\n    <h2 style=\"margin:10px 0 0;font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5.5vw,38px);color:#fff;line-height:1.1\">The Care Shield<\u002Fh2>\n    <p style=\"margin:10px auto 0;max-width:640px;color:#A9B4CC;font-size:16px;line-height:1.55\">Indexed universal life with a long-term care engine inside. One premium, three jobs — and someone gets paid no matter how life goes.<\u002Fp>\n    <div style=\"width:64px;height:2px;background:#E8A84A;margin:18px auto 0;border-radius:2px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:28px\">\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:18px 20px\">\n      <p style=\"margin:0;font-family:var(--font-mono);font-size:30px;color:#F8D69B\">7 in 10<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:12.5px;color:#A9B4CC;line-height:1.4\">people turning 65 will need long-term care in their lifetime<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:18px 20px\">\n      <p style=\"margin:0;font-family:var(--font-mono);font-size:30px;color:#F8D69B\">$6,200<span style=\"font-size:15px;color:#A9B4CC\">/mo<\u002Fspan><\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:12.5px;color:#A9B4CC;line-height:1.4\">median assisted-living community — and rising faster than inflation<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:18px 20px\">\n      <p style=\"margin:0;font-family:var(--font-mono);font-size:30px;color:#F8D69B\">$0<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:12.5px;color:#A9B4CC;line-height:1.4\">what Medicare pays toward ongoing custodial care. It was never built for this.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ showSources }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:-18px 0 24px;text-align:center;font-size:11px;color:#565E70\">Care costs: Genworth / CareScout Cost of Care Survey medians, 2024–2025.<\u002Fp><\u002Fsc-if>\n\n  <div style=\"display:flex;justify-content:center;margin-bottom:24px\">\n    <div style=\"display:inline-flex;background:#030A1E;border:1px solid rgba(232,168,74,.25);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap;justify-content:center\" role=\"group\" aria-label=\"Care Shield steps\">\n      <sc-for list=\"{{ careSteps }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isCareStep0 }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:linear-gradient(180deg,#0B1C3F,#081736);border:1px solid rgba(232,168,74,.3);border-radius:16px;padding:32px;animation:rise .3s ease-out\">\n    <h3 style=\"margin:0 0 6px;font-family:var(--font-display);font-weight:700;font-size:24px;color:#F8D69B\">One policy, three jobs<\u002Fh3>\n    <p style=\"margin:0 0 22px;color:#A9B4CC;font-size:14.5px\">Traditional long-term care insurance is use-it-or-lose-it. This isn't. <b style=\"color:#F3EEE4\">Every path leads to a payout.<\u002Fb><\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px\">\n      <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:22px\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8A84A\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.5-1.5 3-3.2 3-5.5A4.5 4.5 0 0 0 17.5 4c-1.8 0-3 .9-3.5 1.5\"><\u002Fpath><path d=\"M12 5.5C11.5 4.9 10.3 4 8.5 4A4.5 4.5 0 0 0 4 8.5c0 3.8 4.4 7 8 10.5 1.2-1.2 2.5-2.3 3.7-3.5\"><\u002Fpath><\u002Fsvg>\n        <h4 style=\"margin:12px 0 6px;font-family:var(--font-display);font-size:17px;color:#fff;font-weight:700\">If you need care<\u002Fh4>\n        <p style=\"margin:0;font-size:13.5px;color:#A9B4CC;line-height:1.6\">The rider accelerates your death benefit into a <b style=\"color:#F3EEE4\">monthly care check<\u002Fb> — home care, assisted living, or a facility. Typically 2–4% of the benefit per month, income-tax-free.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:22px\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8A84A\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 17l5-5 4 4 8-8\"><\u002Fpath><path d=\"M15 8h5v5\"><\u002Fpath><\u002Fsvg>\n        <h4 style=\"margin:12px 0 6px;font-family:var(--font-display);font-size:17px;color:#fff;font-weight:700\">If you never need it<\u002Fh4>\n        <p style=\"margin:0;font-size:13.5px;color:#A9B4CC;line-height:1.6\">Cash value grows with a market index — <b style=\"color:#F3EEE4\">0% floor, gains lock in<\u002Fb> — and you can borrow against it tax-advantaged in retirement. The premium was never wasted.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:22px\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8A84A\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 2 20 5v6c0 5.5-3.5 9.5-8 11-4.5-1.5-8-5.5-8-11V5z\"><\u002Fpath><path d=\"M8.5 11.5 11 14l4.5-5.5\"><\u002Fpath><\u002Fsvg>\n        <h4 style=\"margin:12px 0 6px;font-family:var(--font-display);font-size:17px;color:#fff;font-weight:700\">Whatever's left<\u002Fh4>\n        <p style=\"margin:0;font-size:13.5px;color:#A9B4CC;line-height:1.6\">Passes to your family <b style=\"color:#F3EEE4\">income-tax-free<\u002Fb>. Use some for care, and the rest still lands where you intended it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:18px;padding:14px 18px;background:rgba(232,168,74,.07);border:1px solid rgba(232,168,74,.25);border-radius:10px;font-size:13.5px;color:#D8DCE8;line-height:1.55\">\n      The honest part — care payments <b style=\"color:#F8D69B\">reduce the death benefit dollar-for-dollar<\u002Fb>. You're spending your own benefit early, when you need it most. That's the point.\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCareStep1 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:linear-gradient(180deg,#0B1C3F,#081736);border:1px solid rgba(232,168,74,.3);border-radius:16px;padding:32px;animation:rise .3s ease-out\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start\">\n      <div>\n        <h3 style=\"margin:0 0 12px;font-family:var(--font-display);font-weight:700;font-size:24px;color:#F8D69B\">What turns the benefit on<\u002Fh3>\n        <p style=\"margin:0 0 12px;font-size:15px;color:#D8DCE8;line-height:1.65\">A doctor certifies you can't do <b style=\"color:#fff\">2 of the 6 activities of daily living<\u002Fb> without help — or you have a severe cognitive impairment like Alzheimer's — and the need is expected to last 90 days or more.<\u002Fp>\n        <p style=\"margin:0 0 18px;font-size:14px;color:#A9B4CC;line-height:1.6\">That's it. No hospital stay required, no waiting for \"bad enough.\" Tap two tiles to see it trigger.<\u002Fp>\n        <div style=\"{{ adlPanelStyle }}\">\n          <p style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:{{ adlPanelColor }}\">{{ adlPanelTitle }}<\u002Fp>\n          <p style=\"margin:4px 0 0;font-size:13px;color:#A9B4CC;line-height:1.5\">{{ adlPanelBody }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n          <sc-for list=\"{{ adls }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ a.toggle }}\" style=\"{{ a.style }}\">{{ a.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:11.5px;color:#565E70;text-align:center\">The 6 ADLs — bathing, dressing, eating, toileting, continence, transferring.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:26px;border-top:1px solid rgba(255,255,255,0.1);padding-top:22px\">\n      <h4 style=\"margin:0 0 14px;font-family:var(--font-display);font-size:18px;color:#fff;font-weight:700\">How the check arrives matters<\u002Fh4>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n        <div style=\"background:#030A1E;border:1px solid rgba(232,168,74,.4);border-radius:12px;padding:20px\">\n          <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#F2BE6B\">Indemnity — what we favor<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:13.5px;color:#D8DCE8;line-height:1.6\">The full monthly benefit lands in <b style=\"color:#fff\">your bank account<\u002Fb>. No receipts, no bills to submit. Pay a facility, pay your daughter to care for you, modify the house — your call.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:20px\">\n          <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#A9B4CC\">Reimbursement<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:13.5px;color:#A9B4CC;line-height:1.6\">The carrier repays <b style=\"color:#D8DCE8\">qualified expenses only<\u002Fb>, against monthly bills and receipts. Never pays more than you spent — and family caregivers usually don't count.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCareStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:linear-gradient(180deg,#0B1C3F,#081736);border:1px solid rgba(232,168,74,.3);border-radius:16px;padding:32px;animation:rise .3s ease-out\">\n    <h3 style=\"margin:0 0 6px;font-family:var(--font-display);font-weight:700;font-size:24px;color:#F8D69B\">The rider shelf<\u002Fh3>\n    <p style=\"margin:0 0 22px;color:#A9B4CC;font-size:14.5px\">Riders are the contract's power tools. These are the ones that matter on a hybrid design.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px\">\n      <sc-for list=\"{{ riders }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:20px\">\n          <div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\">\n            <h4 style=\"margin:0;font-family:var(--font-display);font-size:16px;color:#fff;font-weight:700\">{{ r.name }}<\u002Fh4>\n            <span style=\"font-family:var(--font-mono);font-size:10.5px;color:#6BA0EE\">{{ r.tag }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:8px 0 0;font-size:13px;color:#A9B4CC;line-height:1.6\">{{ r.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:16px 0 0;font-size:12px;color:#565E70\">Rider menus, charges, and triggers vary by carrier and state — we compare across 20+ carriers before recommending one.<\u002Fp>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"margin-top:28px;background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:28px\">\n    <h3 style=\"margin:0 0 4px;font-family:var(--font-display);font-weight:700;font-size:22px;color:#fff\">Size the care benefit<\u002Fh3>\n    <p style=\"margin:0 0 22px;font-size:13.5px;color:#A9B4CC\">Move the sliders — the numbers respond in real time.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:26px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><label style=\"font-size:13.5px;color:#D8DCE8\">Death benefit<\u002Flabel><span style=\"font-family:var(--font-mono);font-size:14px;color:#F8D69B\">{{ dbFmt }}<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"250000\" max=\"2000000\" step=\"25000\" value=\"{{ db }}\" sc-camel-on-input=\"{{ setDb }}\" aria-label=\"Death benefit\">\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0 0 8px;font-size:13.5px;color:#D8DCE8\">Monthly acceleration rate<\u002Fp>\n          <div style=\"display:inline-flex;background:#030A1E;border:1px solid rgba(232,168,74,.25);border-radius:999px;padding:4px;gap:4px\">\n            <sc-for list=\"{{ accelBtns }}\" as=\"b\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ b.go }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:8px 0 0;font-size:11.5px;color:#565E70\">2% stretches the pool over ~50 months. 4% doubles the monthly check, ~25 months.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0 0 8px;font-size:13.5px;color:#D8DCE8\">Compare against<\u002Fp>\n          <div style=\"display:inline-flex;background:#030A1E;border:1px solid rgba(232,168,74,.25);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap\">\n            <sc-for list=\"{{ careBtns }}\" as=\"b\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ b.go }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><label style=\"font-size:13.5px;color:#D8DCE8\">Months on claim<\u002Flabel><span style=\"font-family:var(--font-mono);font-size:14px;color:#F8D69B\">{{ claimMonths }} mo<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"0\" max=\"50\" step=\"1\" value=\"{{ claimMonths }}\" sc-camel-on-input=\"{{ setClaim }}\" aria-label=\"Months on claim\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"background:#030A1E;border:1px solid rgba(232,168,74,.4);border-radius:12px;padding:22px;text-align:center\">\n          <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#F2BE6B\">Monthly care check<\u002Fp>\n          <p style=\"margin:6px 0 0;font-family:var(--font-mono);font-size:clamp(30px,6vw,42px);color:#fff;line-height:1\">{{ careMonthlyFmt }}<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:12.5px;color:{{ gapColor }}\">{{ gapLine }}<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ perDiemWarn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:10px 14px;background:rgba(178,58,58,.12);border:1px solid rgba(178,58,58,.4);border-radius:10px;font-size:12px;color:#E8B4B4;line-height:1.5\">Above the IRS per-diem limit — $420/day, roughly $12,800/mo for 2025 — indemnity amounts over it can be taxable unless matched by actual costs. We'd design under the cap.<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n          <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:16px\">\n            <p style=\"margin:0;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:#7A8194\">Benefit pool lasts<\u002Fp>\n            <p style=\"margin:4px 0 0;font-family:var(--font-mono);font-size:22px;color:#F8D69B\">{{ poolMonths }} mo<\u002Fp>\n            <p style=\"margin:2px 0 0;font-size:11px;color:#565E70\">≈ {{ poolYears }} years of care<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:16px\">\n            <p style=\"margin:0;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:#7A8194\">Left for family after {{ claimMonths }} mo<\u002Fp>\n            <p style=\"margin:4px 0 0;font-family:var(--font-mono);font-size:22px;color:#fff\">{{ careRemainFmt }}<\u002Fp>\n            <p style=\"margin:2px 0 0;font-size:11px;color:#565E70\">death benefit remaining<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,0.14)\">\n            <div style=\"{{ careUsedBarStyle }}\"><\u002Fdiv>\n            <div style=\"{{ careRemainBarStyle }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:#7A8194\">\n            <span><span style=\"display:inline-block;width:8px;height:8px;border-radius:2px;background:#E8A84A;margin-right:5px\"><\u002Fspan>Spent on your care · {{ careUsedFmt }}<\u002Fspan>\n            <span><span style=\"display:inline-block;width:8px;height:8px;border-radius:2px;background:#2B4C8C;margin-right:5px\"><\u002Fspan>Passes to family<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:11px;color:#565E70;line-height:1.5\">Hypothetical illustration — the carrier's contract and illustration govern. Cash-value growth not shown here; it rides alongside.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ================= 02 · PAYCHECK SHIELD ================= -->\n<sc-if value=\"{{ isPay }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"02 Paycheck Shield\" style=\"padding:36px 0 0;animation:rise .3s ease-out\">\n  <div style=\"text-align:center;margin-bottom:28px\">\n    <x-import component-from-global-scope=\"HerronCoDesignSystem_fd38ab.Eyebrow\" on-ink=\"{{ true }}\" hint-size=\"auto,16px\">Disability income insurance<\u002Fx-import>\n    <h2 style=\"margin:10px 0 0;font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5.5vw,38px);color:#fff;line-height:1.1\">The Paycheck Shield<\u002Fh2>\n    <p style=\"margin:10px auto 0;max-width:640px;color:#A9B4CC;font-size:16px;line-height:1.55\">Your ability to earn is the asset every other plan depends on. This is the policy that keeps the paycheck coming when you can't work.<\u002Fp>\n    <div style=\"width:64px;height:2px;background:#E8A84A;margin:18px auto 0;border-radius:2px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:28px\">\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:18px 20px\">\n      <p style=\"margin:0;font-family:var(--font-mono);font-size:30px;color:#F8D69B\">1 in 4<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:12.5px;color:#A9B4CC;line-height:1.4\">of today's 20-year-olds will be out of work a year or more before retirement (SSA)<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:18px 20px\">\n      <p style=\"margin:0;font-family:var(--font-mono);font-size:30px;color:#F8D69B\">~90%<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:12.5px;color:#A9B4CC;line-height:1.4\">of long-term disabilities come from illness — cancer, heart disease, back — not accidents<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:18px 20px\">\n      <p style=\"margin:0;font-family:var(--font-mono);font-size:30px;color:#F8D69B\">$1,540<span style=\"font-size:15px;color:#A9B4CC\">/mo<\u002Fspan><\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:12.5px;color:#A9B4CC;line-height:1.4\">average Social Security disability check (2025) — after a 5-month wait and a strict definition<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:28px\">\n    <div style=\"background:#0B1C3F;border:1px solid rgba(232,168,74,.4);border-radius:16px;padding:24px\">\n      <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#F2BE6B\">Own occupation — the definition we fight for<\u002Fp>\n      <p style=\"margin:10px 0 0;font-size:14px;color:#D8DCE8;line-height:1.65\">You're disabled if you can't do <b style=\"color:#fff\">your<\u002Fb> job. A surgeon with a hand tremor collects — even if she could teach. Your specialty is what you insured.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:24px\">\n      <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#A9B4CC\">Any occupation — what group plans quietly become<\u002Fp>\n      <p style=\"margin:10px 0 0;font-size:14px;color:#A9B4CC;line-height:1.65\">You only collect if you can't do <b style=\"color:#D8DCE8\">any<\u002Fb> job. The same surgeon gets nothing, because she could answer phones. Read the definition before you trust the plan.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-bottom:28px;padding:16px 20px;background:rgba(232,168,74,.07);border:1px solid rgba(232,168,74,.25);border-radius:12px;font-size:13.5px;color:#D8DCE8;line-height:1.6\">\n    Straight talk on workplace coverage — group plans usually replace 40–60% of base salary, the benefit is <b style=\"color:#F8D69B\">taxable<\u002Fb> if the employer pays the premium, and it doesn't follow you out the door. It's a foundation, not a plan.\n  <\u002Fdiv>\n\n  <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:28px\">\n    <h3 style=\"margin:0 0 4px;font-family:var(--font-display);font-weight:700;font-size:22px;color:#fff\">Design the paycheck<\u002Fh3>\n    <p style=\"margin:0 0 22px;font-size:13.5px;color:#A9B4CC\">Individual coverage, premiums paid after tax — so the benefit arrives tax-free.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:26px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><label style=\"font-size:13.5px;color:#D8DCE8\">Age today<\u002Flabel><span style=\"font-family:var(--font-mono);font-size:14px;color:#F8D69B\">{{ diAge }}<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"25\" max=\"60\" step=\"1\" value=\"{{ diAge }}\" sc-camel-on-input=\"{{ setDiAge }}\" aria-label=\"Age today\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><label style=\"font-size:13.5px;color:#D8DCE8\">Annual income<\u002Flabel><span style=\"font-family:var(--font-mono);font-size:14px;color:#F8D69B\">{{ diIncomeFmt }}<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"30000\" max=\"300000\" step=\"5000\" value=\"{{ diIncome }}\" sc-camel-on-input=\"{{ setDiIncome }}\" aria-label=\"Annual income\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><label style=\"font-size:13.5px;color:#D8DCE8\">Income replaced<\u002Flabel><span style=\"font-family:var(--font-mono);font-size:14px;color:#F8D69B\">{{ diRepl }}%<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"40\" max=\"70\" step=\"5\" value=\"{{ diRepl }}\" sc-camel-on-input=\"{{ setDiRepl }}\" aria-label=\"Income replaced\">\n          <p style=\"margin:6px 0 0;font-size:11.5px;color:#565E70\">Carriers cap around 60–70% — tax-free, that's most of a take-home paycheck.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0 0 8px;font-size:13.5px;color:#D8DCE8\">Elimination period <span style=\"color:#565E70\">(the deductible, in time)<\u002Fspan><\u002Fp>\n          <div style=\"display:inline-flex;background:#030A1E;border:1px solid rgba(232,168,74,.25);border-radius:999px;padding:4px;gap:4px\">\n            <sc-for list=\"{{ elimBtns }}\" as=\"b\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ b.go }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:8px 0 0;font-size:11.5px;color:#565E70\">{{ elimNote }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"background:#030A1E;border:1px solid rgba(232,168,74,.4);border-radius:12px;padding:22px;text-align:center\">\n          <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#F2BE6B\">Tax-free monthly benefit<\u002Fp>\n          <p style=\"margin:6px 0 0;font-family:var(--font-mono);font-size:clamp(30px,6vw,42px);color:#fff;line-height:1\">{{ diMonthlyFmt }}<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:12.5px;color:#A9B4CC\">payable to age 65 while you're disabled — own-occupation definition<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n          <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:16px\">\n            <p style=\"margin:0;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:#7A8194\">Benefit pool to 65<\u002Fp>\n            <p style=\"margin:4px 0 0;font-family:var(--font-mono);font-size:22px;color:#F8D69B\">{{ diPoolFmt }}<\u002Fp>\n            <p style=\"margin:2px 0 0;font-size:11px;color:#565E70\">{{ diYears }} years × 12 checks<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:16px\">\n            <p style=\"margin:0;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:#7A8194\">Earnings you're protecting<\u002Fp>\n            <p style=\"margin:4px 0 0;font-family:var(--font-mono);font-size:22px;color:#fff\">{{ diLifetimeFmt }}<\u002Fp>\n            <p style=\"margin:2px 0 0;font-size:11px;color:#565E70\">to age 65, before any raises<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:16px\">\n          <p style=\"margin:0;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:#7A8194\">What it typically costs<\u002Fp>\n          <p style=\"margin:4px 0 0;font-family:var(--font-mono);font-size:18px;color:#D8DCE8\">{{ diPremFmt }}<span style=\"font-size:12px;color:#7A8194\"> /year<\u002Fspan><\u002Fp>\n          <p style=\"margin:4px 0 0;font-size:11.5px;color:#565E70;line-height:1.5\">Rule of thumb: 1–3% of income, set by age, health, occupation class, and the riders you choose (residual benefit, cost-of-living, future increase).<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:11px;color:#565E70;line-height:1.5\">Estimates only — underwriting and the carrier's contract govern. Benefits shown assume premiums paid with after-tax dollars.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ================= 03 · HOME SHIELD ================= -->\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"03 Home Shield\" style=\"padding:36px 0 0;animation:rise .3s ease-out\">\n  <div style=\"text-align:center;margin-bottom:28px\">\n    <x-import component-from-global-scope=\"HerronCoDesignSystem_fd38ab.Eyebrow\" on-ink=\"{{ true }}\" hint-size=\"auto,16px\">Mortgage protection · living benefits<\u002Fx-import>\n    <h2 style=\"margin:10px 0 0;font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5.5vw,38px);color:#fff;line-height:1.1\">The Home Shield<\u002Fh2>\n    <p style=\"margin:10px auto 0;max-width:640px;color:#A9B4CC;font-size:16px;line-height:1.55\">Term life sized to your mortgage — that pays your family, not the bank, and pays <b style=\"color:#F3EEE4\">you<\u002Fb> if a serious illness stops your income.<\u002Fp>\n    <div style=\"width:64px;height:2px;background:#E8A84A;margin:18px auto 0;border-radius:2px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:28px\">\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:18px 20px\">\n      <p style=\"margin:0;font-family:var(--font-mono);font-size:30px;color:#F8D69B\">~48%<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:12.5px;color:#A9B4CC;line-height:1.4\">of foreclosures followed a health crisis the owner survived (widely-cited Harvard-affiliated study) — cancer, heart attack, stroke<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:18px 20px\">\n      <p style=\"margin:0;font-family:var(--font-mono);font-size:30px;color:#F8D69B\">~3%<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:12.5px;color:#A9B4CC;line-height:1.4\">follow a death. The bigger risk to your home is surviving something expensive.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:18px 20px\">\n      <p style=\"margin:0;font-family:var(--font-display);font-size:19px;color:#F8D69B;line-height:1.25\">Insurance you don't have to die to use<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:12.5px;color:#A9B4CC;line-height:1.4\">living-benefit riders are often built in at no extra premium<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:28px;margin-bottom:28px\">\n    <h3 style=\"margin:0 0 16px;font-family:var(--font-display);font-weight:700;font-size:22px;color:#fff\">The bank's version vs. yours<\u002Fh3>\n    <div style=\"overflow-x:auto\"><div style=\"display:grid;grid-template-columns:1.1fr 1fr 1.3fr;gap:0;min-width:620px;border:1px solid rgba(255,255,255,0.12);border-radius:12px;overflow:hidden;font-size:13px\">\n      <div style=\"padding:12px 16px;background:#030A1E;color:#7A8194;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.1em\"><\u002Fdiv>\n      <div style=\"padding:12px 16px;background:#030A1E;color:#A9B4CC;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.1em\">Lender's mortgage insurance<\u002Fdiv>\n      <div style=\"padding:12px 16px;background:#030A1E;color:#F2BE6B;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.1em\">Level term + living benefits<\u002Fdiv>\n      <sc-for list=\"{{ compareRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n        <div style=\"padding:13px 16px;border-top:1px solid rgba(255,255,255,0.08);color:#D8DCE8;font-weight:600\">{{ row.aspect }}<\u002Fdiv>\n        <div style=\"padding:13px 16px;border-top:1px solid rgba(255,255,255,0.08);color:#7A8194;line-height:1.5\">{{ row.bank }}<\u002Fdiv>\n        <div style=\"padding:13px 16px;border-top:1px solid rgba(255,255,255,0.08);color:#D8DCE8;line-height:1.5;background:rgba(232,168,74,.04)\">{{ row.ours }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:28px\">\n    <h3 style=\"margin:0 0 4px;font-family:var(--font-display);font-weight:700;font-size:22px;color:#fff\">Protect the house — run your numbers<\u002Fh3>\n    <p style=\"margin:0 0 22px;font-size:13.5px;color:#A9B4CC\">Then run the scenario most policies never talk about.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:26px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><label style=\"font-size:13.5px;color:#D8DCE8\">Mortgage balance<\u002Flabel><span style=\"font-family:var(--font-mono);font-size:14px;color:#F8D69B\">{{ mtgBalFmt }}<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"50000\" max=\"1000000\" step=\"10000\" value=\"{{ mtgBal }}\" sc-camel-on-input=\"{{ setMtgBal }}\" aria-label=\"Mortgage balance\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><label style=\"font-size:13.5px;color:#D8DCE8\">Monthly payment<\u002Flabel><span style=\"font-family:var(--font-mono);font-size:14px;color:#F8D69B\">{{ mtgPayFmt }}<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"500\" max=\"7000\" step=\"50\" value=\"{{ mtgPay }}\" sc-camel-on-input=\"{{ setMtgPay }}\" aria-label=\"Monthly payment\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><label style=\"font-size:13.5px;color:#D8DCE8\">Critical-illness acceleration<\u002Flabel><span style=\"font-family:var(--font-mono);font-size:14px;color:#F8D69B\">{{ ciPct }}%<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"10\" max=\"50\" step=\"5\" value=\"{{ ciPct }}\" sc-camel-on-input=\"{{ setCiPct }}\" aria-label=\"Critical illness acceleration percent\">\n          <p style=\"margin:6px 0 0;font-size:11.5px;color:#565E70\">Share of the death benefit you elect to take early on a qualifying diagnosis. Contract maximums vary by carrier and severity.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0 0 8px;font-size:13.5px;color:#D8DCE8\">Run a living-benefit scenario<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <sc-for list=\"{{ scnBtns }}\" as=\"b\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ b.go }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"background:#030A1E;border:1px solid rgba(232,168,74,.4);border-radius:12px;padding:22px;text-align:center\">\n          <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#F2BE6B\">Coverage sized to the house<\u002Fp>\n          <p style=\"margin:6px 0 0;font-family:var(--font-mono);font-size:clamp(30px,6vw,42px);color:#fff;line-height:1\">{{ mtgBalFmt }}<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:12.5px;color:#A9B4CC\">level for the full term · your family is the beneficiary · paid income-tax-free<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ scnOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:rgba(232,168,74,.07);border:1px solid rgba(232,168,74,.35);border-radius:12px;padding:20px;animation:rise .3s ease-out\">\n            <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#F2BE6B\">{{ scnTitle }}<\u002Fp>\n            <p style=\"margin:10px 0 0;font-size:14px;color:#D8DCE8;line-height:1.65\">{{ scnBody }}<\u002Fp>\n            <p style=\"margin:10px 0 0;font-family:var(--font-mono);font-size:32px;color:#F8D69B\">{{ scnBig }}<\u002Fp>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:#D8DCE8;line-height:1.6\">{{ scnSub }}<\u002Fp>\n            <p style=\"margin:10px 0 0;font-size:11.5px;color:#565E70;line-height:1.5\">{{ scnNote }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;font-size:12px\">\n          <div style=\"padding:12px 8px;background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:10px\"><p style=\"margin:0;color:#F8D69B;font-weight:600\">Terminal<\u002Fp><p style=\"margin:4px 0 0;color:#7A8194;line-height:1.4\">12–24 mo prognosis unlocks most of the benefit<\u002Fp><\u002Fdiv>\n          <div style=\"padding:12px 8px;background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:10px\"><p style=\"margin:0;color:#F8D69B;font-weight:600\">Chronic<\u002Fp><p style=\"margin:4px 0 0;color:#7A8194;line-height:1.4\">2 of 6 ADLs — same trigger as the Care Shield<\u002Fp><\u002Fdiv>\n          <div style=\"padding:12px 8px;background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:10px\"><p style=\"margin:0;color:#F8D69B;font-weight:600\">Critical<\u002Fp><p style=\"margin:4px 0 0;color:#7A8194;line-height:1.4\">lump sum on heart attack, stroke, invasive cancer<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:11px;color:#565E70;line-height:1.5\">Accelerations reduce the death benefit and may be subject to carrier limits, discounting, and administrative fees. Hypothetical illustration only.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ================= 04 · LEGACY SHIELD ================= -->\n<sc-if value=\"{{ isLegacy }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"04 Legacy Shield\" style=\"padding:36px 0 0;animation:rise .3s ease-out\">\n  <div style=\"text-align:center;margin-bottom:28px\">\n    <x-import component-from-global-scope=\"HerronCoDesignSystem_fd38ab.Eyebrow\" on-ink=\"{{ true }}\" hint-size=\"auto,16px\">Final expense · whole life<\u002Fx-import>\n    <h2 style=\"margin:10px 0 0;font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5.5vw,38px);color:#fff;line-height:1.1\">The Legacy Shield<\u002Fh2>\n    <p style=\"margin:10px auto 0;max-width:640px;color:#A9B4CC;font-size:16px;line-height:1.55\">A small whole-life policy with one job: the last bill your family ever gets is already paid.<\u002Fp>\n    <div style=\"width:64px;height:2px;background:#E8A84A;margin:18px auto 0;border-radius:2px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:28px\">\n    <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:24px\">\n      <h3 style=\"margin:0 0 14px;font-family:var(--font-display);font-weight:700;font-size:20px;color:#fff\">What the last bill actually looks like<\u002Fh3>\n      <sc-for list=\"{{ billItems }}\" as=\"b\" hint-placeholder-count=\"4\">\n        <div style=\"margin-bottom:12px\">\n          <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px\"><span style=\"color:#D8DCE8\">{{ b.label }}<\u002Fspan><span style=\"font-family:var(--font-mono);color:#F8D69B\">{{ b.amtFmt }}<\u002Fspan><\u002Fdiv>\n          <div style=\"height:8px;background:#030A1E;border-radius:4px;overflow:hidden\"><div style=\"{{ b.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,0.12);padding-top:12px;margin-top:14px;font-size:14px\">\n        <span style=\"color:#fff;font-weight:600\">A typical all-in total<\u002Fspan><span style=\"font-family:var(--font-mono);color:#fff;font-size:17px\">{{ billTotalFmt }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showSources }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:10px 0 0;font-size:11px;color:#565E70;line-height:1.5\">Funeral median: NFDA (viewing + burial). Other lines are typical ranges — they vary widely by region and choices.<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"background:#0B1C3F;border:1px solid rgba(232,168,74,.35);border-radius:14px;padding:20px\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#F2BE6B\">Three promises<\u002Fp>\n        <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:#D8DCE8;line-height:1.5\">\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#E8A84A\">—<\u002Fspan><span>The premium is <b style=\"color:#fff\">fixed for life<\u002Fb>. It never increases, no matter your health or age.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#E8A84A\">—<\u002Fspan><span>The coverage <b style=\"color:#fff\">never expires<\u002Fb>. Whole life — it pays whether you pass at 71 or 101.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"color:#E8A84A\">—<\u002Fspan><span><b style=\"color:#fff\">No medical exam.<\u002Fb> A few health questions; approval often within days. Ages 50–85.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:20px;font-size:13.5px;color:#A9B4CC;line-height:1.65\">\n        The honest part — if you're healthier or younger, a <b style=\"color:#F3EEE4\">fully underwritten policy is usually cheaper<\u002Fb> per dollar of coverage, and we'll tell you so. And guaranteed-issue policies (no health questions at all) typically pay a graded benefit in the first two years. We shop both before recommending either.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:28px\">\n    <h3 style=\"margin:0 0 4px;font-family:var(--font-display);font-weight:700;font-size:22px;color:#fff\">Right-size the coverage<\u002Fh3>\n    <p style=\"margin:0 0 22px;font-size:13.5px;color:#A9B4CC\">Enough to close every account with dignity — not a dollar of premium more than needed.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:26px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div>\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><label style=\"font-size:13.5px;color:#D8DCE8\">Age today<\u002Flabel><span style=\"font-family:var(--font-mono);font-size:14px;color:#F8D69B\">{{ feAge }}<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"50\" max=\"85\" step=\"1\" value=\"{{ feAge }}\" sc-camel-on-input=\"{{ setFeAge }}\" aria-label=\"Age today\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><label style=\"font-size:13.5px;color:#D8DCE8\">Coverage amount<\u002Flabel><span style=\"font-family:var(--font-mono);font-size:14px;color:#F8D69B\">{{ feCovFmt }}<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"5000\" max=\"50000\" step=\"1000\" value=\"{{ feCov }}\" sc-camel-on-input=\"{{ setFeCov }}\" aria-label=\"Coverage amount\">\n          <p style=\"margin:6px 0 0;font-size:11.5px;color:#565E70\">Most families land between $10,000 and $30,000.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#030A1E;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:16px;font-size:13px;color:#A9B4CC;line-height:1.6\">\n          Included on most plans we write: a <b style=\"color:#D8DCE8\">terminal-illness rider<\u002Fb> at no cost, and the death benefit pays income-tax-free, usually within days of the claim — before the funeral bill is due.\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"background:#030A1E;border:1px solid rgba(232,168,74,.4);border-radius:12px;padding:22px;text-align:center\">\n          <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#F2BE6B\">Ballpark monthly premium<\u002Fp>\n          <p style=\"margin:6px 0 0;font-family:var(--font-mono);font-size:clamp(30px,6vw,42px);color:#fff;line-height:1\">{{ fePremFmt }}<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:12.5px;color:#A9B4CC\">fixed for life — actual rate set by health answers, gender, tobacco use, and carrier<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#7A8194;margin-bottom:6px\"><span>Coverage vs. the typical bill ({{ billTotalFmt }})<\u002Fspan><span style=\"font-family:var(--font-mono);color:{{ feGapColor }}\">{{ feGapLine }}<\u002Fspan><\u002Fdiv>\n          <div style=\"height:14px;background:#030A1E;border:1px solid rgba(255,255,255,0.14);border-radius:7px;overflow:hidden\"><div style=\"{{ feCovBarStyle }}\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:11px;color:#565E70;line-height:1.5\">Ballpark uses industry-typical simplified-issue rates by age. It is not a quote. The carrier's issued policy governs.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ================= 05 · ADVISOR ================= -->\n<sc-if value=\"{{ isAdvisor }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"05 Advisor Mode\" style=\"padding:36px 0 0;animation:rise .3s ease-out\">\n  <sc-if value=\"{{ advisorLocked }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"max-width:430px;margin:48px auto 0;background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:36px;text-align:center\">\n      <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8A84A\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"margin:0 auto\"><rect x=\"5\" y=\"10.5\" width=\"14\" height=\"10\" rx=\"2.5\"><\u002Frect><path d=\"M8 10.5 V7.5 C8 5 9.8 3.5 12 3.5 C14.2 3.5 16 5 16 7.5 V10.5\"><\u002Fpath><circle cx=\"12\" cy=\"15.5\" r=\"1.4\"><\u002Fcircle><\u002Fsvg>\n      <h2 style=\"margin:14px 0 0;font-family:var(--font-display);font-weight:700;font-size:24px;color:#fff\">Advisor mode<\u002Fh2>\n      <p style=\"margin:10px 0 0;font-size:13.5px;color:#A9B4CC;line-height:1.6\">Backstage prep — objections and talk tracks across all four shields. Not designed for client screens.<\u002Fp>\n      <div style=\"margin-top:22px;display:flex;justify-content:center\">\n        <x-import component-from-global-scope=\"HerronCoDesignSystem_fd38ab.Button\" variant=\"gold\" sc-camel-on-click=\"{{ unlockAdvisor }}\" hint-size=\"auto,44px\">I'm the advisor — unlock<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ advisorUnlocked }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"animation:rise .3s ease-out\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px\">\n        <div>\n          <x-import component-from-global-scope=\"HerronCoDesignSystem_fd38ab.Eyebrow\" on-ink=\"{{ true }}\" hint-size=\"auto,16px\">Advisor preparation<\u002Fx-import>\n          <h2 style=\"margin:8px 0 0;font-family:var(--font-display);font-weight:700;font-size:30px;color:#fff\">Objection dashboard<\u002Fh2>\n          <p style=\"margin:6px 0 0;font-size:13.5px;color:#A9B4CC\">Objection → reframe → one-liner. Return to the analogy, not the argument.<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ lockAdvisor }}\" style=\"flex-shrink:0;font-size:12px;color:#7A8194;background:none;border:1px solid #142A57;border-radius:8px;padding:7px 14px;cursor:pointer;font-family:var(--font-sans)\" style-hover=\"color:#D8DCE8;border-color:#2B4C8C\">Lock<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:22px;padding:14px 18px;border:1px solid rgba(178,58,58,.4);background:rgba(178,58,58,.08);border-radius:12px;font-size:12.5px;color:#D8DCE8;line-height:1.6\">\n        <b style=\"color:#E8B4B4\">Compliance first:<\u002Fb> never call an IUL an investment, never guarantee non-guaranteed values, never use \"long-term care\" for a 101(g) chronic-illness rider, and always pair projections with the carrier illustration. Your IMO / state compliance guidance governs.\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ objections }}\" as=\"o\" hint-placeholder-count=\"8\">\n          <div style=\"{{ o.cardStyle }}\">\n            <button sc-camel-on-click=\"{{ o.toggle }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:none;border:none;cursor:pointer;text-align:left;font-family:var(--font-sans)\">\n              <span style=\"font-size:14.5px;font-weight:600;color:#F3EEE4\"><span style=\"font-family:var(--font-mono);font-size:11px;color:#6BA0EE;margin-right:10px\">{{ o.tag }}<\u002Fspan>{{ o.title }}<\u002Fspan>\n              <span style=\"{{ o.chevStyle }}\">▾<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ o.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:0 20px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;font-size:13px\">\n                <div style=\"padding:14px;background:#030A1E;border:1px solid rgba(178,58,58,.3);border-radius:10px\">\n                  <p style=\"margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#E8B4B4\">The objection<\u002Fp>\n                  <p style=\"margin:0;color:#A9B4CC;font-style:italic;line-height:1.55\">“{{ o.objection }}”<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"padding:14px;background:#030A1E;border:1px solid rgba(232,168,74,.3);border-radius:10px\">\n                  <p style=\"margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#F2BE6B\">The reframe<\u002Fp>\n                  <p style=\"margin:0;color:#D8DCE8;line-height:1.55\">{{ o.reframe }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"padding:14px;background:#030A1E;border:1px solid rgba(62,127,224,.35);border-radius:10px\">\n                  <p style=\"margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#6BA0EE\">The one-liner<\u002Fp>\n                  <p style=\"margin:0;color:#fff;font-weight:500;line-height:1.55\">“{{ o.oneliner }}”<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <h3 style=\"margin:32px 0 14px;font-family:var(--font-display);font-weight:700;font-size:20px;color:#F8D69B\">Quick-reference anchors<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px\">\n        <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:16px\"><p style=\"margin:0;font-size:11px;color:#7A8194;text-transform:uppercase;letter-spacing:0.1em\">Care trigger<\u002Fp><p style=\"margin:6px 0 0;font-family:var(--font-display);font-size:15px;color:#fff;line-height:1.4\">2 of 6 ADLs or cognitive impairment, 90+ days<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:16px\"><p style=\"margin:0;font-size:11px;color:#7A8194;text-transform:uppercase;letter-spacing:0.1em\">7702B vs 101(g)<\u002Fp><p style=\"margin:6px 0 0;font-family:var(--font-display);font-size:15px;color:#fff;line-height:1.4\">LTC can be temporary; chronic must be permanent<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:16px\"><p style=\"margin:0;font-size:11px;color:#7A8194;text-transform:uppercase;letter-spacing:0.1em\">DI framing<\u002Fp><p style=\"margin:6px 0 0;font-family:var(--font-display);font-size:15px;color:#fff;line-height:1.4\">Insure the paycheck, not the job title — own-occ<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:16px\"><p style=\"margin:0;font-size:11px;color:#7A8194;text-transform:uppercase;letter-spacing:0.1em\">Home framing<\u002Fp><p style=\"margin:6px 0 0;font-family:var(--font-display);font-size:15px;color:#fff;line-height:1.4\">The bank insured its loan. We insure your family.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <h3 style=\"margin:32px 0 14px;font-family:var(--font-display);font-weight:700;font-size:20px;color:#F8D69B\">The quoting stack<\u002Fh3>\n      <p style=\"margin:-6px 0 14px;font-size:13px;color:#A9B4CC\">Where the accurate numbers come from — ballparks in this app close conversations, these close cases.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px\">\n        <sc-for list=\"{{ quoteTools }}\" as=\"q\" hint-placeholder-count=\"6\">\n          <div style=\"background:#0B1C3F;border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:18px\">\n            <div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\">\n              <h4 style=\"margin:0;font-family:var(--font-display);font-size:16px;color:#fff;font-weight:700\">{{ q.name }}<\u002Fh4>\n              <span style=\"font-family:var(--font-mono);font-size:10.5px;color:#6BA0EE\">{{ q.tag }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:8px 0 0;font-size:13px;color:#A9B4CC;line-height:1.6\">{{ q.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<footer style=\"border-top:1px solid rgba(255,255,255,0.12);background:rgba(3,10,30,.7)\">\n  <p style=\"max-width:1140px;margin:0 auto;padding:14px 20px;font-size:11px;line-height:1.55;color:#565E70;text-align:center\">\n    Hypothetical illustration only — not a guarantee, a projection of actual performance, or an offer of any product. Actual values, benefits, and premiums depend on the carrier's official illustration, contract terms, underwriting, fees, and riders. Accelerated benefits reduce the death benefit and may affect eligibility for public programs. IUL loans reduce cash value and death benefit. Review with a licensed agent and the carrier illustration before making decisions. Herron &amp; Co. Legacy Agency · Connor Herron, licensed producer, NPN 21556594.\n  <\u002Fp>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showAdvisor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Setup&quot;},&quot;defaultTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;care&quot;,&quot;paycheck&quot;,&quot;home&quot;,&quot;legacy&quot;],&quot;default&quot;:&quot;care&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Setup&quot;},&quot;showSources&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Setup&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab: null, careStep: 0, adls: [false,false,false,false,false,false],\n    db: 750000, accel: 2, careSetting: 'assisted', claimMonths: 24,\n    diAge: 40, diIncome: 85000, diRepl: 60, diElim: 90,\n    mtgBal: 350000, mtgPay: 2400, ciPct: 25, scenario: null,\n    feAge: 65, feCov: 15000,\n    advisorUnlocked: false, openObj: -1\n  };\n  rng(key){ return e => this.setState({ [key]: +e.target.value }); }\n  renderVals(){\n    const S = this.state;\n    const fmt = v => '$' + Math.round(v).toLocaleString('en-US');\n    const showAdvisor = false;\n    let tab = S.tab || this.props.defaultTab || 'care';\n    if (tab === 'advisor' && !showAdvisor) tab = 'care';\n\n    const tabDefs = [\n      ['care','The Care Shield','01'], ['paycheck','The Paycheck Shield','02'],\n      ['home','The Home Shield','03'], ['legacy','The Legacy Shield','04']\n    ];\n    if (showAdvisor) tabDefs.push(['advisor','Advisor','05']);\n    const tabs = tabDefs.map(([id,label,num]) => {\n      const on = tab === id;\n      return { label, num, go: () => { this.setState({ tab: id }); window.scrollTo({top:0,behavior:'smooth'}); },\n        style: { padding:'10px 14px', fontSize:13.5, fontWeight:600, background:'none', border:'none', cursor:'pointer',\n          fontFamily:'var(--font-sans)', whiteSpace:'nowrap', borderBottom:'2px solid ' + (on ? '#E8A84A' : 'transparent'),\n          color: on ? '#F8D69B' : '#A9B4CC', transition:'all .18s' } };\n    });\n\n    const seg = on => ({ padding:'8px 15px', borderRadius:999, fontSize:12.5, fontWeight:600, cursor:'pointer',\n      fontFamily:'var(--font-sans)', whiteSpace:'nowrap', border:'none', transition:'all .18s',\n      background: on ? '#E8A84A' : 'transparent', color: on ? '#05122E' : '#A9B4CC' });\n\n    // ---- Care Shield ----\n    const careSteps = ['1 · Three jobs','2 · The trigger','3 · The riders'].map((label,i) => ({\n      label, go: () => this.setState({ careStep: i }), style: seg(S.careStep === i) }));\n    const adlNames = ['Bathing','Dressing','Eating','Toileting','Continence','Transferring'];\n    const adlCount = S.adls.filter(Boolean).length;\n    const triggered = adlCount >= 2;\n    const adls = adlNames.map((label,i) => {\n      const on = S.adls[i];\n      return { label, toggle: () => { const a = S.adls.slice(); a[i] = !a[i]; this.setState({ adls: a }); },\n        style: { padding:'14px 8px', borderRadius:10, fontSize:12.5, fontWeight:600, cursor:'pointer', fontFamily:'var(--font-sans)',\n          border:'1px solid ' + (on ? '#E8A84A' : 'rgba(255,255,255,0.18)'),\n          background: on ? 'rgba(232,168,74,.14)' : '#030A1E', color: on ? '#F8D69B' : '#D8DCE8', transition:'all .18s' } };\n    });\n    const adlPanelStyle = { padding:'14px 18px', borderRadius:10, transition:'all .3s',\n      background: triggered ? 'rgba(47,125,91,.15)' : '#030A1E',\n      border: '1px solid ' + (triggered ? 'rgba(110,200,160,.5)' : 'rgba(255,255,255,0.12)') };\n    const adlPanelColor = triggered ? '#8FD4B4' : '#7A8194';\n    const adlPanelTitle = triggered ? 'Benefit triggered' : 'Benefit locked · ' + adlCount + ' of 2 needed';\n    const adlPanelBody = triggered\n      ? 'A physician certifies the need, the elimination period runs, and the monthly benefit begins — income-tax-free.'\n      : 'Tap the activities a doctor would certify you need help with. Two is all it takes.';\n\n    const riders = [\n      { name:'Long-term care rider', tag:'IRC §7702B', body:'The real thing — pays for home care, assisted living, adult day care, or a facility. Qualifies even if you\\u2019re expected to recover (need lasting 90+ days).' },\n      { name:'Chronic illness rider', tag:'IRC §101(g)', body:'Same 2-of-6 ADL trigger, but the condition must be expected permanent. Often built in at no upfront cost — you pay via a discount at claim time.' },\n      { name:'Critical illness rider', tag:'Acceleration', body:'Lump sum on a major diagnosis — heart attack, stroke, invasive cancer. Cash while you recover, no receipts.' },\n      { name:'Terminal illness rider', tag:'Acceleration', body:'A 12\\u201324 month prognosis unlocks most of the death benefit early — hospice, bucket list, or family time on your terms.' },\n      { name:'Extension of benefits', tag:'Multiplier', body:'On asset-based designs, care payments continue after the full death benefit is spent — 2\\u20133\\u00d7 total care pools are common.' },\n      { name:'Overloan protection', tag:'Tax brake', body:'If retirement loans against cash value run too deep, the brake engages: the policy self-completes instead of lapsing into a tax bill.' }\n    ];\n\n    const careCosts = { home: [6483,'home health aide'], assisted: [6200,'assisted living'], nursing: [10646,'private nursing room'] };\n    const careBtns = [['home','Home aide'],['assisted','Assisted living'],['nursing','Nursing home']].map(([id,label]) => ({\n      label, go: () => this.setState({ careSetting: id }), style: seg(S.careSetting === id) }));\n    const accelBtns = [2,4].map(v => ({ label: v + '% / month', go: () => this.setState({ accel: v }), style: seg(S.accel === v) }));\n    const careMonthly = S.db * S.accel / 100;\n    const [cost, costLabel] = careCosts[S.careSetting];\n    const gap = careMonthly - cost;\n    const poolMonths = Math.round(100 / S.accel);\n    const used = Math.min(S.claimMonths, poolMonths);\n    const usedAmt = careMonthly * used;\n    const remain = Math.max(0, S.db - usedAmt);\n    const usedPct = Math.min(100, used * S.accel);\n\n    // ---- Paycheck Shield ----\n    const elimBtns = [30,90,180].map(v => ({ label: v + ' days', go: () => this.setState({ diElim: v }), style: seg(S.diElim === v) }));\n    const elimNotes = { 30:'Fastest to pay, priciest to own. Worth it only with thin savings.', 90:'The sweet spot for most — big premium savings vs. 30 days.', 180:'Cheapest, but the term',\n        body:'You survive \\u2014 but recovery takes months and the paycheck stops first. The critical-illness rider accelerates ' + S.ciPct + '% of the benefit as a lump sum. Cash, to you, no receipts:',\n        big: fmt(ciLump),\n        sub: moOf(ciLump) + ' months of mortgage payments while you recover. ' + fmt(S.mtgBal - ciLump) + ' stays in force for your family.',\n        note:'Covered conditions are contract-defined (heart attack, stroke, invasive cancer, organ failure, and more). Most contracts require surviving ~30 days past diagnosis, and the amount actually paid is set by age and severity at claim.' },\n      stroke: { title:'Stroke \\u2014 mid-term',\n        body:'Rehab measures in months, not weeks. The critical-illness rider accelerates ' + S.ciPct + '% as a lump sum:',\n        big: fmt(ciLump),\n        sub: moOf(ciLump) + ' months of payments covered while you relearn the routine. ' + fmt(S.mtgBal - ciLump) + ' remains in force.',\n        note:'Same critical-illness trigger \\u2014 severity tiers (minor to life-threatening) affect the payout on many contracts.' },\n      cancer: { title:'Invasive cancer \\u2014 treatment year',\n        body:'Treatment, travel, and time off work hit at once. The rider accelerates ' + S.ciPct + '% as a lump sum \\u2014 spend it on care, the mortgage, or both:',\n        big: fmt(ciLump),\n        sub: moOf(ciLump) + ' months of payments. ' + fmt(S.mtgBal - ciLump) + ' stays in force for your family.',\n        note:'Most contracts cover invasive cancers; early-stage skin cancers are typically excluded. Survival period ~30 days.' },\n      chronic: { title:'Chronic illness \\u2014 can\\u2019t do 2 of 6 ADLs',\n        body:'A doctor certifies you need help with 2 of 6 daily activities, expected to last 90+ days. The chronic-illness rider pays a monthly benefit \\u2014 typically ~2% of the face amount:',\n        big: fmt(S.mtgBal * 0.02) + '/mo',\n        sub: (S.mtgPay > 0 ? (S.mtgBal * 0.02 / S.mtgPay).toFixed(1) : '\\u2014') + '\\u00d7 your monthly payment, month after month \\u2014 the house stays paid while you\\u2019re cared for.',\n        note:'Same ADL trigger as the Care Shield. Payments reduce the death benefit as they\\u2019re taken.' },\n      terminal: { title:'Terminal illness \\u2014 12\\u201324 month prognosis',\n        body:'A physician certifies a limited life expectancy. Up to 90\\u2013100% of the benefit unlocks early:',\n        big: fmt(S.mtgBal * 0.9),\n        sub: 'Pay the house off outright and spend the time on your terms \\u2014 or keep the cash: that\\u2019s ' + moOf(S.mtgBal * 0.9) + ' months of payments.',\n        note:'Usually included at no extra premium. Accelerated amounts may be discounted and reduce what remains at death.' }\n    };\n    const scn = scnMap[S.scenario];\n    const quoteTools = [\n      { name:'WinFlex', tag:'IUL \\u00b7 WL \\u00b7 illustrations', body:'The industry\\u2019s go-to for multi-carrier permanent-product illustrations \\u2014 run the hybrid IUL/LTC and whole-life numbers here. Free to agents; access comes through a carrier or IMO.' },\n      { name:'Compulife', tag:'Term \\u00b7 FE rate shopping', body:'The accuracy benchmark for rate comparison \\u2014 170+ carriers, 800+ products, including final expense and no-lapse UL. Roughly $110\\u2013$390/yr.' },\n      { name:'iPipeline LifePipe', tag:'Term \\u00b7 GUL + drop ticket', body:'The most-used quoting engine in the industry \\u2014 60+ carriers, and it feeds straight into carrier drop-ticket eApps.' },\n      { name:'Ensight', tag:'Client-facing proposals', body:'Cloud platform that turns multi-carrier quotes into clean, compliant client presentations. From ~$99/user/mo.' },\n      { name:'Back9 Quote & Apply', tag:'Quote \\u2192 eSign', body:'Simplest path from quote to eSigned application \\u2014 free when BackNine is the general agency.' },\n      { name:'Carrier illustration', tag:'The final word', body:'No engine replaces the carrier\\u2019s own AG49-compliant illustration \\u2014 it\\u2019s the only number you may present as the policy.' }\n    ];\n\n    // ---- Legacy Shield ----\n    const billData = [ ['Funeral with viewing & burial', 8300], ['Burial vault (often required)', 1700], ['Plot, opening & marker', 2800], ['Last medical, legal & travel', 2200] ];\n    const billTotal = billData.reduce((s,[,v]) => s + v, 0);\n    const billMax = billData[0][1];\n    const billItems = billData.map(([label,amt]) => ({ label, amtFmt: fmt(amt),\n      barStyle: { width: (amt / billMax * 100) + '%', height:'100%', background:'#E8A84A', borderRadius:4, opacity:0.9 } }));\n    const feRate = 3.4 * Math.pow(1.058, S.feAge - 50);\n    const fePremMid = S.feCov / 1000 * feRate;\n    const fePremFmt = fmt(fePremMid * 0.85) + '\\u2013' + fmt(fePremMid * 1.2);\n    const feGap = S.feCov - billTotal;\n    const feCovPct = Math.min(100, S.feCov / billTotal * 100);\n\n    // ---- Advisor ----\n    const OBJ = [\n      { tag:'CARE', title:'\\u201cLTC insurance is use-it-or-lose-it.\\u201d',\n        objection:'I could pay premiums for 30 years and never need care. That money\\u2019s just gone.',\n        reframe:'True for traditional standalone LTC \\u2014 and it\\u2019s why people hate it. The hybrid flips it: if you never claim, the cash value grew tax-advantaged and the death benefit pays your family. Walk the three doors on the Care Shield tab \\u2014 every path pays someone you chose.',\n        oneliner:'Someone gets a check no matter what \\u2014 the only question is who.' },\n      { tag:'CARE', title:'\\u201cMedicare will cover it.\\u201d',\n        objection:'I already pay for Medicare. Why would I buy care coverage twice?',\n        reframe:'Medicare covers up to ~100 days of skilled rehab after a hospital stay \\u2014 not the years of custodial help most people actually need. Medicaid pays only after assets are spent down to poverty level, in the facility that takes Medicaid. Show the $0 stat card and let it
